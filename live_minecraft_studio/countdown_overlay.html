<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:"Yu Gothic UI",Meiryo,sans-serif}.stage{position:fixed;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.86);transition:opacity .15s,transform .15s}.stage.show{opacity:1;transform:scale(1)}.panel{text-align:center;color:#fff;text-shadow:0 5px 8px #000,0 0 22px #e5143c}.label{font-size:clamp(34px,4vw,72px);font-weight:900}.seconds{font-size:clamp(130px,22vw,360px);line-height:.9;font-weight:1000}.unit{font-size:clamp(28px,3vw,58px);font-weight:900}.success .label{font-size:clamp(55px,7vw,120px);color:#78ffac;text-shadow:0 5px 8px #000,0 0 28px #19d765}.success .seconds,.success .unit{display:none}
</style></head><body><div id="stage" class="stage"><div id="panel" class="panel"><div id="label" class="label">WINまで</div><div id="seconds" class="seconds"></div><div class="unit">秒</div></div></div><script>
const stage=document.getElementById('stage'),panel=document.getElementById('panel'),label=document.getElementById('label'),seconds=document.getElementById('seconds');let rounds=-1,successUntil=0;
async function update(){try{const r=await fetch('/api/overlay',{cache:'no-store'}),s=await r.json(),a=s.game.arena,now=Date.now();if(rounds<0)rounds=a.completedRounds||0;if((a.completedRounds||0)>rounds){rounds=a.completedRounds;successUntil=now+2500}if(now<successUntil){stage.classList.add('show');panel.classList.add('success');label.textContent=s.overlay?.successText||'WIN！';return}panel.classList.remove('success');label.textContent='WINまで';if(a.defending){seconds.textContent=a.holdRemainingSeconds;stage.classList.add('show')}else stage.classList.remove('show')}catch(e){stage.classList.remove('show')}}update();setInterval(update,200);
</script></body></html>
