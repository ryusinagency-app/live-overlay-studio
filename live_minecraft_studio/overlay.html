<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font-family:"Yu Gothic UI",Meiryo,sans-serif}.wrap{width:620px;padding:18px;border-radius:20px;background:#080a0fe0;border:2px solid #ef334e}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:26px;font-weight:900}.fever{font-size:23px;color:#ffd348;font-weight:900}.label{display:flex;justify-content:space-between;margin:15px 0 5px}.bar{height:20px;border-radius:20px;background:#272b35;overflow:hidden}.bar i{display:block;height:100%;transition:width .35s;background:linear-gradient(90deg,#ef334e,#ffb03a)}#fillBar{background:#35bc75}.defend{margin-top:13px;color:#8ff4b5;font-size:20px;font-weight:800}.shield{color:#72c8ff}
</style></head><body><div class="wrap"><div class="top"><div class="title">⛏ 埋め立て</div><div id="fever" class="fever"></div></div><div class="label"><b>埋め立て</b><span id="fillText"></span></div><div class="bar"><i id="fillBar"></i></div><div id="floorHealth"><div class="label"><b>底の耐久</b><span id="healthText"></span></div><div class="bar"><i id="healthBar"></i></div></div><div id="defend" class="defend"></div><div id="shield" class="shield"></div></div><script>
const $=id=>document.getElementById(id),seen=new Set();
function colorAlpha(color,opacity){const c=/^#[0-9a-f]{6}$/i.test(color)?color:'#080a0f';return c+Math.round(Math.max(0,Math.min(100,Number(opacity)||0))*2.55).toString(16).padStart(2,'0')}
function applyStyle(style={}){const w=document.querySelector('.wrap');w.style.width=(style.width||620)+'px';w.style.padding=(style.padding??18)+'px';w.style.borderRadius=(style.borderRadius??20)+'px';w.style.background=colorAlpha(style.backgroundColor||'#080a0f',style.backgroundOpacity??88);w.style.borderColor=style.borderColor||'#ef334e';w.style.color=style.textColor||'#ffffff';document.querySelector('.title').style.fontSize=(style.titleFontSize||26)+'px';document.querySelectorAll('.label,.shield').forEach(e=>e.style.fontSize=(style.textFontSize||16)+'px');$('fillBar').style.background=style.accentColor||'#35bc75'}
function claimSound(id){try{const key='lms-sound-'+id;if(localStorage.getItem(key))return false;localStorage.setItem(key,String(Date.now()));return true}catch(e){return true}}
function playSound(e){if(!e.soundUrl||!claimSound(e.eventId))return;const audio=new Audio(e.soundUrl);audio.volume=Math.max(0,Math.min(1,Number(e.soundVolume??100)/100));audio.play().catch(()=>{});const seconds=Number(e.soundSeconds||0);if(seconds>0)setTimeout(()=>{audio.pause();audio.currentTime=0},seconds*1000)}
async function update(){try{const s=await(await fetch('/api/overlay',{cache:'no-store'})).json(),a=s.game.arena,m=s.game.multiplier;applyStyle(s.overlay?.arenaStyle);$('fillText').textContent=a.topLayerWin?'':`${a.filled} / ${a.capacity}`;$('fillBar').parentElement.hidden=!!a.topLayerWin;$('fillBar').style.width=(a.filled/a.capacity*100)+'%';$('floorHealth').hidden=!a.floorEnabled;$('healthText').textContent=`${a.health} / ${a.maxHealth}`;$('healthBar').style.width=(a.health/a.maxHealth*100)+'%';$('fever').textContent=m.active?`🔥 ${m.multiplier}倍 ${m.remainingSeconds}秒`:`次の倍率まで ${m.progress}/${m.threshold}`;$('defend').textContent=a.defending?`カウント残り ${a.holdRemainingSeconds}秒`:`現在のカウント数：${a.holdSeconds}秒`;$('shield').textContent=a.shieldCharges?`🛡 シールド ×${a.shieldCharges}`:'';for(const e of s.game.announcements||[]){if(seen.has(e.eventId))continue;seen.add(e.eventId);if(Date.now()/1000-e.at<15)playSound(e)}if(seen.size>1000){const latest=[...seen].slice(-100);seen.clear();latest.forEach(id=>seen.add(id))}}catch(e){}}
update();setInterval(update,500)
</script></body></html>
