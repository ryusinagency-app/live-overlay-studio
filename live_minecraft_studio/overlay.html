<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font-family:"Yu Gothic UI",Meiryo,sans-serif}.wrap{width:620px;padding:18px;border-radius:20px;background:rgba(8,10,15,.88);border:2px solid #ef334e}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:26px;font-weight:900}.fever{font-size:23px;color:#ffd348;font-weight:900}.label{display:flex;justify-content:space-between;margin:15px 0 5px}.bar{height:20px;border-radius:20px;background:#272b35;overflow:hidden}.bar i{display:block;height:100%;transition:width .35s;background:linear-gradient(90deg,#ef334e,#ffb03a)}#fillBar{background:linear-gradient(90deg,#35bc75,#68e6a2)}.defend{margin-top:13px;color:#8ff4b5;font-size:20px;font-weight:800}.shield{color:#72c8ff}</style></head><body><div class="wrap"><div class="top"><div class="title">⛏ 埋め立て防衛</div><div id="fever" class="fever"></div></div><div class="label"><b>埋め立て</b><span id="fillText"></span></div><div class="bar"><i id="fillBar"></i></div><div class="label"><b>耐久</b><span id="healthText"></span></div><div class="bar"><i id="healthBar"></i></div><div id="defend" class="defend"></div><div id="shield" class="shield"></div></div><script>const $=id=>document.getElementById(id);async function update(){try{const r=await fetch('/api/overlay',{cache:'no-store'}),s=await r.json(),a=s.game.arena,m=s.game.multiplier;$('fillText').textContent=`${a.filled} / ${a.capacity}`;$('fillBar').style.width=(a.filled/a.capacity*100)+'%';$('healthText').textContent=`${a.health} / ${a.maxHealth}`;$('healthBar').style.width=(a.health/a.maxHealth*100)+'%';$('fever').textContent=m.active?`🔥 ${m.multiplier}倍 ${m.remainingSeconds}秒`:`次の倍率まで ${m.progress}/${m.threshold}`;$('defend').textContent=a.defending?`防衛成功まで ${a.holdRemainingSeconds}秒`:'全埋めで防衛カウント開始';$('shield').textContent=a.shieldCharges?`🛡 シールド ×${a.shieldCharges}`:''}catch(e){}}update();setInterval(update,1000)</script></body></html>
