<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:"Yu Gothic UI",Meiryo,sans-serif;color:#fff}.grid{display:grid;grid-template-columns:repeat(5,180px);gap:8px;padding:8px}.card{height:180px;border:2px solid #ef334e;border-radius:14px;background:linear-gradient(145deg,rgba(68,29,91,.94),rgba(139,66,20,.94));padding:10px;text-align:center;display:flex;flex-direction:column;justify-content:center}.card img{width:74px;height:74px;object-fit:contain;margin:0 auto}.name{font-size:18px;font-weight:900;text-shadow:0 2px 2px #000}.desc{font-size:13px;margin-top:5px;text-shadow:0 1px 2px #000}</style></head><body><div id="grid" class="grid"></div><script>const grid=document.getElementById('grid');async function update(){try{const r=await fetch('/api/overlay',{cache:'no-store'}),s=await r.json();grid.replaceChildren(...s.effects.map(e=>{const c=document.createElement('div');c.className='card';if(e.giftImageUrl){const i=document.createElement('img');i.src=e.giftImageUrl;c.append(i)}const n=document.createElement('div');n.className='name';n.textContent=e.name||e.giftName||'ギフト効果';const d=document.createElement('div');d.className='desc';d.textContent=e.description||'';c.append(n,d);return c}))}catch(e){}}update();setInterval(update,5000)</script></body></html>
