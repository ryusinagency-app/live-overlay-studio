<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:"Yu Gothic UI",Meiryo,sans-serif}.stage{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:.25s}.stage.show{opacity:1}.panel{width:min(920px,92vw);padding:24px;border:3px solid #ef334e;border-radius:24px;background:linear-gradient(145deg,rgba(29,13,40,.96),rgba(102,30,24,.96));box-shadow:0 0 40px #ef334e88;text-align:center}.gacha{font-size:42px;font-weight:900;text-shadow:0 3px 8px #000}.sender{font-size:25px;color:#ffd7dd;margin:6px 0 18px}.window{height:150px;overflow:hidden;border:4px solid #ffd34e;border-radius:16px;background:#090a0e;position:relative}.window:before,.window:after{content:"";position:absolute;left:0;right:0;height:44px;z-index:2;pointer-events:none}.window:before{top:0;background:linear-gradient(#090a0e,transparent)}.window:after{bottom:0;background:linear-gradient(transparent,#090a0e)}.reel{position:absolute;left:0;right:0;top:45px}.item{height:60px;display:grid;place-items:center;font-size:34px;font-weight:900;color:#fff}.result{min-height:56px;margin-top:15px;font-size:34px;font-weight:900;color:#a4f4bf;text-shadow:0 0 16px #30dd79}.continue{font-size:29px;font-weight:900;color:#ffd34e;opacity:0}.continue.show{opacity:1;animation:pulse .6s infinite alternate}@keyframes pulse{to{transform:scale(1.08);text-shadow:0 0 24px #ffd34e}}
</style></head><body><div id="stage" class="stage"><div class="panel"><div id="gacha" class="gacha"></div><div id="sender" class="sender"></div><div class="window"><div id="reel" class="reel"></div></div><div id="result" class="result"></div><div id="continued" class="continue"></div></div></div><script>
const stage=document.getElementById('stage'),reel=document.getElementById('reel'),queue=[],seen=new Set();let busy=false,activeStyle={};
function audio(url,volume,seconds=0,loop=false){if(!url)return null;const a=new Audio(url);a.volume=Math.max(0,Math.min(1,Number(volume??100)/100));a.loop=loop;a.play().catch(()=>{});const limit=Number(seconds||0);if(limit>0)setTimeout(()=>{a.pause();a.currentTime=0},limit*1000);return a}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function colorAlpha(color,opacity){const c=/^#[0-9a-f]{6}$/i.test(color)?color:'#1d0d28';return c+Math.round(Math.max(0,Math.min(100,Number(opacity)||0))*2.55).toString(16).padStart(2,'0')}
function outline(el,style,key){const on=style[key+'OutlineEnabled']===true;el.style.webkitTextStroke=on?`${Number(style[key+'OutlineWidth']??2)}px ${style[key+'OutlineColor']||'#000000'}`:'0 transparent';el.style.paintOrder='stroke fill'}
function applyStyle(style={}){activeStyle=style;const panel=document.querySelector('.panel'),accent=style.accentColor||'#ffd34e',text=style.textColor||'#ffffff',title=document.querySelector('.gacha'),sender=document.querySelector('.sender'),result=document.querySelector('.result'),cont=document.querySelector('.continue');panel.style.width=`min(${style.width||920}px,92vw)`;panel.style.padding=(style.padding??24)+'px';panel.style.borderRadius=(style.borderRadius??24)+'px';panel.style.background=colorAlpha(style.backgroundColor||'#1d0d28',style.backgroundOpacity??96);panel.style.borderColor=style.borderColor||'#ef334e';panel.style.boxShadow=`0 0 40px ${style.borderColor||'#ef334e'}88`;panel.style.color=text;title.style.fontSize=(style.titleFontSize||42)+'px';outline(title,style,'title');sender.style.fontSize=(style.senderFontSize||25)+'px';outline(sender,style,'sender');document.querySelectorAll('.item').forEach(e=>{e.style.fontSize=(style.reelFontSize||34)+'px';e.style.color=text;outline(e,style,'reel')});result.style.fontSize=(style.resultFontSize||34)+'px';result.style.color=accent;outline(result,style,'result');cont.style.fontSize=(style.continueFontSize||29)+'px';cont.style.color=accent;outline(cont,style,'continue');document.querySelector('.window').style.borderColor=accent}
async function run(){if(busy||!queue.length)return;busy=true;const e=queue.shift();stage.classList.add('show');document.getElementById('gacha').textContent=e.gachaName;document.getElementById('sender').textContent=e.sender?`${e.sender} さん`:' ';
document.getElementById('result').textContent='';const cont=document.getElementById('continued');cont.className='continue';cont.textContent='';
audio(e.giftSoundUrl,e.giftSoundVolume??e.soundVolume,e.giftSoundSeconds);
const spin=audio(e.spinSoundUrl,e.spinSoundVolume??e.soundVolume,e.spinSoundSeconds,true);const items=e.items?.length?e.items:['効果'];const loops=Math.max(6,Math.ceil(30/items.length));const list=[];for(let n=0;n<loops;n++)for(const item of items)list.push(item);for(const item of items)list.push(item);reel.replaceChildren(...list.map(text=>{const d=document.createElement('div');d.className='item';d.textContent=text;d.style.fontSize=(activeStyle.reelFontSize||34)+'px';d.style.color=activeStyle.textColor||'#ffffff';outline(d,activeStyle,'reel');return d}));const finalIndex=(loops*items.length)+Math.max(0,Number(e.resultIndex)||0);const distance=finalIndex*60;reel.style.transform='translateY(0)';const anim=reel.animate([{transform:'translateY(0)'},{transform:`translateY(-${distance}px)`}],{duration:Number(e.spinSeconds||5)*1000,easing:'cubic-bezier(.12,.65,.12,1)',fill:'forwards'});await anim.finished.catch(()=>{});
spin?.pause();
audio(e.resultSoundUrl,e.resultSoundVolume??e.soundVolume,e.resultSoundSeconds);
document.getElementById('result').textContent=e.resultLabel;
if(e.continued){cont.textContent='継続！';cont.classList.add('show')}else if(e.continueEnabled){cont.textContent='継続終了';cont.classList.add('show')}
await wait(e.continued?1500:3000);stage.classList.remove('show');await wait(250);busy=false;run()}
async function update(){try{const s=await(await fetch('/api/overlay',{cache:'no-store'})).json();applyStyle(s.overlay?.gachaStyle);for(const e of s.gachaEvents||[]){if(seen.has(e.eventId))continue;seen.add(e.eventId);if(Date.now()/1000-e.at<20)queue.push(e)}if(seen.size>1000){const last=[...seen].slice(-200);seen.clear();last.forEach(x=>seen.add(x))}run()}catch(e){}}update();setInterval(update,400);
</script></body></html>
