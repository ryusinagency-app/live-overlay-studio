<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:"Yu Gothic UI",Meiryo,sans-serif}.stage{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:.25s}.stage.show{opacity:1}.panel{width:min(920px,92vw);padding:24px;border:3px solid #ef334e;border-radius:24px;background:linear-gradient(145deg,rgba(29,13,40,.96),rgba(102,30,24,.96));box-shadow:0 0 40px #ef334e88;text-align:center}.gacha{font-size:42px;font-weight:900;text-shadow:0 3px 8px #000}.sender{font-size:25px;color:#ffd7dd;margin:6px 0 18px}.window{height:150px;overflow:hidden;border:4px solid #ffd34e;border-radius:16px;background:#090a0e;position:relative}.window:before,.window:after{content:"";position:absolute;left:0;right:0;height:44px;z-index:2;pointer-events:none}.window:before{top:0;background:linear-gradient(#090a0e,transparent)}.window:after{bottom:0;background:linear-gradient(transparent,#090a0e)}.reel{position:absolute;left:0;right:0;top:45px}.item{height:60px;display:grid;place-items:center;font-size:34px;font-weight:900;color:#fff}.result{min-height:56px;margin-top:15px;font-size:34px;font-weight:900;color:#a4f4bf;text-shadow:0 0 16px #30dd79}.continue{font-size:29px;font-weight:900;color:#ffd34e;opacity:0}.continue.show{opacity:1;animation:pulse .6s infinite alternate}@keyframes pulse{to{transform:scale(1.08);text-shadow:0 0 24px #ffd34e}}
</style></head><body><div id="stage" class="stage"><div class="panel"><div id="gacha" class="gacha"></div><div id="sender" class="sender"></div><div class="window"><div id="reel" class="reel"></div></div><div id="result" class="result"></div><div id="continued" class="continue"></div></div></div><script>
const stage=document.getElementById('stage'),reel=document.getElementById('reel'),queue=[],seen=new Set();let busy=false;
function audio(url,volume,loop=false){if(!url)return null;const a=new Audio(url);a.volume=Math.max(0,Math.min(1,Number(volume??100)/100));a.loop=loop;a.play().catch(()=>{});return a}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function run(){if(busy||!queue.length)return;busy=true;const e=queue.shift();stage.classList.add('show');document.getElementById('gacha').textContent=e.gachaName;document.getElementById('sender').textContent=e.sender?`${e.sender} さん`:' ';document.getElementById('result').textContent='';const cont=document.getElementById('continued');cont.className='continue';cont.textContent='';audio(e.giftSoundUrl,e.soundVolume);const spin=audio(e.spinSoundUrl,e.soundVolume,true);const items=e.items?.length?e.items:['効果'];const loops=Math.max(6,Math.ceil(30/items.length));const list=[];for(let n=0;n<loops;n++)for(const item of items)list.push(item);for(const item of items)list.push(item);reel.replaceChildren(...list.map(text=>{const d=document.createElement('div');d.className='item';d.textContent=text;return d}));const finalIndex=(loops*items.length)+Math.max(0,Number(e.resultIndex)||0);const distance=finalIndex*60;reel.style.transform='translateY(0)';const anim=reel.animate([{transform:'translateY(0)'},{transform:`translateY(-${distance}px)`}],{duration:Number(e.spinSeconds||5)*1000,easing:'cubic-bezier(.12,.65,.12,1)',fill:'forwards'});await anim.finished.catch(()=>{});spin?.pause();audio(e.resultSoundUrl,e.soundVolume);document.getElementById('result').textContent=e.resultLabel;if(e.continued){cont.textContent='継続！';cont.classList.add('show')}else{cont.textContent='継続終了';cont.classList.add('show')}await wait(e.continued?1500:3000);stage.classList.remove('show');await wait(250);busy=false;run()}
async function update(){try{const s=await(await fetch('/api/overlay',{cache:'no-store'})).json();for(const e of s.gachaEvents||[]){if(seen.has(e.eventId))continue;seen.add(e.eventId);if(Date.now()/1000-e.at<20)queue.push(e)}if(seen.size>1000){const last=[...seen].slice(-200);seen.clear();last.forEach(x=>seen.add(x))}run()}catch(e){}}update();setInterval(update,400);
</script></body></html>
