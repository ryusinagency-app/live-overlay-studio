<!doctype html><html lang="ja"><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;color:#fff;font-family:Meiryo,sans-serif}.box{box-sizing:border-box;width:600px;padding:22px;border:2px solid #7d8496;border-radius:18px;background:#111521e8;text-align:center}.active{border-color:#ffd34e;box-shadow:inset 0 0 28px #ffb02a44,0 0 20px #ffb02a66}strong{display:block;font-size:40px;color:#ffd34e}p{font-size:22px;margin:10px}small{font-size:18px;color:#c5cad6}.bar{height:10px;border-radius:10px;background:#353c4b;overflow:hidden}.bar i{display:block;height:100%;background:#ffd34e;transition:width .4s}
</style><div id="box" class="box"><strong id="title"></strong><p id="remaining"></p><div class="bar"><i id="progress"></i></div><p id="coins"></p><small id="queue"></small></div><script>
const $=id=>document.getElementById(id);async function update(){try{const s=await(await fetch('/api/overlay',{cache:'no-store'})).json(),m=s.game.multiplier;$('box').classList.toggle('active',m.active);$('title').textContent=m.active?m.multiplier+'倍 フィーバー！':'次のフィーバーまで';$('remaining').textContent=m.active?'残り '+m.remainingSeconds+'秒':'';$('progress').style.width=(m.progress/m.threshold*100)+'%';$('coins').textContent=m.progress+' / '+m.threshold+' コイン';$('queue').textContent=m.queued?'次のフィーバー '+m.queued+'回 予約中':''}catch(e){}}update();setInterval(update,500);
</script></html>
