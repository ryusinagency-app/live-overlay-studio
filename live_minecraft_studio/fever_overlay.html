<!doctype html><html lang="ja"><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;color:#fff;font-family:Meiryo,sans-serif}.box{box-sizing:border-box;width:600px;padding:22px;border:2px solid #7d8496;border-radius:18px;background:#111521e8;text-align:center}.active{border-color:#ffd34e;box-shadow:inset 0 0 28px #ffb02a44,0 0 20px #ffb02a66}strong{display:block;font-size:40px;color:#ffd34e}p{font-size:22px;margin:10px}#remaining{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:3px;color:#fff;text-shadow:0 0 14px #ffd34e88}small{font-size:18px;color:#c5cad6}.bar{height:10px;border-radius:10px;background:#353c4b;overflow:hidden}.bar i{display:block;height:100%;background:#ffd34e;transition:width .4s}
</style><div id="box" class="box"><strong id="title"></strong><p id="remaining"></p><div class="bar"><i id="progress"></i></div><p id="coins"></p><small id="queue"></small></div><script>
const $=id=>document.getElementById(id),seen=new Set();
function claimSound(id){try{const key='lms-sound-'+id;if(localStorage.getItem(key))return false;localStorage.setItem(key,String(Date.now()));return true}catch(e){return true}}
function playSound(e){if(!e.soundUrl||!claimSound(e.eventId))return;const audio=new Audio(e.soundUrl);audio.volume=Math.max(0,Math.min(1,Number(e.soundVolume??100)/100));audio.play().catch(()=>{});const seconds=Number(e.soundSeconds||0);if(seconds>0)setTimeout(()=>{audio.pause();audio.currentTime=0},seconds*1000)}
function colorAlpha(color,opacity){const c=/^#[0-9a-f]{6}$/i.test(color)?color:'#111521';return c+Math.round(Math.max(0,Math.min(100,Number(opacity)||0))*2.55).toString(16).padStart(2,'0')}
function applyStyle(style={}){const box=$('box'),accent=style.accentColor||'#ffd34e';box.style.width=(style.width||600)+'px';box.style.padding=(style.padding??22)+'px';box.style.borderRadius=(style.borderRadius??18)+'px';box.style.background=colorAlpha(style.backgroundColor||'#111521',style.backgroundOpacity??91);box.style.borderColor=style.borderColor||accent;box.style.color=style.textColor||'#ffffff';$('title').style.fontSize=(style.titleFontSize||40)+'px';$('title').style.color=accent;$('remaining').style.fontSize=(style.timerFontSize||42)+'px';document.querySelectorAll('#coins,#queue').forEach(e=>e.style.fontSize=(style.textFontSize||22)+'px');$('progress').style.background=accent}
function clock(seconds){const n=Math.max(0,Math.floor(Number(seconds)||0)),h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return[h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}
async function update(){try{const s=await(await fetch('/api/overlay',{cache:'no-store'})).json(),m=s.game.multiplier,c=s.multiplierConfig||{},enabled=m.enabled!==false;applyStyle(s.overlay?.feverStyle);$('box').classList.toggle('active',m.active);$('box').classList.toggle('disabled',!enabled);$('title').textContent=!enabled?'倍率タイム OFF':m.active?m.multiplier+'倍 フィーバー！':(c.waitingText||'次のフィーバーまで');$('remaining').textContent=m.active?clock(m.remainingSeconds):'';$('progress').style.width=(enabled?m.progress/m.threshold*100:0)+'%';$('coins').textContent=enabled?m.progress+' / '+m.threshold+' コイン':'';$('queue').textContent=enabled&&m.queued?'次のフィーバー '+m.queued+'回 予約中':'';for(const e of s.game.announcements||[]){if(seen.has(e.eventId))continue;seen.add(e.eventId);if(Date.now()/1000-e.at<15)playSound(e)}if(seen.size>1000){const latest=[...seen].slice(-100);seen.clear();latest.forEach(id=>seen.add(id))}}catch(e){}}
update();setInterval(update,500)
</script></html>
