<!doctype html><html lang="ja"><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;color:white;font-family:Meiryo,sans-serif}.notice{width:1100px;text-align:center;opacity:0;transition:opacity .2s;overflow-wrap:anywhere;padding:25px;box-sizing:border-box}.show{opacity:1}#text{font-size:60px;line-height:1.4;font-weight:900;text-shadow:0 3px 6px black,0 0 12px #a51030}#sender{font-size:36px;line-height:1.5;font-weight:bold;text-shadow:0 2px 5px black;margin-top:12px}
</style><div id="notice" class="notice"><div id="text"></div><div id="sender"></div></div><script>
const seen=new Set(),queue=[];let busy=false;function show(){if(busy||!queue.length)return;busy=true;const e=queue.shift();document.getElementById('text').textContent=e.text;document.getElementById('sender').textContent=e.sender;document.getElementById('notice').classList.add('show');setTimeout(()=>{document.getElementById('notice').classList.remove('show');setTimeout(()=>{busy=false;show()},200)},e.duration*1000)}async function update(){try{const s=await(await fetch('/api/overlay',{cache:'no-store'})).json();for(const e of s.game.announcements||[]){if(seen.has(e.eventId))continue;seen.add(e.eventId);if(Date.now()/1000-e.at<15){queue.push(e);if(queue.length>100)queue.shift()}}if(seen.size>1000){const latest=[...seen].slice(-100);seen.clear();latest.forEach(id=>seen.add(id))}show()}catch(e){}}update();setInterval(update,500);
</script></html>
