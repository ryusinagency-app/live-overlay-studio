const machine=document.getElementById('machine'),reels=[...document.querySelectorAll('.reel')],lamp=document.getElementById('lamp'),choice=document.getElementById('choice'),selectedPatternId=new URLSearchParams(location.search).get('id')||'',slotApi='/api/overlay/slot'+(selectedPatternId?'?id='+encodeURIComponent(selectedPatternId):'');let playing='',generation=0,currentEvent=null,currentPattern=null,audio=null,startAudio=null,phaseAudio=null,phaseAudioKey='',polling=false,reelShuffleTimer=null;const symbolImageCache=new Map();
