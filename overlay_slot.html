<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スロット</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Yu Gothic",Meiryo,sans-serif;color:#fff}.stage{position:relative;width:100%;height:100%;display:grid;place-items:center}.machine{position:relative;width:min(94vw,1050px);height:min(94vh,900px);min-height:460px;overflow:hidden;border:4px solid var(--accent,#ffcf59);border-radius:34px;background:radial-gradient(circle at 50% 20%,#2a2534,var(--bg,#08090d) 65%);box-shadow:0 0 42px #000b,0 0 30px color-mix(in srgb,var(--accent) 55%,transparent)}.cabinet,.monitorMedia{position:absolute;left:50%;top:50%;width:var(--cabinet-size,100%);height:var(--cabinet-size,100%);transform:translate(-50%,-50%);object-fit:contain;pointer-events:none}.cabinet{z-index:1}.monitor{position:absolute;z-index:2;left:14%;right:14%;top:5%;height:30%;display:grid;place-items:center;overflow:hidden;border:2px solid #ffffff33;border-radius:18px;background:#05060acc}.monitorMedia{width:var(--monitor-size,100%);height:var(--monitor-size,100%);object-fit:cover}.notice{position:relative;z-index:2;text-align:center;font-size:clamp(28px,5vw,70px);font-weight:1000;text-shadow:0 3px 8px #000,0 0 20px var(--accent)}.reels{position:absolute;z-index:4;left:10%;right:10%;top:40%;height:28%;display:grid;grid-template-columns:repeat(3,1fr);gap:2.5%;padding:2.5%;border:7px solid #25212b;border-radius:20px;background:#0b0b0e;box-shadow:inset 0 0 20px #000}.reel{display:grid;place-items:center;overflow:hidden;border-radius:10px;background:var(--reel,#f7f2df);color:#18131c;font-size:clamp(42px,9vw,120px);line-height:1;font-weight:1000;text-align:center;text-shadow:0 2px 2px #fff}.reel.spinning{filter:blur(4px);animation:pulse .12s linear infinite}.reel.slow{animation:slow .48s ease-in-out infinite}.reel img{width:var(--symbol-size,88%);height:var(--symbol-size,88%);object-fit:contain}.lamp{position:absolute;z-index:5;left:50%;top:71%;transform:translateX(-50%) scale(var(--gogo-scale,1));width:min(27%,240px);aspect-ratio:2/1;display:grid;place-items:center;border:3px solid #5b5b66;border-radius:50%;overflow:hidden;background:#191923;color:#777;font-size:clamp(18px,3vw,38px);font-weight:1000}.lamp.on{color:#fff;border-color:#fff176;background:#148e46;box-shadow:0 0 20px #56ff80,0 0 55px #36ff66}.lamp img,.lamp video{width:100%;height:100%;object-fit:cover}.bigEffect{position:absolute;z-index:15;inset:0;display:grid;place-items:center;overflow:hidden;background:#000}.bigEffect img,.bigEffect video{width:var(--big-effect-size,100%);height:var(--big-effect-size,100%);object-fit:contain}.info{position:absolute;z-index:6;left:4%;right:4%;bottom:2.5%;height:15%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 16px;border-radius:16px;background:#05060bd9;border:1px solid #ffffff2c}.avatar{width:clamp(48px,8vh,86px);height:clamp(48px,8vh,86px);border-radius:50%;object-fit:cover;background:#333}.person{min-width:0}.name{font-size:clamp(18px,3vw,34px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gift,.mode{font-size:clamp(12px,1.6vw,20px);color:#d6d6dd}.numbers{text-align:right;font-size:clamp(16px,2.4vw,29px);font-weight:900}.numbers b{color:#ffe36b}.choice{position:absolute;z-index:20;inset:0;display:grid;place-items:center;background:#000b}.choiceBox{text-align:center;padding:28px;border:2px solid var(--accent);border-radius:20px;background:#15151c}.choice button{margin:10px;padding:15px 30px;border:0;border-radius:12px;font-size:28px;font-weight:1000}.plus{background:#ffcf59}.minus{background:#79d5ff}.hidden{display:none!important}@keyframes pulse{50%{transform:translateY(-8px)}}@keyframes slow{50%{transform:translateY(-18px)}}
</style></head><body><main class="stage"><section id="machine" class="machine hidden"><div id="cabinetHost"></div><div class="monitor"><div id="monitorHost"></div><div id="notice" class="notice"></div></div><div class="reels"><div class="reel"></div><div class="reel"></div><div class="reel"></div></div><div id="lamp" class="lamp">GOGO!</div><div id="bigEffectHost" class="bigEffect hidden"></div><div class="info"><img id="avatar" class="avatar" alt=""><div class="person"><div id="name" class="name"></div><div id="gift" class="gift"></div><div id="mode" class="mode"></div></div><div class="numbers"><div>残り <b id="remaining">0</b> 回転</div><div>獲得 <b id="total">0</b> WIN</div></div></div><div id="choice" class="choice hidden"><div class="choiceBox"><h2>獲得WINをどう反映しますか？</h2><button class="plus" data-choice="plus">＋で確定</button><button class="minus" data-choice="minus">－で確定</button></div></div></section></main><script>
const machine=document.getElementById('machine'),reels=[...document.querySelectorAll('.reel')],lamp=document.getElementById('lamp'),choice=document.getElementById('choice');let playing='',generation=0,currentEvent=null,currentPattern=null,audio=null,startAudio=null,polling=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(path);return r.json()}
function mediaElement(url,cls='',videoVolume=null){if(!url||(url===currentPattern?.bigEffectUrl&&currentPattern?.bigEffectMode==='audio-only'))return null;const clean=url.split('?')[0].toLowerCase(),video=/\.(mp4|webm)$/.test(clean),el=document.createElement(video?'video':'img');el.className=cls;el.src=url;if(video){el.autoplay=true;el.loop=true;el.muted=false;el.playsInline=true;el.volume=(videoVolume??currentPattern?.videoVolume??70)/100;el.play().catch(()=>{})}return el}
function setMedia(hostId,url,cls){const host=document.getElementById(hostId);if(host.dataset.url===url)return;host.dataset.url=url||'';host.replaceChildren();const el=mediaElement(url,cls);if(el)host.appendChild(el)}
function playSound(url,volume=75,loop=false){if(loop&&url===currentPattern?.spinAudioUrl&&currentPattern?.startAudioUrl){if(startAudio)startAudio.pause();startAudio=new Audio(currentPattern.startAudioUrl);startAudio.volume=Math.max(0,Math.min(1,(currentPattern.startAudioVolume??65)/100));startAudio.loop=false;startAudio.play().catch(()=>{});startAudio.onended=()=>{startAudio=null}}if(!url)return;if(audio){audio.pause();audio=null}audio=new Audio(url);audio.volume=Math.max(0,Math.min(1,volume/100));audio.loop=loop;audio.play().catch(()=>{})}
function stopSound(){if(audio){audio.pause();audio=null}}
function hideMachine(){generation++;playing='';currentEvent=null;choice.classList.add('hidden');choice.querySelectorAll('button').forEach(x=>x.disabled=false);document.getElementById('bigEffectHost').classList.add('hidden');stopSound();if(startAudio){startAudio.pause();startAudio=null}machine.classList.add('hidden')}
function symbol(reel,text,image){reel.replaceChildren();if(image){const img=document.createElement('img');img.src=image;reel.appendChild(img)}else reel.textContent=text||'?'}
function randomSymbol(){const list=currentPattern?.symbols?.length?currentPattern.symbols:(currentPattern?.missSymbols||['7','BAR','ベル','ブドウ','チェリー']).map(name=>({name,imageUrl:''}));return list[Math.floor(Math.random()*list.length)]}
function renderBase(event,pattern){currentEvent=event;currentPattern=pattern||event.pattern||{};machine.classList.remove('hidden');machine.style.setProperty('--accent',currentPattern.accent||'#ffcf59');machine.style.setProperty('--bg',currentPattern.background||'#08090d');machine.style.setProperty('--reel',currentPattern.reelColor||'#f7f2df');machine.style.setProperty('--cabinet-size',(currentPattern.cabinetSize||100)+'%');machine.style.setProperty('--monitor-size',(currentPattern.monitorSize||100)+'%');machine.style.setProperty('--gogo-scale',String((currentPattern.gogoSize||100)/100));machine.style.setProperty('--symbol-size',(currentPattern.symbolSize||88)+'%');machine.style.setProperty('--big-effect-size',(currentPattern.bigEffectSize||100)+'%');setMedia('cabinetHost',currentPattern.cabinetUrl,'cabinet');setMedia('monitorHost',currentPattern.monitorUrl,'monitorMedia');document.getElementById('name').textContent=event.senderName||'ゲスト';document.getElementById('gift').textContent=(event.giftName||'テスト')+'｜'+(event.patternName||'スロット');document.getElementById('avatar').src=event.avatarUrl||'';document.getElementById('remaining').textContent=Math.max(0,(event.spins?.length||0)-(event.appliedSpins||0));document.getElementById('total').textContent=event.total||0;const activeSpin=event.spins?.[event.appliedSpins]||event.spins?.[Math.max(0,event.appliedSpins-1)];const modeName=activeSpin?.mode==='upper'?'上位AT':activeSpin?.mode==='at'?'AT':'通常';document.getElementById('mode').textContent=modeName+(event.queuePosition?'｜待機 '+event.queuePosition+'人':'');choice.classList.toggle('hidden',!event.choiceReady||!!event.choice)}
async function animateSpin(event,pattern,index,token){const spin=event.spins[index],bigEffectHost=document.getElementById('bigEffectHost');renderBase(event,pattern);bigEffectHost.classList.add('hidden');bigEffectHost.replaceChildren();lamp.className='lamp';lamp.replaceChildren();if(pattern.defaultGogoEnabled!==false)lamp.textContent='GOGO!';else lamp.classList.add('hidden');document.getElementById('notice').textContent='回転中';playSound(pattern.spinAudioUrl,pattern.spinAudioVolume,true);reels.forEach(r=>r.className='reel spinning');const shuffle=setInterval(()=>reels.forEach(r=>{const item=randomSymbol();symbol(r,item.name,item.imageUrl)}),90);await sleep((pattern.spinSeconds||1.8)*1000);if(token!==generation){clearInterval(shuffle);return}clearInterval(shuffle);stopSound();for(let i=0;i<3;i++){const random=randomSymbol(),text=spin.kind==='miss'?(spin.reels?.[i]||random.name):(i<2?spin.reels?.[i]:random.name),image=spin.kind==='miss'?(spin.reelImages?.[i]||random.imageUrl):(i<2?spin.symbolImageUrl:random.imageUrl),stopUrl=pattern['stop'+(i+1)+'AudioUrl']||pattern.stopAudioUrl,stopVolume=pattern['stop'+(i+1)+'AudioUrl']?(pattern['stop'+(i+1)+'AudioVolume']??65):pattern.stopAudioVolume;reels[i].className='reel';symbol(reels[i],text,image);playSound(stopUrl,stopVolume);await sleep((pattern.stopInterval||.35)*1000)}if(spin.kind==='hit'){document.getElementById('notice').textContent='BONUS!';lamp.className='lamp on';lamp.replaceChildren();const lm=mediaElement(pattern.gogoUrl);if(lm)lamp.appendChild(lm);else if(pattern.defaultGogoEnabled!==false)lamp.textContent='GOGO!';else lamp.classList.add('hidden');playSound(pattern.gogoAudioUrl,pattern.gogoAudioVolume);await sleep((pattern.hitNoticeSeconds||2)*1000);if(pattern.bigEffectEnabled!==false&&(pattern.bigEffectUrl||pattern.bigEffectAudioUrl)){bigEffectHost.replaceChildren();const effect=mediaElement(pattern.bigEffectUrl,'',pattern.bigEffectVideoVolume??70);if(effect)bigEffectHost.appendChild(effect);bigEffectHost.classList.remove('hidden');stopSound();playSound(pattern.bigEffectAudioUrl,pattern.bigEffectAudioVolume??80,true);await sleep((pattern.bigEffectSeconds||3)*1000);stopSound();bigEffectHost.classList.add('hidden');bigEffectHost.replaceChildren()}const per=(pattern.hitAlignSeconds||2.4)*1000/3;for(let i=0;i<3;i++){reels[i].className='reel slow';await sleep(per);reels[i].className='reel';symbol(reels[i],spin.reels?.[i]||pattern.bigSymbolText,spin.symbolImageUrl)}document.getElementById('notice').textContent='+'+(spin.win||0)+' WIN'+(spin.addedSpins?'｜+'+spin.addedSpins+'回転':'')}else{for(let i=0;i<3;i++)symbol(reels[i],spin.reels?.[i]||randomSymbol().name,spin.reelImages?.[i]||spin.symbolImageUrl);document.getElementById('notice').textContent=spin.kind==='miss'?'はずれ':(spin.roleName||'小役')+(spin.addedSpins?'｜+'+spin.addedSpins+'回転':'')+(spin.win?'｜+'+spin.win+' WIN':'');if(spin.audioUrl)playSound(spin.audioUrl,spin.audioVolume);if(spin.animationUrl)setMedia('monitorHost',spin.animationUrl,'monitorMedia')}await sleep((pattern.resultSeconds||1.2)*1000);if(token!==generation)return;const applied=await post('/api/slot/apply-spin',{eventId:event.id,spinIndex:index});if(applied.ok&&index+1>=event.spins.length&&event.sign!=='both'){const completed=await post('/api/slot/complete',{eventId:event.id});if(completed.ok)hideMachine()}}
async function process(data){const event=data.slotMachine?.event||{},pattern=event.pattern||data.slotMachine?.patterns?.[0]||{};if(!event.active){hideMachine();return}renderBase(event,pattern);const index=event.appliedSpins||0,key=event.id+':'+index;if(event.choiceReady){playing=key;choice.classList.remove('hidden');return}if(index>=event.spins.length){if(playing!==key){playing=key;const completed=await post('/api/slot/complete',{eventId:event.id});if(completed.ok)hideMachine();else playing=''}return}if(playing===key)return;playing=key;const token=++generation;try{await animateSpin(event,pattern,index,token)}catch(e){}finally{if(token===generation)playing=''}}
choice.querySelectorAll('button').forEach(button=>button.onclick=async()=>{if(!currentEvent)return;button.disabled=true;const eventId=currentEvent.id;try{const selected=await post('/api/slot/choose-sign',{eventId,choice:button.dataset.choice});if(!selected.ok)return;choice.classList.add('hidden');playing='';const completed=await post('/api/slot/complete',{eventId});if(completed.ok)hideMachine()}finally{choice.querySelectorAll('button').forEach(x=>x.disabled=false)}});
async function poll(){if(polling)return;polling=true;try{const response=await fetch('/api/overlay/slot',{cache:'no-store'});if(response.ok)await process(await response.json())}catch(e){}finally{polling=false}}setInterval(poll,250);poll();
</script><script>
const animateSpinWithCommonResultTime=animateSpin;
animateSpin=async function(event,pattern,index,token){const spin=event.spins?.[index],original=pattern.resultSeconds;if((spin?.kind==='small'||spin?.kind==='replay')&&spin.effectSeconds!=null)pattern.resultSeconds=spin.effectSeconds;try{return await animateSpinWithCommonResultTime(event,pattern,index,token)}finally{pattern.resultSeconds=original}};
function visibleRemaining(event,includeCurrent=false){const applied=Math.max(0,event?.appliedSpins||0),spins=event?.spins||[];let disclosed=0;for(let i=0;i<applied;i++)disclosed+=Math.max(0,spins[i]?.addedSpins||0);if(includeCurrent)disclosed+=Math.max(0,spins[applied]?.addedSpins||0);return Math.max(0,(event?.initialSpins||0)+disclosed-applied-(includeCurrent?1:0))}
const renderBaseWithHiddenFutureSpins=renderBase;
renderBase=function(event,pattern){renderBaseWithHiddenFutureSpins(event,pattern);const p=currentPattern||{};machine.style.setProperty('--gogo-x',(p.gogoX??50)+'%');machine.style.setProperty('--gogo-y',(p.gogoY??76)+'%');machine.style.setProperty('--gogo-width',(p.gogoWidth??240)+'px');machine.style.setProperty('--gogo-height',(p.gogoHeight??120)+'px');document.getElementById('remaining').textContent=visibleRemaining(event)};
new MutationObserver(()=>{const notice=document.getElementById('notice');if(/｜\+\d+回転/.test(notice.textContent||'')&&currentEvent)document.getElementById('remaining').textContent=visibleRemaining(currentEvent,true)}).observe(document.getElementById('notice'),{childList:true,characterData:true,subtree:true});
new MutationObserver(()=>lamp.classList.toggle('custom',!!lamp.querySelector('img,video'))).observe(lamp,{childList:true});
</script><style>.bigEffect:empty{display:none!important}.lamp{left:var(--gogo-x,50%);top:var(--gogo-y,76%);width:var(--gogo-width,240px);height:var(--gogo-height,120px);aspect-ratio:auto;transform:translate(-50%,-50%)}.lamp.custom{overflow:visible;border:0;background:transparent;box-shadow:none}.lamp.custom img,.lamp.custom video{width:100%;height:100%;object-fit:contain}</style><script>
const monitorNotice=document.getElementById('notice');
function refreshMonitorNotice(){const pattern=currentPattern||{};monitorNotice.style.visibility=pattern.monitorTextEnabled===false?'hidden':'visible';monitorNotice.style.color=pattern.monitorTextColor||'#ffffff';monitorNotice.style.fontSize=(pattern.monitorTextSize||70)+'px';const raw=monitorNotice.textContent||'';let next=raw;if(raw==='回転中')next=pattern.spinText??'回転中';else if(raw==='BONUS!')next=pattern.bonusText??'BONUS!';else if(raw==='はずれ')next=pattern.missText??'はずれ';else if(/^\+\d+ WIN/.test(raw)){const win=raw.match(/^\+(\d+)/)?.[1]||'0',spins=raw.match(/｜\+(\d+)回転/)?.[1]||'0';next=String(pattern.winResultText??'+{win} WIN').replaceAll('{win}',win).replaceAll('{spins}',spins)}if(next!==raw)monitorNotice.textContent=next}
new MutationObserver(refreshMonitorNotice).observe(monitorNotice,{childList:true,characterData:true,subtree:true});
</script></body></html>
