<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overlay</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:var(--overlay-font,system-ui,"Yu Gothic",sans-serif);color:#fff}.wrap{position:absolute;left:3.5%;top:5%;width:38%;max-width:520px;display:flex;flex-direction:column;gap:12px;filter:drop-shadow(0 3px 8px #0009)}.brand{color:var(--card-text,var(--text-color,#fff));font-size:var(--brand-size,clamp(14px,1.7vw,30px));font-weight:900;letter-spacing:.11em;padding:9px 14px;border-left:6px solid var(--accent,#e52b3c);background:linear-gradient(90deg,var(--panel-bg,rgba(23,24,30,.88)),transparent);text-shadow:0 2px 3px #000}.counters{display:grid;gap:7px}.counter{display:grid;grid-template-columns:1fr auto;align-items:center;gap:3px 14px;padding:10px 12px;border-left:3px solid var(--accent,#e52b3c);background:var(--panel-bg,rgba(23,24,30,.88));border-radius:0 9px 9px 0}.counterTrack{grid-column:1/-1;height:5px;overflow:hidden;border-radius:10px;background:rgba(255,255,255,.2);margin:4px 0 0}.counterFill{height:100%;border-radius:inherit;background:linear-gradient(90deg,color-mix(in srgb,var(--gauge-color,#e52b3c),#000 28%),var(--gauge-color,#e52b3c));transition:width .2s ease}.label{color:var(--card-text,var(--text-color,#fff));font-size:var(--label-size,clamp(13px,1.25vw,23px));font-weight:700}.value{color:var(--card-text,var(--text-color,#fff));font-size:var(--value-size,clamp(21px,2.1vw,38px));font-weight:900;text-shadow:var(--text-glow,none);white-space:nowrap}.comp{color:var(--card-text,var(--text-color,#fff));font-size:var(--comp-size,clamp(12px,1.15vw,20px));padding:12px 15px;background:var(--panel-bg,rgba(23,24,30,.88));border:1px solid color-mix(in srgb,var(--accent,#e52b3c),transparent 25%);border-radius:10px;white-space:pre-wrap;line-height:1.45}.missionList{display:flex;flex-direction:column;gap:8px}.mission{padding:12px 13px;background:var(--panel-bg,rgba(23,24,30,.88));border-left:5px solid var(--accent,#e52b3c);border-radius:0 10px 10px 0;font-size:var(--comp-size,clamp(12px,1.15vw,20px));line-height:1.4;color:var(--card-text,var(--text-color,#fff))}.missionHead{font-weight:900;font-size:1.05em;margin-bottom:8px}.missionLine{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.missionTrack{height:7px;overflow:hidden;border-radius:10px;background:rgba(255,255,255,.2);margin:8px 0 10px}.missionFill{height:100%;border-radius:inherit;background:linear-gradient(90deg,color-mix(in srgb,var(--gauge-color,#e52b3c),#000 28%),var(--gauge-color,#e52b3c));transition:width .2s ease}.mission .gift{font-size:1.15em;font-weight:900;color:var(--card-text,var(--text-color,#fff));white-space:nowrap}.achievements{color:var(--card-text,#ffe8a4);font-variant-numeric:tabular-nums;white-space:nowrap}.achievementRight{display:flex;align-items:center;gap:8px}.missionBanner{display:block;width:fit-content;margin:12px auto 2px;font-weight:1000;font-size:1.35em;color:#332400;background:#ffdc78;border-radius:10px;padding:8px 24px;white-space:nowrap;text-shadow:none;box-shadow:0 3px 12px #0007}.missionBanner.hidden{display:none}.hidden{display:none}.compTitle{font-weight:900;color:var(--card-text,var(--text-color,#fff));border-bottom:2px solid var(--accent,#e52b3c);padding-bottom:5px;margin-bottom:7px}.timer{display:flex;align-items:center;justify-content:flex-start;gap:0;width:fit-content;max-width:100%;align-self:flex-start;padding:13px 17px;background:var(--panel-bg,rgba(23,24,30,.88));border-left:5px solid var(--accent,#e52b3c);border-radius:0 10px 10px 0;color:var(--card-text,var(--text-color,#fff))}.timerLabel{font-weight:800;font-size:var(--comp-size,clamp(12px,1.15vw,20px))}.timerValue{font-size:clamp(30px,3.5vw,60px);font-weight:1000;text-shadow:var(--text-glow,none);font-variant-numeric:tabular-nums}.hidden{display:none}
</style><body data-view="counters"><div class="wrap"><div class="brand">LIVE OVERLAY</div><div class="counters" id="counters"></div><div class="missionList" id="missions"></div><div class="timer hidden" id="timer"><span class="timerLabel" id="timerLabel"></span><strong class="timerValue" id="timerValue"></strong></div><div class="missionList" id="memos"></div></div><script>
function fontStack(key,globalKey='system'){const stacks={system:'system-ui,"Yu Gothic",Meiryo,sans-serif',yuGothic:'"Yu Gothic","游ゴシック",sans-serif',meiryo:'Meiryo,"メイリオ",sans-serif',gothic:'"Arial Black",Impact,sans-serif',serif:'"Yu Mincho","游明朝",serif',mono:'ui-monospace,Consolas,monospace'};return key&&key!=='global'?stacks[key]||stacks.system:stacks[globalKey]||stacks.system}

function setOverlayFont(key){const stacks={system:'system-ui,"Yu Gothic",Meiryo,sans-serif',yuGothic:'"Yu Gothic","游ゴシック",sans-serif',meiryo:'Meiryo,"メイリオ",sans-serif',gothic:'"Arial Black",Impact,sans-serif',serif:'"Yu Mincho","游明朝",serif',mono:'ui-monospace,Consolas,monospace'};document.documentElement.style.setProperty("--overlay-font",stacks[key]||stacks.system)}

const $=id=>document.getElementById(id);function rgbaColor(hex,a){const m=/^#([0-9a-f]{6})$/i.exec(hex||'');return m?`rgba(${parseInt(m[1].slice(0,2),16)},${parseInt(m[1].slice(2,4),16)},${parseInt(m[1].slice(4,6),16)},${a})`:''}
const view=document.body.dataset.view||new URLSearchParams(location.search).get('view')||'all';
function selectView(){
  const sections={counters:'counters',missions:'missions',comp:'memos',timer:'timer'};
  if(view!=='all'){
    document.querySelector('.brand').classList.add('hidden');
    for(const [name,id] of Object.entries(sections))if(name!==view)$(id).classList.add('hidden');
  }
}
async function update(){
 try{
  const r=await fetch('/api/state',{cache:'no-store'}),s=await r.json();setOverlayFont(s.fontFamily);
  document.documentElement.style.setProperty('--accent',s.accent||'#e52b3c');
  document.documentElement.style.setProperty('--gauge-color',s.gaugeColor||'#e52b3c');
  document.documentElement.style.setProperty('--text-glow',s.textGlowEnabled?'0 0 '+(s.textGlowStrength||12)+'px '+(s.textGlowColor||s.accent||'#e52b3c'):'none');
  const color=s.panelColor||'#17181e',rgb=color.match(/[0-9a-f]{2}/gi).map(v=>parseInt(v,16)).join(','),opacity=Math.max(0,Math.min(100,+s.panelOpacity||0))/100;
  document.documentElement.style.setProperty('--panel-bg',`rgba(${rgb},${opacity})`);
  const scale=Math.max(60,Math.min(160,+s.textScale||100))/100;
  document.documentElement.style.setProperty('--text-color',s.textColor||'#ffffff');
  document.documentElement.style.setProperty('--brand-size',`clamp(${14*scale}px,${1.7*scale}vw,${30*scale}px)`);
  document.documentElement.style.setProperty('--label-size',`clamp(${13*scale}px,${1.25*scale}vw,${23*scale}px)`);
  document.documentElement.style.setProperty('--value-size',`clamp(${21*scale}px,${2.1*scale}vw,${38*scale}px)`);
  document.documentElement.style.setProperty('--comp-size',`clamp(${12*scale}px,${1.15*scale}vw,${20*scale}px)`);
  $('counters').innerHTML=(s.counters||[]).map(()=>`<div class="counter"><span class="label"></span><span class="value"></span><div class="counterTrack"><div class="counterFill"></div></div></div>`).join('');
  [...$('counters').children].forEach((el,i)=>{const c=s.counters[i],goal=Math.max(0,+c.goal||0),value=Math.max(0,+c.value||0),track=el.querySelector('.counterTrack');el.style.width=+c.cardWidth>0?Math.min(2000,+c.cardWidth)+'px':'';el.style.justifySelf=+c.cardWidth>0?'start':'';el.style.minHeight=+c.cardHeight>0?Math.min(1200,+c.cardHeight)+'px':'';el.style.backgroundColor=rgbaColor(c.cardBg||(s.cardDefaults||{}).background||color,c.cardOpacity>=0?c.cardOpacity/100:opacity);el.style.borderLeftColor=c.cardBorder||(s.cardDefaults||{}).border||s.accent||'#e52b3c';el.style.setProperty('--card-text',c.cardTextColor||s.textColor||'#fff');el.style.fontFamily=fontStack(c.fontFamily,s.fontFamily);el.querySelector('.label').textContent=c.label;el.querySelector('.value').textContent=String(c.value)+(c.showGoal?' / '+String(c.goal??40):'');track.classList.toggle('hidden',!c.showGoal||goal<=0);el.querySelector('.counterFill').style.width=(goal>0?Math.min(100,value/goal*100):0)+'%'});
  $('missions').innerHTML=(s.missions||[]).map(()=>`<div class="mission"><div class="missionHead"></div><div class="missionLine"><span>ギフト進捗</span><strong class="gift"></strong></div><div class="missionTrack" role="progressbar"><div class="missionFill"></div></div><div class="missionLine achievementLine"><span>本日の達成回数</span><span class="achievementRight"><strong class="achievements"></strong></span></div><div class="missionBanner hidden">達成！</div></div>`).join('');
  [...$('missions').children].forEach((el,i)=>{const m=s.missions[i],goal=Math.max(1,+m.giftGoal||10),limit=+m.dailyLimit||10,count=+m.achievements||0,value=Math.max(0,+m.giftValue||0),track=el.querySelector('.missionTrack');el.style.width=+m.cardWidth>0?Math.min(2000,+m.cardWidth)+'px':'';el.style.minHeight=+m.cardHeight>0?Math.min(1200,+m.cardHeight)+'px':'';el.style.backgroundColor=rgbaColor(m.cardBg||(s.cardDefaults||{}).background||color,m.cardOpacity>=0?m.cardOpacity/100:opacity);el.style.borderLeftColor=m.cardBorder||(s.cardDefaults||{}).border||s.accent||'#e52b3c';el.style.setProperty('--card-text',m.cardTextColor||s.textColor||'#fff');el.style.fontFamily=fontStack(m.fontFamily,s.fontFamily);el.querySelector('.missionHead').textContent='🎁 '+(m.title||'ギフトミッション');el.querySelector('.gift').textContent=value+' / '+goal+' '+(m.unit||'個');el.querySelector('.missionFill').style.width=Math.min(100,value/goal*100)+'%';track.setAttribute('aria-valuenow',Math.min(value,goal));track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax',goal);track.setAttribute('aria-label',(m.title||'ギフトミッション')+' ギフト進捗');el.querySelector('.achievements').textContent=count+' / '+limit+' 回';el.querySelector('.achievementLine').classList.toggle('hidden',m.showAchievements===false);el.querySelector('.missionBanner').classList.toggle('hidden',count<limit&&Date.now()/1000>=(+m.noticeUntil||0))});
  [...$('counters').children].forEach((el,i)=>{const c=s.counters[i]||{},cardScale=Math.max(.5,Math.min(2.5,(+c.textScale||100)/100));el.style.setProperty('--label-size',`clamp(${13*scale*cardScale}px,${1.25*scale*cardScale}vw,${23*scale*cardScale}px)`);el.style.setProperty('--value-size',`clamp(${21*scale*cardScale}px,${2.1*scale*cardScale}vw,${38*scale*cardScale}px)`)});
  [...$('missions').children].forEach((el,i)=>{const m=s.missions[i]||{},cardScale=Math.max(.5,Math.min(2.5,(+m.textScale||100)/100));el.style.setProperty('--mission-size',`clamp(${15*scale*cardScale}px,${1.45*scale*cardScale}vw,${24*scale*cardScale}px)`)});
  const configuredSeconds=Math.max(0,+((s.timer||{}).seconds||0));
  const activeGift=(s.giftRules||[]).find(rule=>String(rule.giftName||'').normalize('NFKC').replace(/\s/g,'').toLowerCase()===String((s.timer||{}).giftName||'').normalize('NFKC').replace(/\s/g,'').toLowerCase());
  const timerScale=Math.max(.5,Math.min(2.5,(+activeGift?.textScale||100)/100));$('timer').style.setProperty('--comp-size',`clamp(${12*scale*timerScale}px,${1.15*scale*timerScale}vw,${20*scale*timerScale}px)`);$('timerValue').style.fontSize=`clamp(${30*scale*timerScale}px,${3.5*scale*timerScale}vw,${60*scale*timerScale}px)`;
  $('timerLabel').textContent='カウント：';
  $('timerValue').textContent=configuredSeconds+'秒';
  $('timer').classList.toggle('hidden',configuredSeconds<=0||(view!=='all'&&view!=='timer'));
  $('memos').classList.toggle('hidden',view!=='all'&&view!=='comp');
  const memoScale=Math.max(.5,Math.min(2.5,(+s.compTextScale||100)/100));[...$('memos').children].forEach(el=>el.style.setProperty('--comp-size',`clamp(${12*scale*memoScale}px,${1.15*scale*memoScale}vw,${20*scale*memoScale}px)`));
 }catch(e){}
}
selectView();update();setInterval(update,250);
function rgbaTextBg(hex,opacity){const m=/^#([0-9a-f]{6})$/i.exec(hex||'');return m?`rgba(${parseInt(m[1].slice(0,2),16)},${parseInt(m[1].slice(2,4),16)},${parseInt(m[1].slice(4,6),16)},${opacity})`:'transparent'}function textFxFor(s,key){const custom=(s.textEffects||{})[key]||{};return custom.mode==='custom'?{outlineEnabled:custom.outlineEnabled,outlineColor:custom.outlineColor,outlineWidth:custom.outlineWidth,backgroundEnabled:custom.backgroundEnabled,backgroundColor:custom.backgroundColor,backgroundOpacity:custom.backgroundOpacity}:{outlineEnabled:s.textOutlineEnabled,outlineColor:s.textOutlineColor,outlineWidth:s.textOutlineWidth,backgroundEnabled:s.textBackgroundEnabled,backgroundColor:s.textBackgroundColor,backgroundOpacity:s.textBackgroundOpacity}}function textFxKey(s,node){const counter=node.closest('.counter');if(counter)return 'counter:'+((s.counters||[])[[...$('counters').children].indexOf(counter)]?.id||'');const mission=node.closest('.mission');if(mission)return 'mission:'+((s.missions||[])[[...$('missions').children].indexOf(mission)]?.id||'');const memo=node.closest('.comp');if(memo)return 'memo:'+((s.memos||[])[[...$('memos').children].indexOf(memo)]?.id||'');if(node.closest('.timer')){const active=(s.giftRules||[]).find(rule=>String(rule.giftName||'').normalize('NFKC').replace(/\\s/g,'').toLowerCase()===String((s.timer||{}).giftName||'').normalize('NFKC').replace(/\\s/g,'').toLowerCase());return active?'giftRule:'+active.id:'timer'}return ''}function applyGlobalTextFx(s){const nodes=document.querySelectorAll('.brand,.label,.value,.compTitle,.compText,.missionHead,.missionLine>span,.missionLine>strong,.achievements,.missionBanner,.timerLabel,.timerValue');nodes.forEach(node=>{const fx=textFxFor(s,textFxKey(s,node)),stroke=fx.outlineEnabled?Math.max(0,Math.min(10,+fx.outlineWidth||0))+'px '+(fx.outlineColor||'#000'):'0 transparent',bg=fx.backgroundEnabled?rgbaTextBg(fx.backgroundColor||'#000',Math.max(0,Math.min(100,+fx.backgroundOpacity||0))/100):'';node.style.webkitTextStroke=stroke;node.style.paintOrder='stroke fill';node.style.backgroundColor=bg;node.style.boxDecorationBreak='clone';node.style.webkitBoxDecorationBreak='clone';node.style.borderRadius='6px';node.style.padding=fx.backgroundEnabled?'1px 5px':''})}async function refreshGlobalTextFx(){try{applyGlobalTextFx(await(await fetch('/api/state',{cache:'no-store'})).json())}catch(e){}}refreshGlobalTextFx();setInterval(refreshGlobalTextFx,1000);</script></body></html>
