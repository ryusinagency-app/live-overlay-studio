<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ギフトメディア</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,"Yu Gothic",Meiryo,sans-serif;color:white}.stage{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.frame{display:none;position:relative;align-items:center;justify-content:center;overflow:hidden;max-width:100vw;max-height:100vh}.frame.show{display:flex}.asset{width:100%;height:100%;object-fit:contain;display:none}.asset.show{display:block}.caption{position:absolute;left:3%;right:3%;bottom:3%;text-align:center;font-size:clamp(16px,3vw,36px);font-weight:900;text-shadow:0 2px 8px #000,0 0 14px #000;background:#0008;border-radius:10px;padding:7px 14px}.caption:empty{display:none}
</style><body><main class="stage"><div class="frame" id="frame"><img id="image" class="asset" alt=""><video id="video" class="asset" playsinline muted></video><div class="caption" id="caption"></div></div></main><script>
const $=id=>document.getElementById(id);let lastId=0,playing=false,activeAudio=null;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function stop(){const v=$('video');v.pause();v.removeAttribute('src');$('image').removeAttribute('src');$('frame').classList.remove('show');$('image').classList.remove('show');v.classList.remove('show');if(activeAudio){activeAudio.pause();activeAudio.currentTime=0;activeAudio=null}}
async function play(ev){if(playing)return;playing=true;const frame=$('frame'),image=$('image'),video=$('video');frame.style.width=Math.min(Math.max(80,+ev.width||800),innerWidth)+'px';frame.style.height=Math.min(Math.max(60,+ev.height||450),innerHeight)+'px';$('caption').textContent=[ev.senderName,ev.giftName+(+ev.count>1?' ×'+ev.count:'')].filter(Boolean).join('　');frame.classList.add('show');if(ev.videoUrl){video.src=ev.videoUrl;video.volume=Math.max(0,Math.min(1,(+ev.videoVolume||0)/100));video.classList.add('show');video.muted=!!ev.audioUrl;video.currentTime=0;video.play().catch(()=>{video.muted=true;video.play().catch(()=>{})});if(ev.audioUrl){activeAudio=new Audio(ev.audioUrl);activeAudio.volume=Math.max(0,Math.min(1,(+ev.audioVolume||0)/100));activeAudio.play().catch(()=>{})}}else if(ev.imageUrl){image.src=ev.imageUrl;image.classList.add('show');if(ev.audioUrl){activeAudio=new Audio(ev.audioUrl);activeAudio.volume=Math.max(0,Math.min(1,(+ev.audioVolume||0)/100));activeAudio.play().catch(()=>{})}}else if(ev.audioUrl){activeAudio=new Audio(ev.audioUrl);activeAudio.volume=Math.max(0,Math.min(1,(+ev.audioVolume||0)/100));activeAudio.play().catch(()=>{})}
const seconds=Math.max(0,Math.min(600,+ev.duration||0));if(seconds>0)await wait(seconds*1000);else if(ev.videoUrl)await Promise.race([new Promise(resolve=>video.addEventListener('ended',resolve,{once:true})),wait(600000)]);else if(activeAudio)await Promise.race([new Promise(resolve=>activeAudio.addEventListener('ended',resolve,{once:true})),wait(600000)]);else await wait(6000);stop();playing=false;fetch('/api/gift-media/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventId:ev.id})}).catch(()=>{})}
async function poll(){try{const state=await(await fetch('/api/state',{cache:'no-store'})).json(),media=state.giftMedia||{},ev=media.event||{};if(ev.active&&ev.id&&ev.id!==lastId){lastId=ev.id;play(ev)}}catch(e){}}
poll();setInterval(poll,250);
</script></body></html>
