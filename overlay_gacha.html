for(const key of ['pattern','sender','setCount','result','state','total']){$(key).addEventListener('pointerdown',event=>{if(!new URLSearchParams(location.search).has('preview')||!new URLSearchParams(location.search).has('edit')||!livePreviewG)return;const card=$('card'),el=$(key);if(getComputedStyle(el).display==='none')return;event.preventDefault();const cardRect=card.getBoundingClientRect(),elRect=el.getBoundingClientRect(),centerX=elRect.left+elRect.width/2,centerY=elRect.top+elRect.height/2,offsetX=event.clientX-centerX,offsetY=event.clientY-centerY;el.setPointerCapture&&el.setPointerCapture(event.pointerId);const position=(ev)=>{const rect=card.getBoundingClientRect(),box=el.getBoundingClientRect(),pad=10;let x=(ev.clientX-offsetX-rect.left)/rect.width*100,y=(ev.clientY-offsetY-rect.top)/rect.height*100,minX=(box.width/2+pad)/rect.width*100,maxX=100-minX,minY=(box.height/2+pad)/rect.height*100,maxY=100-minY;if(minX>maxX)minX=maxX=50;if(minY>maxY)minY=maxY=50;x=Math.max(minX,Math.min(maxX,x));y=Math.max(minY,Math.min(maxY,y));el.style.setProperty('--edit-x',x+'%');el.style.setProperty('--edit-y',y+'%');parent.postMessage({type:'gacha-element-layout',patternId:livePreviewG.id,scene:activePreviewScene,key,x,y},location.origin)};const move=ev=>position(ev);const done=ev=>{if((ev&&ev.pointerId)!==undefined&&ev.pointerId!==event.pointerId)return;position(ev||event);el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',done);el.removeEventListener('pointercancel',done)};el.addEventListener('pointermove',move);el.addEventListener('pointerup',done);el.addEventListener('pointercancel',done)})}

window.__gachaMainStarted=true;
if(!new URLSearchParams(location.search).has("preview")){update();setInterval(update,250)}
</script></body></html>
