)}await wait(Math.max(1,Math.min(600,+g.endSeconds||6))*1000);if(token===playToken){$('card').classList.remove('show');if(activeAudio){activeAudio.pause();activeAudio.currentTime=0;activeAudio=null}$('card').classList.remove('fullscreen');const v=$('customVideo');v.pause();v.muted=true}if(token===playToken&&!ev.preview)await completeEvent(ev.id)}
let lastStoppedEventId=0;
async function stopOverlayPlayback(){playToken++;$('card').classList.remove('show','spinning','fullscreen','preAlert','preAlertTextOff');$('preAlertImage').classList.remove('show');$('preAlertImage').removeAttribute('src');$('preAlertVideo').pause();$('preAlertVideo').removeAttribute('src');$('customVideo').pause();$('customVideo').removeAttribute('src');if(activeAudio){activeAudio.pause();activeAudio.currentTime=0;activeAudio=null}}
async function update(){try{const r=await fetch('/api/state',{cache:'no-store'}),s=await r.json();setOverlayFont(s.fontFamily);const g=s.gacha||{},ev=g.event||{};if(ev.id&&ev.id!==lastId){lastId=ev.id;lastStoppedEventId=0;if(!ev.active)return;const pattern=(g.patterns||[]).find(item=>(ev.patternId&&item.id===ev.patternId)||(!ev.patternId&&item.name===ev.patternName));if(!matchesOverlayLayout(pattern))return;if(ev.type==='gacha'&&Date.now()/1000-(+ev.createdAt||0)<300){const playback={...g,...(pattern||{}),globalFontFamily:s.fontFamily||'system'};if(pattern?.animationUrl){playback.animationUrl=pattern.animationUrl;playback.videoAudioEnabled=pattern.videoAudioEnabled;playback.videoVolume=pattern.videoVolume}if(pattern?.audioUrl){playback.audioUrl=pattern.audioUrl;playback.audioVolume=pattern.audioVolume}playToken++;play(ev,playToken,playback.animationUrl||'',playback)}}else if(ev.id&&ev.id===lastId&&!ev.active&&lastStoppedEventId!==ev.id){lastStoppedEventId=ev.id;stopOverlayPlayback()}}catch(e){}}

function rgbaTextBg(hex,opacity){const m=/^#([0-9a-f]{6})$/i.exec(hex||'');return m?`rgba(${parseInt(m[1].slice(0,2),16)},${parseInt(m[1].slice(2,4),16)},${parseInt(m[1].slice(4,6),16)},${opacity})`:'transparent'}
function applyGlobalTextFx(s){const current=livePreviewG||activeTextSettings||{},patternId=current.id||(s.gacha?.event?.active?s.gacha.event.patternId:''),custom=(s.textEffects||{})[patternId?'gacha:'+patternId:'']||{},fx=custom.mode==='custom'?custom:{outlineEnabled:s.textOutlineEnabled,outlineColor:s.textOutlineColor,outlineWidth:s.textOutlineWidth,backgroundEnabled:s.textBackgroundEnabled,backgroundColor:s.textBackgroundColor,backgroundOpacity:s.textBackgroundOpacity};document.documentElement.style.setProperty('--global-outline-width',fx.outlineEnabled?Math.max(0,Math.min(10,+fx.outlineWidth||0))+'px':'0');document.documentElement.style.setProperty('--global-outline-color',fx.outlineColor||'#000');document.documentElement.style.setProperty('--global-text-bg',fx.backgroundEnabled?rgbaTextBg(fx.backgroundColor||'#000',Math.max(0,Math.min(100,+fx.backgroundOpacity||0))/100):'transparent');document.documentElement.style.setProperty('--global-text-bg-pad',fx.backgroundEnabled?'2px 7px':'0')}

function refreshTextVisibility(g=activeTextSettings||{}){activeTextSettings=g;const choice=String($('state').textContent||'').includes('＋か－を選んでください');$('pattern').classList.toggle('textOff',g.showPatternText===false);$('sender').classList.toggle('textOff',g.showSenderText===false);$('result').classList.toggle('textOff',g.showResultText===false);$('total').classList.toggle('textOff',g.showTotalText===false);$('state').classList.toggle('textOff',choice?g.showChoiceText===false:g.showStateText===false);$('state').style.color=choice?(g.choiceTextColor||'#ffe9a6'):(g.stateTextColor||'#ffe9a6');$('state').style.fontSize=(choice?(g.choiceTextSize||34):(g.stateTextSize||30))+'px'}
const textObserver=new MutationObserver(()=>refreshTextVisibility());textObserver.observe($('state'),{childList:true,characterData:true,subtree:true});
const playBeforeV63=play;
play=async function(ev,token,animationUrl,g){const forced={...g};if(layoutOverride==='card')forced.effectStyle='card';if(layoutOverride==='fullscreen')forced.effectStyle='fullscreen-slot';activeTextSettings=forced;refreshTextVisibility(forced);return playBeforeV63(ev,token,animationUrl,forced)};
async function refreshGlobalTextFx(){try{const s=await(await fetch('/api/state',{cache:'no-store'})).json();applyGlobalTextFx(s)}catch(e){}}refreshGlobalTextFx();setInterval(refreshGlobalTextFx,1000);setInterval(()=>refreshTextVisibility(livePreviewG||activeTextSettings||{}),250);

let previewSceneTimer=null,activePreviewScene="normal-spin",scenePreviewMode=false;
function applyGachaScene(g,scene){const style={...(g||{}),...((g&&g.previewSceneStyles&&g.previewSceneStyles[scene])||{})};activePreviewScene=scene;activeTextSettings=style;applyPatternText(style);refreshTextVisibility(style);setOverlayFont(style.globalFontFamily||'system');$('card').style.setProperty('--gacha-font',fontStack(style.fontFamily));const card=$('card');card.classList.toggle('fullscreen',style.effectStyle==='fullscreen-slot');const positions=g?.previewScenePositions?.[scene]||((scene==='normal-spin')?g?.previewPositions:null)||{};const keys={pattern:'pattern',sender:'sender',result:'result',state:'state',total:'total'};let has=false;for(const [key,id] of Object.entries(keys)){const el=$(id),pos=positions[key];el.classList.remove('elementLayoutPiece');if(pos&&Number.isFinite(+pos.x)&&Number.isFinite(+pos.y)){el.style.setProperty('--edit-x',Math.max(0,Math.min(100,+pos.x))+'%');el.style.setProperty('--edit-y',Math.max(0,Math.min(100,+pos.y))+'%');el.classList.add('elementLayoutPiece');has=true}else{el.style.removeProperty('--edit-x');el.style.removeProperty('--edit-y')}}card.classList.toggle('hasElementLayout',has);return style}
function showPreviewScene(data){const g=data.g||{},scene=data.scene||'normal-spin',style=applyGachaScene(g,scene),card=$('card');livePreviewG=g;card.classList.add('show','layoutEditor');card.classList.remove('spinning','preAlert','preAlertTextOff');const bg=style.cardBg||'#17151c',m=/^#([0-9a-f]{6})$/i.exec(bg),rgb=m?[parseInt(bg.slice(1,3),16),parseInt(bg.slice(3,5),16),parseInt(bg.slice(5,7),16)].join(','):'23,21,28';card.style.backgroundColor=`rgba(${rgb},${Math.max(0,Math.min(100,+(style.cardOpacity??94)))/100})`;card.style.borderColor=style.cardBorder||'#ffcf59';card.style.setProperty('--gacha-text',style.cardTextColor||'#fff');card.style.setProperty('--spin-state-color',style.stateTextColor||'#ffe9a6');card.style.setProperty('--spin-state-size',(style.stateTextSize||30)+'px');card.style.setProperty('--gacha-font',fontStack(style.fontFamily));setOverlayFont(style.globalFontFamily||'system');document.documentElement.style.setProperty('--text-glow',style.textGlowEnabled?'0 0 '+(style.textGlowStrength??12)+'px '+(style.textGlowColor||'#e52b3c'):'none');document.documentElement.style.setProperty('--pattern-glow',style.textGlowEnabled?'0 0 '+(style.textGlowStrength??12)+'px '+(style.textGlowColor||'#e52b3c'):'none');$('pattern').textContent=style.patternName||'プレビュー';$('sender').textContent='プレビュー ギフター';$('result').textContent=scene==='normal-spin'||scene==='upper-spin'?'??':(scene==='start'?'START':'+10 WIN');$('state').textContent=scene==='normal-spin'||scene==='upper-spin'?'抽選中…':scene==='continue'||scene==='upper-continue'?'継続！':scene==='upper-entry'?'上位AT突入！':scene==='end'?'AT終了':'抽選結果';$('total').textContent=scene==='start'?'START':scene==='end'?'今回の合計 +10 WIN':'今回 +10 WIN';$('result').classList.toggle('negative',false);let media=style.animationUrl||'',audio=style.audioUrl||'';if(/^preAlert[123]$/.test(scene)){const a=g.preAlerts?.[+scene.slice(-1)-1]||{};media=a.animationUrl||'';audio=a.audioUrl||'';$('state').textContent=a.text||'チャンス！';card.classList.toggle('preAlert',a.displayMode!=='sound-only');card.classList.toggle('preAlertTextOff',a.showText===false);card.style.setProperty('--pre-alert-color',a.color||'#ffe05b');card.style.setProperty('--pre-alert-text-size',(a.textSize||56)+'px');if(a.displayMode==='sound-only')$('state').textContent=''}else{card.classList.remove('preAlertTextOff')}if(scene==='end'){media=style.endAnimationUrl||media;audio=style.endAudioUrl||audio}if(scene==='upper-spin'||scene==='upper-continue'){media=style.upperAtAnimationUrl||media;audio=style.upperAtAudioUrl||audio}setMedia(media,style);if(activeAudio){activeAudio.pause();activeAudio.currentTime=0;activeAudio=null}if(data.action==='play'&&audio){activeAudio=new Audio(audio);activeAudio.loop=true;activeAudio.volume=Math.max(0,Math.min(1,(+(style.audioVolume??75))/100));activeAudio.play().catch(()=>{})}refreshTextVisibility(style)}
window.addEventListener('message',event=>{if(event.origin!==location.origin)return;const d=event.data||{};if(!new URLSearchParams(location.search).has('preview'))return;if(d.type==='gacha-preview-play'){livePreviewG=d.g||{};activeTextSettings=livePreviewG;const ev={...(d.event||{}),preview:true};playToken++;play(ev,playToken,d.animationUrl||livePreviewG.animationUrl||'',livePreviewG);return}if(d.type==='gacha-preview-scene'){if(d.action==='stop'){playToken++;stopOverlayPlayback();return}playToken++;showPreviewScene(d);return}if(d.type==='gacha-preview-update'){showPreviewScene({...d,scene:activePreviewScene,action:'show'});return}});
for(const key of ['pattern','sender','result','state','total']){$(key).addEventListener('pointerdown',event=>{if(!new URLSearchParams(location.search).has('preview')||!livePreviewG)return;event.preventDefault();const card=$('card'),r=card.getBoundingClientRect(),e=$(key),x=Math.max(0,Math.min(100,(event.clientX-r.left)/r.width*100)),y=Math.max(0,Math.min(100,(event.clientY-r.top)/r.height*100));e.setPointerCapture?.(event.pointerId);const send=()=>parent.postMessage({type:'gacha-element-layout',patternId:livePreviewG.id,scene:activePreviewScene,key,x,y},location.origin);send();const move=ev=>{const xx=Math.max(0,Math.min(100,(ev.clientX-r.left)/r.width*100)),yy=Math.max(0,Math.min(100,(ev.clientY-r.top)/r.height*100));e.style.setProperty('--edit-x',xx+'%');e.style.setProperty('--edit-y',yy+'%');parent.postMessage({type:'gacha-element-layout',patternId:livePreviewG.id,scene:activePreviewScene,key,x:xx,y:yy},location.origin)};const done=()=>{e.removeEventListener('pointermove',move);e.removeEventListener('pointerup',done);e.removeEventListener('pointercancel',done)};e.addEventListener('pointermove',move);e.addEventListener('pointerup',done);e.addEventListener('pointercancel',done)})}

if(!new URLSearchParams(location.search).has("preview")){update();setInterval(update,250)}
