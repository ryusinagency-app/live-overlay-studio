<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>機種別データ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Yu Gothic UI","Meiryo",sans-serif;color:#fff}.wrap{display:inline-flex;flex-direction:column;gap:10px;min-width:360px;padding:16px 20px;border:2px solid var(--accent,#ffcf59);border-radius:18px;background:var(--panel,rgba(17,18,25,.85));box-shadow:0 8px 28px rgba(0,0,0,.3)}.name{margin:0;text-align:center;font-weight:900;font-size:var(--name-size,30px);line-height:1.15}.stats{display:flex;gap:10px}.wrap.vertical .stats{flex-direction:column}.item{display:flex;flex:1;min-width:120px;align-items:center;justify-content:center;gap:8px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.07);white-space:nowrap}.label{font-size:var(--label-size,18px);font-weight:700}.value{font-size:var(--value-size,46px);font-weight:950;line-height:1;color:var(--accent,#ffcf59);text-shadow:0 2px 8px rgba(0,0,0,.45)}.error{font-size:20px;font-weight:800}.hidden{display:none!important}
</style>
</head>
<body>
<main id="wrap" class="wrap hidden"><h1 id="name" class="name"></h1><div id="stats" class="stats"></div><div id="error" class="error hidden"></div></main>
<script>
const params=new URLSearchParams(location.search),type=params.get('type')==='pachinko'?'pachinko':'slot',patternId=params.get('id')||'',wrap=document.getElementById('wrap'),nameEl=document.getElementById('name'),statsEl=document.getElementById('stats'),errorEl=document.getElementById('error');
const rgba=(hex,opacity)=>{const value=String(hex||'#111219').replace('#',''),n=parseInt(value,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${Math.max(0,Math.min(100,+opacity||0))/100})`};
function render(data){wrap.classList.remove('hidden');if(!data.ok){statsEl.replaceChildren();nameEl.textContent='';errorEl.textContent=data.message||'データを取得できません';errorEl.classList.remove('hidden');return}errorEl.classList.add('hidden');const style=data.style||{},stats=data.stats||{};wrap.classList.toggle('vertical',style.layout==='vertical');wrap.style.setProperty('--panel',rgba(style.background,style.backgroundOpacity));wrap.style.setProperty('--accent',style.accentColor||'#ffcf59');wrap.style.setProperty('--name-size',(style.nameSize||30)+'px');wrap.style.setProperty('--label-size',(style.labelSize||18)+'px');wrap.style.setProperty('--value-size',(style.valueSize||46)+'px');wrap.style.color=style.textColor||'#fff';nameEl.textContent=data.patternName||'';nameEl.classList.toggle('hidden',style.showName===false);const rows=type==='pachinko'?[['showCurrent','現在回転',stats.currentSpins],['showInitialHits','初当たり',stats.initialHits],['showHitCount','大当たり',stats.hitCount],['showTotal','累計回転',stats.totalSpins],['showBestStreak','最高連チャン',stats.bestStreak],['showState','状態',data.state]]:[['showCurrent','現在回転',stats.currentSpins],['showHitCount','大当たり',stats.hitCount],['showTotal','累計回転',stats.totalSpins],['showState','状態',data.state]];statsEl.replaceChildren();for(const [key,label,value] of rows){if(style[key]===false||key==='showState'&&style[key]!==true)continue;const item=document.createElement('div');item.className='item';const l=document.createElement('span');l.className='label';l.textContent=label;const v=document.createElement('strong');v.className='value';v.textContent=value??0;item.append(l,v);statsEl.appendChild(item)}}
async function poll(){try{const response=await fetch(`/api/overlay/machine-stats?type=${encodeURIComponent(type)}&id=${encodeURIComponent(patternId)}`,{cache:'no-store'});if(response.ok)render(await response.json())}catch(error){}}poll();setInterval(poll,500);
</script>
</body>
</html>
