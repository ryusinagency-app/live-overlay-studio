<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ギフト履歴</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:var(--font,system-ui,"Yu Gothic",sans-serif)}.stage{height:100%;padding:10px;display:flex;flex-direction:column;gap:8px}.heading{display:none;margin:0;font-size:26px;font-weight:950;color:var(--text,#fff);text-shadow:0 2px 8px #000}.heading.show{display:block}.viewport{display:none;flex:1;min-height:0;overflow:hidden}.viewport.show{display:block}.track{display:flex;width:100%;height:100%;transition:transform .65s cubic-bezier(.22,.72,.2,1),opacity .3s}.track.vertical{flex-direction:column}.page{flex:0 0 100%;width:100%;height:100%;display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));grid-template-rows:repeat(var(--rows,2),minmax(0,1fr));gap:9px;padding:2px;align-items:center}.gift{width:var(--card-width,100%);height:var(--card-height,100%);max-width:100%;max-height:100%;min-width:0;min-height:0;display:grid;grid-template-columns:var(--avatar,44px) minmax(24px,.9fr) minmax(24px,1.15fr) auto var(--image,44px);column-gap:var(--icon-gap,8px);row-gap:8px;align-items:center;justify-self:center;padding:8px 10px;color:var(--text,#fff);background:var(--bg,rgba(28,28,36,.93));border:1px solid var(--border,#ffcf59);border-left:4px solid var(--border,#ffcf59);border-radius:12px;box-shadow:0 4px 14px #0006}.gift img{display:block;object-fit:contain;flex:none;min-width:0;min-height:0}.avatar{display:block;width:var(--avatar,44px);height:var(--avatar,44px);max-width:none;max-height:none;flex:none;border-radius:50%;object-fit:cover!important}.giftImage{display:block;width:var(--image,44px);height:var(--image,44px);max-width:none;max-height:none;flex:none}img.empty{visibility:hidden}.sender,.giftName{min-width:0;overflow:hidden;white-space:nowrap;font-weight:900;font-size:calc(var(--name,18px)*var(--scale,1))}.giftName{font-size:calc(var(--gift-name,16px)*var(--scale,1));font-weight:750}.marquee span{display:inline-block;min-width:100%;white-space:nowrap}.marquee.scrolling span{min-width:max-content;padding-right:24px;animation:marquee var(--marquee-time,7s) ease-in-out infinite alternate}@keyframes marquee{to{transform:translateX(calc(-1*var(--marquee-distance,0px)))}}.count{white-space:nowrap;font-size:calc(var(--count,15px)*var(--scale,1));font-weight:950;padding:3px 6px;border-radius:999px;background:#0003}.pageCount{display:none;align-self:flex-end;padding:2px 7px;border-radius:999px;background:#08080dbb;font-size:11px}.pageCount.show{display:block}.track.fade{transition:transform 0s,opacity .25s}.track.fading{opacity:0}.track.continuous{transition-timing-function:linear}.textFx{-webkit-text-stroke:var(--stroke,0 transparent);paint-order:stroke fill;background:var(--text-bg,transparent);border-radius:6px;padding:var(--text-pad,0)}
</style></head><body><main class="stage"><h1 id="heading" class="heading">ギフト履歴</h1><div id="viewport" class="viewport"><div id="track" class="track"></div></div><div id="pageCount" class="pageCount"></div></main><script>
const $=id=>document.getElementById(id),fonts={system:'system-ui,"Yu Gothic",Meiryo,sans-serif',yuGothic:'"Yu Gothic","游ゴシック",sans-serif',meiryo:'Meiryo,sans-serif',gothic:'"Arial Black",Impact,sans-serif',serif:'"Yu Mincho",serif',mono:'ui-monospace,Consolas,monospace'};
const ja={rose:'バラ','my first rose':'はじめてのバラ','red rose':'赤いバラ','white rose':'白いバラ','finger heart':'指ハート','hand heart':'ハンドハート','heart me':'ハートミー',heart:'ハート','love you':'大好き','love you so much':'大好き','love letter':'ラブレター',kiss:'キス','ice cream':'アイスクリーム',perfume:'香水','money gun':'マネーガン','money rain':'お金の雨',doughnut:'ドーナツ',donut:'ドーナツ',lollipop:'ペロペロキャンディ',candy:'キャンディ',cake:'ケーキ','birthday cake':'バースデーケーキ','cake slice':'ケーキ',cupcake:'カップケーキ',popcorn:'ポップコーン',watermelon:'スイカ',pizza:'ピザ',burger:'ハンバーガー','french fries':'フライドポテト',sushi:'寿司',ramen:'ラーメン',tea:'お茶',coffee:'コーヒー',champagne:'シャンパン',beer:'ビール',cocktail:'カクテル',cap:'キャップ',sunglasses:'サングラス',lipstick:'口紅',handbag:'ハンドバッグ','high heels':'ハイヒール',lion:'ライオン',universe:'宇宙',galaxy:'銀河',planet:'惑星',moon:'月',sun:'太陽','meteor shower':'流星群',swan:'白鳥',fireworks:'花火','firework show':'花火',bouquet:'花束',sunflower:'ひまわり',tulip:'チューリップ',flower:'花',concert:'コンサート','sports car':'スポーツカー','golden sport car':'ゴールデンスポーツカー','golden sports car':'ゴールデンスポーツカー','racing car':'レーシングカー',motorcycle:'バイク',car:'車',airplane:'飛行機','private jet':'プライベートジェット',train:'電車','sailing ship':'帆船',yacht:'ヨット',submarine:'潜水艦',trophy:'トロフィー',medal:'メダル','gold medal':'金メダル',crown:'王冠',diamond:'ダイヤモンド',star:'星',dragon:'ドラゴン',phoenix:'不死鳥',unicorn:'ユニコーン',dinosaur:'恐竜',panda:'パンダ',corgi:'コーギー',puppy:'子犬',bear:'クマ',bunny:'うさぎ',rabbit:'うさぎ',butterfly:'チョウ','cat paw':'猫の手','panda hug':'パンダハグ',rocket:'ロケット',spaceship:'宇宙船',castle:'城','magic wand':'魔法の杖','magic lamp':'魔法のランプ','magic carpet':'魔法のじゅうたん','gift box':'プレゼントボックス','treasure chest':'宝箱',confetti:'紙吹雪','party popper':'クラッカー','paper crane':'折り鶴',mic:'マイク',microphone:'マイク',guitar:'ギター',drum:'ドラム','music notes':'音符','jazz band':'ジャズバンド','tiktok universe':'TikTokユニバース','tiktok stars':'TikTokスター','tiktok shuttle':'TikTokシャトル','live ranking ticket':'LIVEランキングチケット',gg:'GG'};
const localName=v=>{const raw=String(v||'ギフト').trim(),key=raw.normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();return ja[key]||raw};
function rgba(hex,a){const m=/^#([0-9a-f]{6})$/i.exec(hex||'');return m?`rgba(${parseInt(m[1].slice(0,2),16)},${parseInt(m[1].slice(2,4),16)},${parseInt(m[1].slice(4,6),16)},${a})`:'rgba(28,28,36,.93)'}
function textNode(text,cls){const n=document.createElement('div');n.className=cls+' marquee textFx';const s=document.createElement('span');s.textContent=text;n.append(s);requestAnimationFrame(()=>{const d=Math.max(0,s.scrollWidth-n.clientWidth);if(d>3){n.classList.add('scrolling');n.style.setProperty('--marquee-distance',d+'px');n.style.setProperty('--marquee-time',Math.max(4,Math.min(18,d/28))+'s')}});return n}
function card(x){const n=document.createElement('article');n.className='gift';const av=document.createElement('img');av.className='avatar'+(x.avatarUrl?'':' empty');if(x.avatarUrl)av.src=x.avatarUrl;const name=textNode(x.senderName||'ゲスト','sender'),gift=textNode(localName(x.giftName),'giftName'),count=document.createElement('span');count.className='count textFx';count.textContent='×'+Math.max(1,+x.count||1);const image=document.createElement('img'),url=x.giftImageUrl||x.imageUrl||'';image.className='giftImage'+(url?'':' empty');if(url)image.src=url;n.append(av,name,gift,count,image);return n}
let signature='',pages=[],index=0,next=0,config={};
function position(){const t=$('track');t.style.transform=config.direction==='vertical'?`translateY(-${index*100}%)`:`translateX(-${index*100}%)`;$('pageCount').textContent=pages.length>1?`${index+1} / ${pages.length}`:'';$('pageCount').classList.toggle('show',pages.length>1)}
function apply(animated=true){const t=$('track');if(config.style==='fade'&&animated){t.classList.add('fading');setTimeout(()=>{position();t.classList.remove('fading')},240)}else position()}
function draw(items){const per=config.style==='single'?1:config.columns*config.rows,t=$('track');pages=[];t.replaceChildren();t.className='track '+(config.direction==='vertical'?'vertical ':'')+config.style;for(let i=0;i<items.length;i+=per){const p=document.createElement('section');p.className='page';p.style.setProperty('--cols',config.style==='single'?1:config.columns);p.style.setProperty('--rows',config.style==='single'?1:config.rows);items.slice(i,i+per).forEach(x=>p.append(card(x)));t.append(p);pages.push(p)}index=0;next=Date.now()+config.delay;apply(false)}
function step(){if(pages.length<2||config.style==='static'||Date.now()<next)return;if(index>=pages.length-1){if(!config.loop)return;index=0}else index++;const duration=config.style==='continuous'?Math.max(300,100000/config.speed):config.delay;$('track').style.transitionDuration=config.style==='continuous'?duration+'ms':'';next=Date.now()+(config.style==='continuous'?duration:config.delay);apply(true)}
function textEffects(state){const c=(state.textEffects||{}).giftWall||{},fx=c.mode==='custom'?c:{outlineEnabled:state.textOutlineEnabled,outlineColor:state.textOutlineColor,outlineWidth:state.textOutlineWidth,backgroundEnabled:state.textBackgroundEnabled,backgroundColor:state.textBackgroundColor,backgroundOpacity:state.textBackgroundOpacity};document.documentElement.style.setProperty('--stroke',fx.outlineEnabled?`${Math.max(0,Math.min(10,+fx.outlineWidth||0))}px ${fx.outlineColor||'#000'}`:'0 transparent');document.documentElement.style.setProperty('--text-bg',fx.backgroundEnabled?rgba(fx.backgroundColor||'#000',Math.max(0,Math.min(100,+fx.backgroundOpacity||0))/100):'transparent');document.documentElement.style.setProperty('--text-pad',fx.backgroundEnabled?'1px 5px':'0')}
async function update(){try{const state=await(await fetch('/api/state',{cache:'no-store'})).json(),w=state.giftWall||{};config={columns:Math.max(1,Math.min(8,+w.columns||4)),rows:Math.max(1,Math.min(5,+w.rows||2)),direction:w.scrollDirection==='horizontal'?'horizontal':'vertical',style:['page','continuous','single','fade','slide','static'].includes(w.scrollStyle)?w.scrollStyle:'page',speed:Math.max(10,Math.min(300,+w.scrollSpeed||60)),loop:w.loop!==false,delay:Math.max(2,Math.min(60,+w.pageSeconds||8))*1000};let items=(w.displayHistory||[]).slice(0,200);if(w.newestFirst!==false)items=items.slice().sort((a,b)=>(+b.createdAt||+b.id||0)-(+a.createdAt||+a.id||0));const root=document.documentElement,scale=Math.max(.3,Math.min(4,(+state.textScale||100)/100*(+w.textScale||100)/100));root.style.setProperty('--font',fonts[w.fontFamily==='global'?state.fontFamily:w.fontFamily]||fonts.system);root.style.setProperty('--scale',scale);root.style.setProperty('--avatar',Math.max(20,Math.min(160,+w.avatarSize||44))+'px');root.style.setProperty('--image',Math.max(20,Math.min(160,+w.giftImageSize||44))+'px');root.style.setProperty('--card-width',(+w.cardWidth>0?Math.max(100,Math.min(2000,+w.cardWidth))+'px':'100%'));root.style.setProperty('--card-height',(+w.cardHeight>0?Math.max(60,Math.min(800,+w.cardHeight))+'px':'100%'));root.style.setProperty('--icon-gap',Math.max(0,Math.min(80,+(w.iconGap??8)))+'px');root.style.setProperty('--name',Math.max(8,Math.min(80,+w.nameSize||18))+'px');root.style.setProperty('--gift-name',Math.max(8,Math.min(80,+w.giftNameSize||16))+'px');root.style.setProperty('--count',Math.max(8,Math.min(80,+w.countSize||15))+'px');root.style.setProperty('--text',w.cardTextColor||state.textColor||'#fff');root.style.setProperty('--border',w.cardBorder||'#ffcf59');root.style.setProperty('--bg',rgba(w.cardBg||'#1c1c24',Math.max(0,Math.min(100,+w.cardOpacity||93))/100));textEffects(state);const key=JSON.stringify({items,config,scale,font:w.fontFamily,sz:[w.avatarSize,w.giftImageSize,w.nameSize,w.giftNameSize,w.countSize,w.cardWidth,w.cardHeight,w.iconGap],colors:[w.cardTextColor,w.cardBorder,w.cardBg,w.cardOpacity]});if(key!==signature){signature=key;if(!items.length){pages=[];$('track').replaceChildren();$('viewport').classList.remove('show');$('heading').classList.remove('show');return}$('viewport').classList.add('show');$('heading').classList.add('show');draw(items)}step()}catch(e){}}
update();setInterval(update,250);
</script></body></html>
