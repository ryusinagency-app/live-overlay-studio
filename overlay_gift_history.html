<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ギフト履歴オーバーレイ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:var(--overlay-font,system-ui,"Yu Gothic",sans-serif)}.stage{width:100%;height:100%;padding:10px;display:flex;flex-direction:column;gap:9px}.heading{display:none;align-items:center;gap:9px;margin:0;font-size:clamp(18px,2vw,28px);font-weight:950;letter-spacing:.04em;text-shadow:0 2px 8px #000;color:var(--gift-text,#fff)}.heading.show{display:flex}.heading:before{content:"";width:7px;height:1.05em;border-radius:8px;background:var(--gift-border,#ffcf59);box-shadow:0 0 12px var(--gift-border,#ffcf59)}.viewport{display:none;width:100%;overflow:hidden}.viewport.show{display:block}.track{display:flex;align-items:stretch;transition:transform .7s cubic-bezier(.22,.72,.2,1);height:100%}.page{flex:0 0 100%;width:100%;height:100%;display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));grid-template-rows:repeat(var(--rows,2),minmax(0,1fr));gap:9px;padding:2px}.gift{color:var(--gift-text,#fff);min-width:0;min-height:68px;display:grid;grid-template-columns:var(--avatar-size,44px) minmax(0,.9fr) minmax(0,1.15fr) auto var(--gift-image-size,44px);gap:8px;align-items:center;padding:8px 10px;background:var(--gift-card-bg,rgba(28,28,36,.93));border:1px solid var(--gift-border,#ffcf59);border-left:4px solid var(--gift-border,#ffcf59);border-radius:12px;box-shadow:0 4px 14px #0006}.giftImage,.avatarImage{width:var(--gift-image-size,44px);height:var(--gift-image-size,44px);max-width:100%;object-fit:contain;filter:drop-shadow(0 0 7px #ffcf5944)}.avatarImage{width:var(--avatar-size,44px);height:var(--avatar-size,44px);border-radius:50%;object-fit:cover}.giftImage.empty,.avatarImage.empty{visibility:hidden}.sender,.giftName{min-width:0;overflow:hidden;white-space:nowrap;color:var(--gift-text,#fff);font-size:calc(var(--name-size,18px) * var(--gift-scale,1));font-weight:900}.giftName{font-size:calc(var(--giftname-size,16px) * var(--gift-scale,1));font-weight:750}.marquee{position:relative;display:block;min-width:0;overflow:hidden;text-overflow:clip}.marquee span{display:inline-block;min-width:100%;white-space:nowrap}.marquee.scrolling span{min-width:max-content;padding-right:24px;animation:gift-marquee var(--marquee-duration,6s) ease-in-out infinite alternate}@keyframes gift-marquee{from{transform:translateX(0)}to{transform:translateX(calc(-1 * var(--marquee-distance,0px)))}}.giftCount{font-size:calc(var(--count-size,15px) * var(--gift-scale,1));font-weight:900;white-space:nowrap;color:var(--gift-text,#fff);padding:3px 6px;border-radius:999px;background:#0003}.pageCount{align-self:flex-end;display:none;padding:2px 7px;border-radius:999px;background:#08080dbb;color:var(--gift-text,#eee);font-size:11px}.pageCount.show{display:block}@media(max-width:520px){.stage{padding:5px;gap:5px}.page{gap:5px;padding:1px}.gift{gap:4px;min-height:52px;padding:5px;border-radius:9px}.giftCount{padding:2px 4px}}
</style>
</head>
<body>
<main class="stage"><h1 class="heading" id="heading">ギフト履歴</h1><div class="viewport" id="viewport"><div class="track" id="track"></div></div><div class="pageCount" id="pageCount"></div></main>
<script>
function fontStack(key,globalKey='system'){const stacks={system:'system-ui,"Yu Gothic",Meiryo,sans-serif',yuGothic:'"Yu Gothic","游ゴシック",sans-serif',meiryo:'Meiryo,"メイリオ",sans-serif',gothic:'"Arial Black",Impact,sans-serif',serif:'"Yu Mincho","游明朝",serif',mono:'ui-monospace,Consolas,monospace'};return key&&key!=='global'?stacks[key]||stacks.system:stacks[globalKey]||stacks.system}

function setOverlayFont(key){const stacks={system:'system-ui,"Yu Gothic",Meiryo,sans-serif',yuGothic:'"Yu Gothic","游ゴシック",sans-serif',meiryo:'Meiryo,"メイリオ",sans-serif',gothic:'"Arial Black",Impact,sans-serif',serif:'"Yu Mincho","游明朝",serif',mono:'ui-monospace,Consolas,monospace'};document.documentElement.style.setProperty("--overlay-font",stacks[key]||stacks.system)}

const $=id=>document.getElementById(id);let signature='',pages=[],pageIndex=0,nextFlip=0,flipMs=8000;
const giftNameJa={'rose':'バラ','my first rose':'はじめてのバラ','tiktok':'TikTok','finger heart':'指ハート','gg':'GG','ice cream':'アイスクリーム','perfume':'香水','money gun':'マネーガン','doughnut':'ドーナツ','donut':'ドーナツ','cap':'キャップ','lion':'ライオン','universe':'宇宙','tiktok universe':'TikTokユニバース','galaxy':'銀河','swan':'白鳥','hand heart':'ハンドハート','paper crane':'折り鶴','fireworks':'花火','sunglasses':'サングラス','love you':'大好き','heart me':'ハートミー','bouquet':'花束','concert':'コンサート','golden sport car':'ゴールデンスポーツカー','golden sports car':'ゴールデンスポーツカー','racing car':'レーシングカー','motorcycle':'バイク','diamond tree':'ダイヤモンドツリー','sailing ship':'帆船','airplane':'飛行機','sports car':'スポーツカー','train':'電車','mic':'マイク','love letter':'ラブレター','trophy':'トロフィー','corgi':'コーギー','champagne':'シャンパン','cake slice':'ケーキ','panda':'パンダ','jazz band':'ジャズバンド','confetti':'紙吹雪','heart me':'ハートミー','finger heart':'指ハート','mini speaker':'ミニスピーカー','thumbs up':'いいね','thumbs up hand':'いいね','rose hand':'バラ','ribbon':'リボン','tea':'お茶','coffee':'コーヒー','chocolate':'チョコレート','swan boat':'白鳥のボート','love balloon':'ハートの風船','heart balloon':'ハートの風船','balloon':'風船','party popper':'クラッカー','confetti':'紙吹雪','fireworks show':'花火','boxing gloves':'ボクシンググローブ','football':'サッカーボール','soccer':'サッカーボール','basketball':'バスケットボール','tennis':'テニス','soccer ball':'サッカーボール','gold medal':'金メダル','crown':'王冠','diamond':'ダイヤモンド','star':'星','starlight':'星明かり','lightning bolt':'稲妻','thunder':'雷','magic wand':'魔法の杖','magic lamp':'魔法のランプ','rocket':'ロケット','spaceship':'宇宙船','castle':'城','unicorn':'ユニコーン','dragon':'ドラゴン','phoenix':'不死鳥','dinosaur':'恐竜','panda hug':'パンダハグ','lion dance':'獅子舞','cat paw':'猫の手','puppy':'子犬','corgi':'コーギー','bear':'クマ','bunny':'うさぎ','rabbit':'うさぎ','squirrel':'リス','butterfly':'チョウ','sunflower':'ひまわり','tulip':'チューリップ','daisy':'デイジー','flower':'花','bouquet':'花束','red rose':'赤いバラ','white rose':'白いバラ','love you so much':'大好き','love you very much':'大好き','kiss':'キス','finger heart':'指ハート','hand heart':'ハンドハート','heart':'ハート','heart me':'ハートミー','love bang':'ラブバン','love you':'大好き','lollipop':'ペロペロキャンディ','candy':'キャンディ','cake':'ケーキ','birthday cake':'バースデーケーキ','cake slice':'ケーキ','cupcake':'カップケーキ','donut':'ドーナツ','doughnut':'ドーナツ','popcorn':'ポップコーン','watermelon':'スイカ','chili':'唐辛子','soda':'ソーダ','lemon tea':'レモンティー','lemon':'レモン','sushi':'寿司','ramen':'ラーメン','pizza':'ピザ','burger':'ハンバーガー','french fries':'フライドポテト','champagne':'シャンパン','wine glass':'ワイングラス','beer':'ビール','cocktail':'カクテル','perfume':'香水','lipstick':'口紅','handbag':'ハンドバッグ','high heels':'ハイヒール','sneakers':'スニーカー','sunglasses':'サングラス','cap':'キャップ','crown for you':'あなたに王冠','motorcycle':'バイク','racing car':'レーシングカー','sports car':'スポーツカー','car':'車','golden sport car':'ゴールデンスポーツカー','golden sports car':'ゴールデンスポーツカー','private jet':'プライベートジェット','jet plane':'ジェット機','airplane':'飛行機','sailing ship':'帆船','yacht':'ヨット','submarine':'潜水艦','train':'電車','magic carpet':'魔法のじゅうたん','tiktok universe':'TikTokユニバース','tiktok stars':'TikTokスター','tiktok shuttle':'TikTokシャトル','live ranking ticket':'LIVEランキングチケット','mic':'マイク','microphone':'マイク','music notes':'音符','jazz band':'ジャズバンド','drum':'ドラム','guitar':'ギター','fireworks':'花火','firework':'花火','firework show':'花火','diamond tree':'ダイヤモンドツリー','galaxy':'銀河','universe':'宇宙','planet':'惑星','moon':'月','sun':'太陽','meteor shower':'流星群','swan':'白鳥','paper crane':'折り鶴','money gun':'マネーガン','money rain':'お金の雨','treasure chest':'宝箱','gift box':'プレゼントボックス','trophy':'トロフィー','medal':'メダル','confetti':'紙吹雪','concert':'コンサート','love letter':'ラブレター','hand heart':'ハンドハート','finger heart':'指ハート','gg':'GG'};
function normalizedGiftKey(value){return String(value||'').normalize('NFKC').toLocaleLowerCase().replace(/[’‘`]/g,"'").replace(/[^\p{L}\p{N}]+/gu,' ').trim().replace(/\s+/g,' ')}
function localizedGiftName(value){const name=String(value||'ギフト').trim(),key=normalizedGiftKey(name);return giftNameJa[key]||name}
function marqueeText(text,className){const node=document.createElement('div');node.className=className+' marquee';const inner=document.createElement('span');inner.textContent=text;node.appendChild(inner);requestAnimationFrame(()=>{const distance=Math.max(0,inner.scrollWidth-node.clientWidth);if(distance>3){node.classList.add('scrolling');node.style.setProperty('--marquee-distance',distance+'px');node.style.setProperty('--marquee-duration',Math.max(4,Math.min(18,distance/28))+'s')}});return node}
function rgbaColor(hex,a){const m=/^#([0-9a-f]{6})$/i.exec(hex||'');return m?`rgba(${parseInt(m[1].slice(0,2),16)},${parseInt(m[1].slice(2,4),16)},${parseInt(m[1].slice(4,6),16)},${a})`:'rgba(28,28,36,.93)'}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function timeText(value){const date=new Date((Number(value)||0)*1000);return Number.isNaN(date.getTime())?'':new Intl.DateTimeFormat('ja-JP',{hour:'2-digit',minute:'2-digit'}).format(date)}
function buildCard(item){const card=document.createElement('article');card.className='gift';const avatar=document.createElement('img');avatar.className='avatarImage'+(item.avatarUrl?'':' empty');avatar.alt='';avatar.loading='lazy';if(item.avatarUrl)avatar.src=item.avatarUrl;const sender=marqueeText(item.senderName||'ゲスト','sender');const giftName=marqueeText(localizedGiftName(item.giftName),'giftName');const count=document.createElement('span');count.className='giftCount';count.textContent='×'+Math.max(1,Number(item.count)||1);const imageUrl=item.giftImageUrl||item.imageUrl||'';const image=document.createElement('img');image.className='giftImage'+(imageUrl?'':' empty');image.alt='';image.loading='lazy';if(imageUrl)image.src=imageUrl;card.append(avatar,sender,giftName,count,image);return card}
function drawPages(items,columns,rows,direction){const perPage=columns*rows;pages=[];$('track').replaceChildren();$('track').style.flexDirection=direction==='vertical'?'column':'row';for(let i=0;i<items.length;i+=perPage){const page=document.createElement('section');page.className='page';page.style.setProperty('--cols',columns);page.style.setProperty('--rows',rows);items.slice(i,i+perPage).forEach(item=>page.appendChild(buildCard(item)));$('track').appendChild(page);pages.push(page)}pageIndex=0;flipMs=Math.max(2,Math.min(60,+window.pageSeconds||8))*1000;nextFlip=Date.now()+flipMs;applyPage()}
function applyPage(){const direction=window.scrollDirection||'vertical';$('track').style.transform=direction==='vertical'?`translateY(-${pageIndex*100}%)`:`translateX(-${pageIndex*100}%)`;$('pageCount').textContent=pages.length>1?(pageIndex+1)+' / '+pages.length:'';$('pageCount').classList.toggle('show',pages.length>1)}
async function update(){try{const response=await fetch('/api/state',{cache:'no-store'}),state=await response.json();setOverlayFont(state.fontFamily);const wall=state.giftWall||{};setOverlayFont(wall.fontFamily==='global'?state.fontFamily:wall.fontFamily);const scale=Math.max(.3,Math.min(4,(Number(state.textScale)||100)/100*(Number(wall.textScale)||100)/100));document.documentElement.style.setProperty('--gift-scale',scale);document.documentElement.style.setProperty('--avatar-size',Math.max(20,Math.min(160,+wall.avatarSize||44))+'px');document.documentElement.style.setProperty('--name-size',Math.max(8,Math.min(80,+wall.nameSize||18))+'px');document.documentElement.style.setProperty('--giftname-size',Math.max(8,Math.min(80,+wall.giftNameSize||16))+'px');document.documentElement.style.setProperty('--count-size',Math.max(8,Math.min(80,+wall.countSize||15))+'px');document.documentElement.style.setProperty('--gift-image-size',Math.max(20,Math.min(160,+wall.giftImageSize||44))+'px');document.documentElement.style.setProperty('--gift-text',wall.cardTextColor||state.textColor||'#fff');document.documentElement.style.setProperty('--gift-border',wall.cardBorder||'#ffcf59');document.documentElement.style.setProperty('--gift-card-bg',rgbaColor(wall.cardBg||'#1c1c24',Math.max(0,Math.min(100,Number(wall.cardOpacity)??93))/100));const columns=Math.max(1,Math.min(8,Number(wall.columns)||4)),rows=Math.max(1,Math.min(5,Number(wall.rows)||2)),direction=wall.scrollDirection==='horizontal'?'horizontal':'vertical',items=(wall.displayHistory||[]).slice(0,200);window.pageSeconds=wall.pageSeconds||8;window.scrollDirection=direction;const key=JSON.stringify({columns,rows,direction,pageSeconds:wall.pageSeconds,items,scale,avatarSize:wall.avatarSize,nameSize:wall.nameSize,giftNameSize:wall.giftNameSize,countSize:wall.countSize,giftImageSize:wall.giftImageSize,cardBg:wall.cardBg,cardBorder:wall.cardBorder,cardTextColor:wall.cardTextColor,cardOpacity:wall.cardOpacity,fontFamily:wall.fontFamily||state.fontFamily});if(key!==signature){signature=key;if(!items.length){pages=[];$('track').replaceChildren();$('viewport').classList.remove('show');$('heading').classList.remove('show');$('pageCount').classList.remove('show');return}$('heading').classList.add('show');$('viewport').classList.add('show');$('viewport').style.height='100%';$('viewport').style.flex='1';drawPages(items,columns,rows,direction)}else if(pages.length>1&&Date.now()>=nextFlip){pageIndex=(pageIndex+1)%pages.length;nextFlip=Date.now()+flipMs;applyPage()}}catch(error){}}
update();setInterval(update,500);
function rgbaTextBg(hex,opacity){const m=/^#([0-9a-f]{6})$/i.exec(hex||'');return m?`rgba(${parseInt(m[1].slice(0,2),16)},${parseInt(m[1].slice(2,4),16)},${parseInt(m[1].slice(4,6),16)},${opacity})`:'transparent'}function applyGlobalTextFx(s){const custom=(s.textEffects||{}).giftWall||{},fx=custom.mode==='custom'?custom:{outlineEnabled:s.textOutlineEnabled,outlineColor:s.textOutlineColor,outlineWidth:s.textOutlineWidth,backgroundEnabled:s.textBackgroundEnabled,backgroundColor:s.textBackgroundColor,backgroundOpacity:s.textBackgroundOpacity},nodes=document.querySelectorAll('.heading,.sender,.giftName,.giftCount,.pageCount'),stroke=fx.outlineEnabled?Math.max(0,Math.min(10,+fx.outlineWidth||0))+'px '+(fx.outlineColor||'#000'):'0 transparent',bg=fx.backgroundEnabled?rgbaTextBg(fx.backgroundColor||'#000',Math.max(0,Math.min(100,+fx.backgroundOpacity||0))/100):'';nodes.forEach(node=>{node.style.webkitTextStroke=stroke;node.style.paintOrder='stroke fill';node.style.backgroundColor=bg;node.style.boxDecorationBreak='clone';node.style.webkitBoxDecorationBreak='clone';node.style.borderRadius='6px';node.style.padding=fx.backgroundEnabled?'1px 5px':''})}async function refreshGlobalTextFx(){try{applyGlobalTextFx(await(await fetch('/api/state',{cache:'no-store'})).json())}catch(e){}}refreshGlobalTextFx();setInterval(refreshGlobalTextFx,1000);
</script>
</body>
</html>
