<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WINカウンター</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:var(--overlay-font,system-ui,"Yu Gothic",sans-serif);color:var(--card-text,var(--text,#fff))}.card{position:absolute;left:4%;top:6%;min-width:300px;padding:15px 22px 18px;background:var(--panel,rgba(20,20,27,.9));border-left:7px solid var(--accent,#e52b3c);border-radius:0 14px 14px 0;color:var(--card-text,var(--text,#fff));filter:drop-shadow(0 4px 12px #0009)}.title{font-size:clamp(18px,2vw,30px);font-weight:900;letter-spacing:.08em}.winRow{display:flex;align-items:center;gap:12px}.winImage{display:block;width:64px;height:64px;object-fit:contain;flex:0 0 auto}.winImage.hidden{display:none}.value{font-size:clamp(36px,5vw,76px);font-weight:1000;line-height:1.1;text-shadow:var(--text-glow,none);font-variant-numeric:tabular-nums;white-space:nowrap}.currentValue,.goalValue{transition:color .2s ease}.track{height:9px;background:#ffffff35;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:var(--gauge,#ffd55c);transition:width .35s ease;border-radius:inherit}
</style>
<body>
<div class="card" id="card">
<div class="title" id="title">現在</div>
<div class="winRow"><img class="winImage hidden" id="winImage" alt=""><div class="value" id="winValue"><span class="currentValue" id="currentValue">0</span><span class="goalValue" id="goalValue">/10 WIN</span></div></div>
<div class="track">
<div class="fill" id="fill">
</div>
</div>
</div>
<script>
function fontStack(key,globalKey='system'){const stacks={system:'system-ui,"Yu Gothic",Meiryo,sans-serif',yuGothic:'"Yu Gothic","游ゴシック",sans-serif',meiryo:'Meiryo,"メイリオ",sans-serif',gothic:'"Arial Black",Impact,sans-serif',serif:'"Yu Mincho","游明朝",serif',mono:'ui-monospace,Consolas,monospace'};return key&&key!=='global'?stacks[key]||stacks.system:stacks[globalKey]||stacks.system}

function setOverlayFont(key){const stacks={system:'system-ui,"Yu Gothic",Meiryo,sans-serif',yuGothic:'"Yu Gothic","游ゴシック",sans-serif',meiryo:'Meiryo,"メイリオ",sans-serif',gothic:'"Arial Black",Impact,sans-serif',serif:'"Yu Mincho","游明朝",serif',mono:'ui-monospace,Consolas,monospace'};document.documentElement.style.setProperty("--overlay-font",stacks[key]||stacks.system)}

const $=id=>document.getElementById(id);async function update(){try{const r=await fetch('/api/state',{cache:'no-store'}),s=await r.json(),g=s.winCounter||{};setOverlayFont(s.fontFamily);const accent=s.accent||'#e52b3c',panel=s.panelColor||'#17181e',rgb=panel.match(/[0-9a-f]{2}/gi).map(v=>parseInt(v,16)).join(','),opacity=Math.max(0,Math.min(100,+s.panelOpacity||0))/100;document.documentElement.style.setProperty('--accent',accent);document.documentElement.style.setProperty('--gauge',s.gaugeColor||'#ffd55c');document.documentElement.style.setProperty('--text',s.textColor||'#fff');document.documentElement.style.setProperty('--text-glow',s.textGlowEnabled?`0 0 ${s.textGlowStrength||12}px ${s.textGlowColor||accent}`:'none');document.documentElement.style.setProperty('--panel',`rgba(${rgb},${opacity})`);const defaultText=g.cardTextColor||s.textColor||'#fff',cardBg=g.cardBg||s.cardDefaults?.background||panel,cardRgb=cardBg.match(/[0-9a-f]{2}/gi).map(v=>parseInt(v,16)).join(','),cardOpacity=g.cardOpacity>=0?g.cardOpacity/100:opacity;$('card').style.backgroundColor=`rgba(${cardRgb},${cardOpacity})`;$('card').style.borderLeftColor=g.cardBorder||s.cardDefaults?.border||accent;$('card').style.setProperty('--card-text',defaultText);$('card').style.fontFamily=fontStack(g.fontFamily,s.fontFamily);$('title').textContent=g.title??'現在';$('title').style.fontSize=Math.max(12,Math.min(120,+g.titleSize||30))+'px';$('winValue').style.fontSize=Math.max(20,Math.min(180,+g.valueSize||76))+'px';const n=Number(g.currentWin)||0,goal=Math.max(1,+g.goalWin||10);$('currentValue').textContent=String(n);$('currentValue').style.color=n<0?(g.negativeTextColor||'#ff4055'):(g.positiveTextColor||defaultText);$('goalValue').textContent='/'+goal+' WIN';$('goalValue').style.color=g.goalTextColor||defaultText;const image=$('winImage'),showImage=!!g.imageUrl&&g.imageEnabled!==false;image.classList.toggle('hidden',!showImage);if(showImage&&image.getAttribute('src')!==g.imageUrl)image.src=g.imageUrl;const imageSize=Math.max(20,Math.min(240,+g.imageSize||64));image.style.width=imageSize+'px';image.style.height=imageSize+'px';$('fill').style.width=Math.min(100,Math.max(0,n/goal*100))+'%'}catch(e){}}update();setInterval(update,250);
function rgbaTextBg(hex,opacity){const m=/^#([0-9a-f]{6})$/i.exec(hex||'');return m?`rgba(${parseInt(m[1].slice(0,2),16)},${parseInt(m[1].slice(2,4),16)},${parseInt(m[1].slice(4,6),16)},${opacity})`:'transparent'}function applyGlobalTextFx(s){const custom=(s.textEffects||{}).win||{},fx=custom.mode==='custom'?{outlineEnabled:custom.outlineEnabled,outlineColor:custom.outlineColor,outlineWidth:custom.outlineWidth,backgroundEnabled:custom.backgroundEnabled,backgroundColor:custom.backgroundColor,backgroundOpacity:custom.backgroundOpacity}:{outlineEnabled:s.textOutlineEnabled,outlineColor:s.textOutlineColor,outlineWidth:s.textOutlineWidth,backgroundEnabled:s.textBackgroundEnabled,backgroundColor:s.textBackgroundColor,backgroundOpacity:s.textBackgroundOpacity},nodes=document.querySelectorAll('.title,.currentValue,.goalValue'),stroke=fx.outlineEnabled?Math.max(0,Math.min(10,+fx.outlineWidth||0))+'px '+(fx.outlineColor||'#000'):'0 transparent',bg=fx.backgroundEnabled?rgbaTextBg(fx.backgroundColor||'#000',Math.max(0,Math.min(100,+fx.backgroundOpacity||0))/100):'';nodes.forEach(node=>{node.style.webkitTextStroke=stroke;node.style.paintOrder='stroke fill';node.style.backgroundColor=bg;node.style.boxDecorationBreak='clone';node.style.webkitBoxDecorationBreak='clone';node.style.borderRadius='6px';node.style.padding=fx.backgroundEnabled?'1px 5px':''})}async function refreshGlobalTextFx(){try{applyGlobalTextFx(await(await fetch('/api/state',{cache:'no-store'})).json())}catch(e){}}refreshGlobalTextFx();setInterval(refreshGlobalTextFx,1000);
</script>
<script>
let winSoundLastValue=null,winSoundLastGoal=null,winSoundPlayer=null;
async function pollWinSounds(){try{const state=await(await fetch('/api/state',{cache:'no-store'})).json(),w=state.winCounter||{},value=Number(w.currentWin)||0,goal=Math.max(1,Number(w.goalWin)||10);if(winSoundLastValue!==null&&w.soundEnabled){let url='',kind='';if(winSoundLastValue<goal&&value>=goal){url=w.goalSoundUrl||'';kind='goal'}else if(value>winSoundLastValue){url=w.addSoundUrl||'';kind='add'}else if(value<winSoundLastValue){url=w.subSoundUrl||'';kind='sub'}if(url){if(winSoundPlayer){winSoundPlayer.pause();winSoundPlayer.currentTime=0}winSoundPlayer=new Audio(url);const volume=w[kind+'SoundVolume']??w.soundVolume??75;winSoundPlayer.volume=Math.max(0,Math.min(1,Number(volume)/100));winSoundPlayer.play().catch(()=>{})}}winSoundLastValue=value;winSoundLastGoal=goal}catch(e){}}
pollWinSounds();setInterval(pollWinSounds,250);
</script>
</body>
</html>
