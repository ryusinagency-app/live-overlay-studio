<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パチンコガチャ</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,"Yu Gothic",sans-serif}.stage{position:absolute;inset:0;display:none;place-items:center}.stage.show{display:grid}.card{position:relative;width:min(900px,94vw);height:min(560px,90vh);overflow:hidden;display:grid;place-items:center;text-align:center;border:3px solid var(--accent,#ff3d66);border-radius:24px;background:var(--bg,rgba(18,11,24,.94));box-shadow:0 0 34px color-mix(in srgb,var(--accent) 60%,transparent);color:var(--text,#fff)}.card.fullscreen{width:100%;height:100%;border:0;border-radius:0}.media{position:absolute;inset:0;z-index:1;display:grid;place-items:center;overflow:hidden}.media img,.media video{width:100%;height:100%;object-fit:contain}.alertMedia{position:absolute;inset:0;z-index:4;display:none;place-items:center;overflow:hidden;pointer-events:none}.alertMedia.show{display:grid}.alertMedia img,.alertMedia video{width:100%;height:100%;object-fit:contain}.copy{position:relative;z-index:2;width:100%;height:100%;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-shadow:0 3px 14px #000}.pattern{position:absolute;top:4%;font-size:clamp(24px,4vw,54px);font-weight:950}.sender{position:absolute;top:14%;font-size:clamp(16px,2.3vw,30px);font-weight:800;color:#ffe7a1}.status{font-size:clamp(24px,5vw,var(--font-size,64px));font-weight:1000;letter-spacing:.05em}.status.preAlertMessage{color:var(--pre-alert-color,#ffe05b)!important;font-size:var(--pre-alert-size,56px)!important}.spin{font-size:clamp(54px,13vw,180px);font-weight:1000;color:var(--accent);filter:drop-shadow(0 0 16px var(--accent));font-variant-numeric:tabular-nums}.pachinkoDigit{display:inline-block;vertical-align:middle;white-space:pre}.pachinkoDigitImage{object-fit:contain;vertical-align:middle}.sub{font-size:clamp(18px,3vw,40px);font-weight:900}.total{font-size:clamp(24px,4vw,64px);font-weight:1000;color:#ffe36e}.pulse{animation:pulse .35s infinite alternate}@keyframes pulse{to{transform:scale(1.07);filter:brightness(1.35)}}
.roleTextOff{visibility:hidden!important}.roleCustomText,.roleCustomImage{color:transparent!important;text-shadow:none!important}.roleCustomText{font-size:0!important;line-height:1!important;overflow:visible!important}.roleCustomText::after{content:var(--role-content);position:relative;display:block;width:max-content;max-width:90vw;margin:0 auto;color:var(--role-color,#fff);font-size:var(--role-size,32px);font-family:var(--role-font,system-ui);line-height:1.15;text-align:center;text-shadow:0 3px 14px #000;white-space:pre-wrap;overflow-wrap:anywhere}.roleCustomImage{font-size:0!important;line-height:0!important;width:var(--role-image-size,120px)!important;height:var(--role-image-size,120px)!important;min-width:var(--role-image-size,120px);min-height:var(--role-image-size,120px);margin-left:auto!important;margin-right:auto!important;overflow:visible!important}.roleCustomImage::after{content:"";position:relative;display:block;width:100%;height:100%;background:var(--role-image) center/contain no-repeat}
</style></head><body><main id="stage" class="stage"><section id="card" class="card"><div id="media" class="media"></div><div id="alertMedia" class="alertMedia"></div><div class="copy"><div id="pattern" class="pattern"></div><div id="sender" class="sender"></div><div id="status" class="status"></div><div id="spin" class="spin"></div><div id="sub" class="sub"></div><div id="total" class="total"></div></div></section></main><script>
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));let lastId=0,playing=false,currentAudio=null,currentVideo=null,alertAudio=null,alertVideo=null,spinBeepAudio=null,spinBeepOscillator=null,spinBeepContext=null,playbackSpeed=1,activePattern=null;
function stopPachinkoBeep(){if(spinBeepAudio){spinBeepAudio.pause();spinBeepAudio.currentTime=0;spinBeepAudio=null}if(spinBeepOscillator){try{spinBeepOscillator.stop()}catch(e){}spinBeepOscillator=null}}
function playPachinkoBeep(p){if(!p||p.spinBeepEnabled===false)return;stopPachinkoBeep();const volume=Math.max(0,Math.min(1,(Number.isFinite(Number(p.spinBeepVolume))?Number(p.spinBeepVolume):35)/100));if(p.spinBeepAudioUrl){spinBeepAudio=new Audio(p.spinBeepAudioUrl);spinBeepAudio.volume=volume;spinBeepAudio.play().catch(()=>{});return}const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx||volume<=0)return;try{spinBeepContext=spinBeepContext||new Ctx();if(spinBeepContext.state==='suspended')spinBeepContext.resume().catch(()=>{});const osc=spinBeepContext.createOscillator(),gain=spinBeepContext.createGain(),now=spinBeepContext.currentTime;osc.type='sine';osc.frequency.setValueAtTime(880,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume*.12),now+.008);gain.gain.exponentialRampToValueAtTime(.0001,now+.085);osc.connect(gain);gain.connect(spinBeepContext.destination);spinBeepOscillator=osc;osc.start(now);osc.stop(now+.09)}catch(e){}}
function stopMedia(){stopPachinkoBeep();if(currentAudio){currentAudio.pause();currentAudio=null}if(currentVideo){currentVideo.pause();currentVideo=null}if(alertAudio){alertAudio.pause();alertAudio=null}if(alertVideo){alertVideo.pause();alertVideo=null}$('media').replaceChildren();$('alertMedia').replaceChildren();$('alertMedia').classList.remove('show')}
function showText(status='',spin='',sub='',total=''){$('status').classList.remove('preAlertMessage');delete $('status').dataset.preAlert;$('status').style.removeProperty('--pre-alert-color');$('status').style.removeProperty('--pre-alert-size');$('status').textContent=status;$('spin').textContent=spin;$('sub').textContent=sub;$('total').textContent=total;if(activePattern)applyPachinkoTextRoles()}
function setSlotDigits(number,p){const host=$('spin'),settings=p?.digitSettings||[];host.replaceChildren();for(const ch of String(number)){const d=Number(ch),cfg=settings[d]||{},span=document.createElement('span');span.className='pachinkoDigit';if(cfg.imageUrl){const img=document.createElement('img');img.className='pachinkoDigitImage';img.src=cfg.imageUrl;img.alt=cfg.text||ch;const size=Math.max(20,Math.min(1200,Number(cfg.imageSize)||130));img.style.width=size+'px';img.style.height=size+'px';span.append(img)}else{span.textContent=cfg.text??ch;span.style.color=cfg.color||'#fff';span.style.fontSize=Math.max(14,Math.min(400,Number(cfg.size)||130))+'px';span.style.fontFamily=pachinkoFontStack(cfg.fontFamily||'global')}host.append(span)}}
async function playPachinkoPreAlert(p,index){
  const a=p?.preAlerts?.[index];if(!a)return;
  const key='preAlert'+(index+1),mode=a.displayMode||'full';
  const textSeconds=Math.max(.2,Number(a.textSeconds)||1.2);
  const audioSeconds=Math.max(0,Number(a.audioSeconds)||0);
  const mediaSeconds=Number(a.mediaSeconds)>0?Math.max(.2,Number(a.mediaSeconds)):Math.max(textSeconds,audioSeconds);
  if(a.showText!==false&&mode!=='sound-only'){
    const status=$('status');status.textContent=a.text||'チャンス！';status.dataset.preAlert='1';status.classList.add('preAlertMessage');
    status.style.setProperty('--pre-alert-color',a.color||'#ffe05b');status.style.setProperty('--pre-alert-size',Math.max(14,Math.min(300,Number(a.textSize)||56))+'px');
    if(activePattern)applyPachinkoTextRoles();
  }
  if(mode==='full'&&p[key+'AnimationUrl']){
    const url=p[key+'AnimationUrl'],video=/\.(mp4|webm)(\?|$)/i.test(url),node=document.createElement(video?'video':'img');node.src=url;
    if(video){node.autoplay=true;node.playsInline=true;node.loop=true;node.volume=Math.max(0,Math.min(1,(Number.isFinite(Number(a.videoVolume))?Number(a.videoVolume):75)/100));alertVideo=node;node.play().catch(()=>{})}
    $('alertMedia').replaceChildren(node);$('alertMedia').classList.add('show');
  }
  let audioDone=Promise.resolve();
  if(p[key+'AudioUrl']){
    const audio=new Audio(p[key+'AudioUrl']);alertAudio=audio;
    audio.volume=Math.max(0,Math.min(1,(Number.isFinite(Number(a.audioVolume))?Number(a.audioVolume):75)/100));
    audioDone=new Promise(resolve=>{
      let finished=false,timer=null;
      const finish=()=>{if(finished)return;finished=true;if(timer)clearTimeout(timer);audio.removeEventListener('ended',finish);audio.removeEventListener('error',finish);resolve()};
      audio.addEventListener('ended',finish,{once:true});audio.addEventListener('error',finish,{once:true});
      if(audioSeconds>0)timer=setTimeout(()=>{audio.pause();finish()},audioSeconds*1000);
      audio.play().catch(finish);
    });
  }
  // Test-speed scaling is for the slot's spin animation only. Do not shorten
  // explicitly configured pre-alert media/audio durations during a test.
  const visibleSeconds=Math.max(textSeconds,mediaSeconds);
  await Promise.all([sleep(Math.max(100,visibleSeconds*1000)),audioDone]);
  if(alertAudio){alertAudio.pause();alertAudio=null}
  if(alertVideo){alertVideo.pause();alertVideo=null}
  $('alertMedia').replaceChildren();$('alertMedia').classList.remove('show');
}
function pachinkoRoleFor(id,text){if(id==='pattern'||id==='sender')return id;if(id==='status'){if($('status').dataset.preAlert==='1')return 'preAlertState';if(text.includes('抽選中'))return 'spinState';if(text.includes('リーチ'))return 'reachState';if(text.includes('大当たり'))return 'hitState';if(text.includes('はずれ'))return 'missState';if(text.includes('CZ'))return 'czState';if(text.includes('時短'))return 'timeShortState';if(text.includes('LUCKY'))return 'luckyTriggerState';if(text.includes('上位ST'))return 'upperState';if(text.includes('ST突入'))return 'atState';if(text.includes('継続'))return 'continueState';if(text.includes('終了'))return 'endState';return 'resultState'}if(id==='spin')return text.includes('WIN')?'resultWin':($('status').textContent.includes('抽選中')?'spinNumber':'resultNumber');if(id==='sub')return text.startsWith('合計')?'total':text.includes('WIN')?'resultWin':text.includes('SET')?'setCount':'progress';if(id==='total')return 'total';return ''}
function pachinkoRoleTemplate(template,raw){const match=String(raw).match(/[+\-]?\d+(?:\.\d+)?/),value=match?match[0]:'';return String(template||'').replace(/\{text\}/g,raw).replace(/\{value\}/g,value).replace(/\{set\}/g,value).replace(/\{name\}/g,raw)}
function pachinkoFontStack(key){return ({global:'system-ui,"Yu Gothic",Meiryo,sans-serif',system:'system-ui,"Yu Gothic",Meiryo,sans-serif',native:'system-ui,"Yu Gothic",Meiryo,sans-serif',yuGothic:'"Yu Gothic","游ゴシック",sans-serif',meiryo:'Meiryo,"メイリオ",sans-serif',gothic:'"Arial Black",Impact,sans-serif',serif:'"Yu Mincho","游明朝",serif',mono:'ui-monospace,Consolas,monospace'})[key]||'system-ui,"Yu Gothic",Meiryo,sans-serif'}
function pachinkoRoleKey(property){return 'role'+property.replace(/-/g,'')}
function clearPachinkoRoleStyles(el){for(const property of ['color','font-size','font-family','position','left','right','top','bottom','translate','margin','z-index','width','max-width','white-space']){const key=pachinkoRoleKey(property);if(el.dataset[key]==='1'){el.style.removeProperty(property);delete el.dataset[key]}}}
function setPachinkoRoleStyle(el,property,value,priority=''){el.style.setProperty(property,value,priority);el.dataset[pachinkoRoleKey(property)]='1'}
function applyPachinkoTextRoles(){const roles=activePattern?.textRoles||{};for(const id of ['pattern','sender','status','spin','sub','total']){const el=$(id),raw=String(el.textContent||''),x=roles[pachinkoRoleFor(id,raw)]||{},customImage=x.mode==='image'&&x.imageUrl,customText=!customImage&&!!x.text,fontFamily=x.fontFamily||'global';clearPachinkoRoleStyles(el);el.classList.remove('roleTextOff','roleCustomText','roleCustomImage');for(const property of ['--role-content','--role-image','--role-image-size','--role-color','--role-size','--role-font'])el.style.removeProperty(property);const baseColor=getComputedStyle(el).color,baseSize=getComputedStyle(el).fontSize;if(x.enabled===false){el.classList.add('roleTextOff');continue}if(x.positionEnabled){setPachinkoRoleStyle(el,'position','absolute','important');setPachinkoRoleStyle(el,'left',Math.max(0,Math.min(100,Number.isFinite(+x.x)?+x.x:50))+'%','important');setPachinkoRoleStyle(el,'right','auto','important');setPachinkoRoleStyle(el,'top',Math.max(0,Math.min(100,Number.isFinite(+x.y)?+x.y:50))+'%','important');setPachinkoRoleStyle(el,'bottom','auto','important');setPachinkoRoleStyle(el,'translate','-50% -50%','important');setPachinkoRoleStyle(el,'margin','0','important');setPachinkoRoleStyle(el,'z-index','20','important');setPachinkoRoleStyle(el,'width','max-content','important');setPachinkoRoleStyle(el,'max-width','94%','important');setPachinkoRoleStyle(el,'white-space','normal','important')}if(customImage){el.classList.add('roleCustomImage');el.style.setProperty('--role-image',`url("${String(x.imageUrl).replace(/"/g,'%22')}")`);el.style.setProperty('--role-image-size',Math.max(20,Math.min(600,+x.imageSize||120))+'px')}else if(customText){el.classList.add('roleCustomText');el.style.setProperty('--role-content',JSON.stringify(pachinkoRoleTemplate(x.text,raw)));el.style.setProperty('--role-color',x.colorEnabled&&x.color?x.color:baseColor);el.style.setProperty('--role-size',(+x.size>0?+x.size+'px':baseSize));el.style.setProperty('--role-font',pachinkoFontStack(fontFamily))}else{if(x.colorEnabled&&x.color)setPachinkoRoleStyle(el,'color',x.color,'important');if(+x.size>0)setPachinkoRoleStyle(el,'font-size',(+x.size)+'px');if(fontFamily!=='global')setPachinkoRoleStyle(el,'font-family',pachinkoFontStack(fontFamily),'important')}}}
function startStageMedia(p,key){stopMedia();const url=p[key+'AnimationUrl']||'',audioUrl=p[key+'AudioUrl']||'';if(url){const video=/\.(mp4|webm)(\?|$)/i.test(url),node=document.createElement(video?'video':'img');node.src=url;if(video){node.autoplay=true;node.playsInline=true;node.loop=true;node.volume=Math.max(0,Math.min(1,(Number(p[key+'AudioVolume'])||75)/100));currentVideo=node;node.play().catch(()=>{})}$('media').append(node)}if(audioUrl){currentAudio=new Audio(audioUrl);currentAudio.volume=Math.max(0,Math.min(1,(Number(p[key+'AudioVolume'])||75)/100));currentAudio.play().catch(()=>{})}}
async function playStage(p,key,text,detail='',fallback=1){startStageMedia(p,key);showText(text,'',detail,'');const seconds=Math.max(.2,Math.min(120,Number(p[key+'Seconds'])||fallback));await sleep(Math.max(100,seconds*1000*playbackSpeed));stopMedia()}
// Visual reels follow the server result; they never perform a second lottery.
function pachinkoSlotNumber(hit=false){
  const digits=String(Math.floor(Math.random()*1000)).padStart(3,'0').split('');
  if(hit)return digits[0].repeat(3);
  if(digits[0]===digits[1]&&digits[1]===digits[2])digits[2]=String((Number(digits[2])+1)%10);
  return digits.join('');
}
async function animateSpins(p,event){activePattern=p;const target=event.hitSpin||event.spins,total=Math.max(1,event.spins),visualLimit=event.isTest&&playbackSpeed<1?15:60,visual=Math.min(target,visualLimit),duration=Math.max(.05,Number(p.spinSeconds)||.8);startStageMedia(p,'spin');let alerted=false;for(let i=1;i<=visual;i++){if(!alerted&&event.preAlertIndex>=0&&event.preAlertTiming==='during-spin'&&i>=Math.max(1,Math.ceil(visual/2))){alerted=true;await playPachinkoPreAlert(p,event.preAlertIndex)}playPachinkoBeep(p);const shown=target>visual?Math.round(i/visual*target):i;showText('抽選中','',`${shown} / ${total} 回転`,'');setSlotDigits(pachinkoSlotNumber(false),p);await sleep(Math.max(25,duration*1000*playbackSpeed))}if(!alerted&&event.preAlertIndex>=0&&event.preAlertTiming==='before-result')await playPachinkoPreAlert(p,event.preAlertIndex);showText(event.hitSpin?'大当たり！':'はずれ','',event.hitSpin?`${event.hitSpin}回転目`:`${total}回転`,'');setSlotDigits(pachinkoSlotNumber(!!event.hitSpin),p);await sleep(Math.max(150,500*playbackSpeed));stopMedia()}
async function animatePhaseSpins(p,round,phase){const count=Math.max(1,Number(round.spins)||1),target=Math.max(0,Number(round.hitSpin)||0),visualLimit=60,visual=Math.min(count,visualLimit),modeName=phase==='upper'?'上位ST':phase==='lt'?'LT':phase==='timeShort'?'時短':'ST',duration=Math.max(.05,Number(p[phase==='upper'?'upperSpinSeconds':phase==='lt'?'luckyTriggerSpinSeconds':phase==='timeShort'?'timeShortSpinSeconds':'atSpinSeconds'])||.8),mediaKey=phase==='upper'?'upper':phase==='lt'?'lt':'spin';startStageMedia(p,mediaKey);for(let i=1;i<=visual;i++){playPachinkoBeep(p);const shown=count>visual?Math.round(i/visual*count):i;showText(`${modeName}抽選中`,'',`${shown} / ${count} 回転`,'');setSlotDigits(pachinkoSlotNumber(false),p);await sleep(Math.max(25,duration*1000*playbackSpeed))}showText(target?`${modeName}大当たり！`:`${modeName}終了`,'',target?`${target}回転目`:`${count}回転`,'');setSlotDigits(pachinkoSlotNumber(!!target),p);await sleep(Math.max(150,500*playbackSpeed));stopMedia()}
async function playEvent(state,event){playing=true;const p=(state.pachinkoGacha?.patterns||[]).find(x=>x.id===event.patternId)||{};activePattern=p;playbackSpeed=event.isTest&&[1,.5,.2].includes(Number(p.testPlaybackSpeed))?Number(p.testPlaybackSpeed):1;document.documentElement.style.setProperty('--accent',p.accentColor||'#ff3d66');document.documentElement.style.setProperty('--bg',p.cardBg||'#120b18');document.documentElement.style.setProperty('--text',p.textColor||'#fff');document.documentElement.style.setProperty('--font-size',Math.max(18,Math.min(300,+p.fontSize||64))+'px');$('card').classList.toggle('fullscreen',p.effectStyle==='fullscreen');$('pattern').textContent=event.patternName||p.name||'パチンコガチャ';$('sender').textContent=event.senderName||'';$('stage').classList.add('show');try{if(event.preAlertIndex>=0&&event.preAlertTiming==='spin-start')await playPachinkoPreAlert(p,event.preAlertIndex);await animateSpins(p,event);if(!event.hitSpin){await playStage(p,'end','終了','はずれ',2)}else{if(p.reachEnabled!==false)await playStage(p,'reach','リーチ！',`${event.hitSpin}回転目`,1);if(event.route.startsWith('cz'))await playStage(p,'cz',event.route==='cz-success'?'CZ成功！':'CZ失敗',event.route==='cz-success'?'ST抽選へ':'終了',2);if(event.route!=='cz-fail')await playStage(p,'hit','大当たり！',`+${Math.max(0,event.total||p.baseWin||0)} WIN`,2);if(event.route.startsWith('time-short')){await playStage(p,'spin','時短突入',(event.timeShortSpins||p.timeShortSpins||0)+'回転',1);if((event.timeShortSpins||p.timeShortSpins||0)>0)await animatePhaseSpins(p,{spins:event.timeShortSpins||p.timeShortSpins,hitSpin:event.timeShortHitSpin||0},'timeShort');if(event.timeShortHitSpin){showText('時短引き戻し！','+'+(p.baseWin||0)+' WIN','','');await sleep(Math.max(150,500*playbackSpeed))}}let phase='';for(const [i,r] of (event.rounds||[]).entries()){if(r.phase!==phase){phase=r.phase;await playStage(p,phase==='lt'?'lt':phase==='upper'?'upper':'at',phase==='lt'?'LUCKY TRIGGER':phase==='upper'?'上位ST突入':'ST突入',(i+1)+' SET',1)}await animatePhaseSpins(p,r,phase);const roundSeconds=Math.max(.2,Number(p[(phase==='lt'?'lt':phase==='upper'?'upper':'at')+'Seconds'])||2);showText(r.hitSpin?(r.continued?'継続！':'終了'):'終了',r.win?'+'+r.win+' WIN':'—',(i+1)+' SET','合計 +'+r.total+' WIN');$('spin').classList.add('pulse');await sleep(Math.max(150,roundSeconds*1000*playbackSpeed));$('spin').classList.remove('pulse')}await playStage(p,'end','終了',`合計 +${event.total||0} WIN`,3)}await fetch('/api/pachinko/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventId:event.id})})}catch(e){try{await fetch('/api/pachinko/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventId:event.id})})}catch(_){}}finally{stopMedia();$('stage').classList.remove('show');activePattern=null;showText();playing=false;playbackSpeed=1}}
async function poll(){if(playing)return;try{const s=await(await fetch('/api/state',{cache:'no-store'})).json(),e=s.pachinkoGacha?.event;if(e?.active&&e.id&&e.id!==lastId){lastId=e.id;playEvent(s,e)}}catch(e){}}
poll();setInterval(poll,300);setInterval(applyPachinkoTextRoles,100);
</script></body></html>
