function pachinkoRoleFor(id,text){if(id==='pattern'||id==='sender')return id;if(id==='status'){if($('status').dataset.preAlert==='1')return 'preAlertState';if(text.includes('抽選中'))return 'spinState';if(text.includes('リーチ'))return 'reachState';if(text.includes('大当たり'))return 'hitState';if(text.includes('はずれ・終了'))return 'endMissState';if(text.includes('はずれ・継続'))return 'continueMissState';if(text.includes('はずれ'))return 'missState';if(text.includes('CZ'))return 'czState';if(text.includes('時短'))return 'timeShortState';if(text.includes('LUCKY'))return 'luckyTriggerState';if(text.includes('上位ST'))return 'upperState';if(text.includes('ST突入'))return 'atState';if(text.includes('継続'))return 'continueState';if(text.includes('終了'))return 'endState';return 'resultState'}if(id==='spin')return text.includes('WIN')?'resultWin':($('status').textContent.includes('抽選中')?'spinNumber':'resultNumber');if(id==='sub')return text.startsWith('合計')?'total':text.includes('WIN')?'resultWin':text.includes('SET')?'setCount':'progress';if(id==='total')return 'total';return ''}

// Visual reels follow the server result; they never perform a second lottery.
function pachinkoSymbols(p=activePattern){
  const digits=Array.from({length:10},(_,n)=>String(n)).filter(d=>p?.digitSettings?.[Number(d)]?.enabled!==false);
  // Keep misses distinct even for malformed/old settings with too few symbols.
  for(let n=0;digits.length<2&&n<10;n++)if(!digits.includes(String(n)))digits.push(String(n));
  return digits;
}
function pickPachinkoSymbol(p=activePattern,except=null){const digits=pachinkoSymbols(p).filter(d=>d!==except);return digits[Math.floor(Math.random()*digits.length)]}
function pachinkoSlotNumber(hit=false,p=activePattern){
  const digits=Array.from({length:3},()=>pickPachinkoSymbol(p));
  if(hit)return digits[0].repeat(3);
  if(digits[0]===digits[1]&&digits[1]===digits[2])digits[2]=pickPachinkoSymbol(p,digits[0]);
  return digits.join('');
}
function pachinkoRollingNumber(p=activePattern){
  const left=pickPachinkoSymbol(p),right=pickPachinkoSymbol(p,left);
  return left+pickPachinkoSymbol(p)+right;
}
function startPachinkoReachMedia(p,fallbackKey=null){
  startStageMedia(p,'reach',{keepMissing:!fallbackKey,fallbackKey});
}
async function animatePachinkoTurn(p,{hit,seconds,label,progress,mediaKey,displaySeconds,beforeResult}){
  startStageMedia(p,mediaKey);
  // Stage music keeps playing; the optional reel track is independent.
  playPachinkoBeep(p);
  const totalMs=Math.max(1,seconds*1000*playbackSpeed),steps=Math.max(1,Math.min(8,Math.floor(totalMs/15))),tick=totalMs/steps;
  for(let j=0;j<steps;j++){
    showText(label+'抽選中','',progress,'');setSlotDigits(pachinkoRollingNumber(p),p);await sleep(tick);
  }
  const reach=p.reachEnabled!==false&&(hit||Math.random()*100<Number(p.reachMissChance??15));
  let reachExitPlayed=false;
  let final=pachinkoSlotNumber(hit,p);
  if(reach){
    const entered=await playPachinkoBoundary(p,'reach','Enter',progress);
    startPachinkoReachMedia(p,entered?mediaKey:null);playPachinkoBeep(p);
    const side=pickPachinkoSymbol(p);
    final=side+(hit?side:pickPachinkoSymbol(p,side))+side;
    // Side reels stop first. Only the centre reel continues, before the result.
    const reachSeconds=Math.max(.2,Math.min(120,Number(p.reachSeconds)||3));
    const ticks=Math.max(2,Math.ceil(reachSeconds*10));
    for(let j=0;j<ticks;j++){
      const middle=pickPachinkoSymbol(p,side);
      showText('リーチ！','',progress,'');setSlotDigits(side+middle+side,p);
      await sleep(Math.max(15,reachSeconds*1000*playbackSpeed/ticks));
    }
    reachExitPlayed=await playPachinkoBoundary(p,'reach','Exit',progress);
  }
  // Stop the rotation track, play a result-adjacent pre-alert when configured, then reveal the settled reels.
  stopPachinkoBeep();if(beforeResult)await beforeResult();startStageMedia(p,'stop',{keepMissing:!reachExitPlayed,fallbackKey:reachExitPlayed?mediaKey:null});
  showText(hit?label+'大当たり！':label+'はずれ','',progress,'');setSlotDigits(final,p);
  const hold=Math.max(.2,Math.min(120,Number(displaySeconds??p.stopSeconds??1)));
  await sleep(hold*1000*playbackSpeed);
  if(currentAudioStage==='stop')stopPachinkoStageAudio();
}
async function animateSpins(p,event){
  activePattern=p;const target=event.hitSpin||event.spins,total=Math.max(1,event.spins);
  const visual=Math.min(target,event.isTest&&playbackSpeed<1?15:60),duration=Math.max(.05,Number(p.spinSeconds)||.8);
  let alerted=false;
  for(let i=1;i<=visual;i++){
    const shown=target>visual?Math.round(i/visual*target):i;
    if(!alerted&&event.preAlertIndex>=0&&event.preAlertTiming==='during-spin'&&i>=Math.max(1,Math.ceil(visual/2))){
      alerted=true;await playPachinkoPreAlert(p,event.preAlertIndex,event.isTest?event.preAlertAudioVolume:null);
    }
    let beforeResult=null;
    if(!alerted&&event.preAlertIndex>=0&&event.preAlertTiming==='before-result'&&i===visual){
      alerted=true;beforeResult=()=>playPachinkoPreAlert(p,event.preAlertIndex,event.isTest?event.preAlertAudioVolume:null);
    }
    await animatePachinkoTurn(p,{hit:!!event.hitSpin&&i===visual,seconds:duration,label:'',progress:`${shown} / ${total} 回転`,mediaKey:'spin',displaySeconds:p.spinDisplaySeconds??p.stopSeconds,beforeResult});
  }
}
function pachinkoRoundStatus(round){if(round.mode==='continue'&&round.resultKind==='continue-miss')return 'はずれ・継続！';if(round.mode==='continue'&&round.resultKind==='end-miss')return 'はずれ・終了';return round.hitSpin?(round.continued?'継続！':'終了'):'終了'}
function pachinkoRoundWinText(round,event={}){return round.hitSpin?pachinkoWinText(round.win,event):''}
async function animatePhaseSpins(p,round,phase){
  const count=Math.max(1,Number(round.spins)||1),target=Math.max(0,Number(round.hitSpin)||0),end=target||count,visual=Math.min(end,60);
  const label=phase==='upper'?'上位ST':phase==='lt'?'LT':phase==='timeShort'?'時短':'ST';
  const duration=Math.max(.05,Number(p[phase==='upper'?'upperSpinSeconds':phase==='lt'?'luckyTriggerSpinSeconds':phase==='timeShort'?'timeShortSpinSeconds':'atSpinSeconds'])||.8);
  const baseKey=phase==='upper'?'upper':phase==='lt'?'lt':phase==='timeShort'?'spin':'at';
  const phaseKey=phase==='timeShort'?'timeShort':baseKey+'Spin';
  const resolved={...p,__mediaFallbacks:{}};for(const kind of ['Animation','Audio'])if(!resolved[phaseKey+kind+'Url']){resolved.__mediaFallbacks[phaseKey+kind]=baseKey;resolved[phaseKey+kind+'Url']=p[baseKey+kind+'Url']||'';for(const suffix of ['Volume','Loop'])resolved[phaseKey+kind+suffix]=p[baseKey+kind+suffix]}
  const mediaKey=phaseKey;
  for(let i=1;i<=visual;i++){
    const shown=end>visual?Math.round(i/visual*end):i;
    await animatePachinkoTurn(resolved,{hit:!!target&&i===visual,seconds:duration,label,progress:round.mode==='continue'?'継続式':`${shown} / ${count} 回転`,mediaKey,displaySeconds:phase==='timeShort'?p.timeShortDisplaySeconds:undefined});
  }
}
function pachinkoRgbaTextBg(hex,opacity){const m=/^#([0-9a-f]{6})$/i.exec(hex||'');return m?`rgba(${parseInt(m[1].slice(0,2),16)},${parseInt(m[1].slice(2,4),16)},${parseInt(m[1].slice(4,6),16)},${opacity})`:'transparent'}
function applyPachinkoTextFx(snapshot,event,pattern){
 const custom=(snapshot?.textEffects||{})['pachinko:'+String(event?.patternId||pattern?.id||'')]||{};
 const fx=custom.mode==='custom'?custom:{outlineEnabled:snapshot?.textOutlineEnabled,outlineColor:snapshot?.textOutlineColor,outlineWidth:snapshot?.textOutlineWidth,backgroundEnabled:snapshot?.textBackgroundEnabled,backgroundColor:snapshot?.textBackgroundColor,backgroundOpacity:snapshot?.textBackgroundOpacity};
 document.documentElement.style.setProperty('--pachinko-outline-width',fx.outlineEnabled?Math.max(0,Math.min(10,Number(fx.outlineWidth)||0))+'px':'0');
 document.documentElement.style.setProperty('--pachinko-outline-color',fx.outlineColor||'#000');
 document.documentElement.style.setProperty('--pachinko-text-bg',fx.backgroundEnabled?pachinkoRgbaTextBg(fx.backgroundColor||'#000',Math.max(0,Math.min(100,Number(fx.backgroundOpacity)||0))/100):'transparent');
 document.documentElement.style.setProperty('--pachinko-text-bg-pad',fx.backgroundEnabled?'2px 7px':'0')
}
async function playEvent(state,event){
 const generation=playbackGeneration;playingEventId=event.id;playing=true;
 const p=(state.pachinkoGacha?.patterns||[]).find(x=>x.id===event.patternId)||{};
 activePattern=p;applyPachinkoTextFx(state,event,p);playbackSpeed=event.isTest&&[1,.5,.2].includes(Number(p.testPlaybackSpeed))?Number(p.testPlaybackSpeed):1;
 document.documentElement.style.setProperty('--accent',p.accentColor||'#ff3d66');
 document.documentElement.style.setProperty('--bg',p.cardBg||'#120b18');
 document.documentElement.style.setProperty('--text',p.textColor||'#fff');
 document.documentElement.style.setProperty('--font-size',Math.max(18,Math.min(300,+p.fontSize||64))+'px');
 $('card').classList.toggle('fullscreen',p.effectStyle==='fullscreen');
 $('pattern').textContent=event.patternName||p.name||'パチンコガチャ';$('sender').textContent=event.senderName||'';$('stage').classList.add('show');
 try{
  if(event.preAlertIndex>=0&&event.preAlertTiming==='spin-start')await playPachinkoPreAlert(p,event.preAlertIndex,event.isTest?event.preAlertAudioVolume:null);
  await animateSpins(p,event);
  if(!event.hitSpin){await playPachinkoEnd(p,event,'はずれ')}
  else{
   const czUsed=event.czUsed??(event.route.startsWith('cz')||Boolean(p.czEnabled&&event.hitSpin));
   const czSuccess=event.czSuccess??event.route!=='cz-fail';
   if(czUsed){
    await playPachinkoBoundary(p,'cz','Enter');
    await playStage(p,'cz',czSuccess?'CZ成功！':'CZ失敗',czSuccess?'ST抽選へ':'終了',2);
    await playPachinkoBoundary(p,'cz','Exit');
   }
   if(event.route!=='cz-fail'){
    const winText=pachinkoWinText(Math.max(0,event.initialWin??p.baseWin??0),event);
    await playPachinkoBoundary(p,'hit','Enter',winText);
    await playStage(p,'hit','大当たり！',winText,2);
    await playPachinkoBoundary(p,'hit','Exit',winText);
   }
   if(event.route.startsWith('time-short')){
    await playStage(p,'spin','時短突入',(event.timeShortSpins||p.timeShortSpins||0)+'回転',1);
    if((event.timeShortSpins||p.timeShortSpins||0)>0)await animatePhaseSpins(p,{spins:event.timeShortSpins||p.timeShortSpins,hitSpin:event.timeShortHitSpin||0},'timeShort');
    if(event.timeShortHitSpin){startPachinkoResult(p,'timeShortHit',true,'spin');showText('時短引き戻し！',pachinkoWinText(event.timeShortWin??p.baseWin??0,event),'','');await sleep(Math.max(.2,Number(p.timeShortHitSeconds)||.5)*1000*playbackSpeed)}else if(event.timeShortSpins){startPachinkoResult(p,'timeShortMiss',false,'spin');showText('時短終了');await sleep(Math.max(.2,Number(p.timeShortMissSeconds)||.5)*1000*playbackSpeed)}
   }
   let phase='';const rounds=event.rounds||[];
   for(const [i,r] of rounds.entries()){
    const mediaKey=r.phase==='lt'?'lt':r.phase==='upper'?'upper':'at';
    if(r.phase!==phase){
     phase=r.phase;
     await playPachinkoBoundary(p,mediaKey,'Enter',(i+1)+' SET');
     await playStage(p,mediaKey,phase==='lt'?'LUCKY TRIGGER':phase==='upper'?'上位ST突入':'ST突入',(i+1)+' SET',1);
    }
    await animatePhaseSpins(p,r,phase);
    const roundSeconds=Math.max(.2,Number(p[(phase==='lt'?'luckyTrigger':phase==='upper'?'upper':'at')+'ResultSeconds']??p[mediaKey+'Seconds'])||2);
    const winning=Math.abs(Number(r.win)||0)>0;
    const resultKey=mediaKey+(winning?'Hit':r.resultKind==='continue-miss'?'ContinueMiss':r.resultKind==='end-miss'?'EndMiss':'Miss');
    startPachinkoResult(p,resultKey,winning,mediaKey);
    showText(pachinkoRoundStatus(r),pachinkoRoundWinText(r,event),(i+1)+' SET',pachinkoTotalText(r.total,event));
    $('spin').classList.add('pulse');await sleep(roundSeconds*1000*playbackSpeed);$('spin').classList.remove('pulse');
    if(i===rounds.length-1||rounds[i+1].phase!==phase)await playPachinkoBoundary(p,mediaKey,'Exit',pachinkoTotalText(r.total,event));
   }
   await playPachinkoEnd(p,event);
  }
  if(!event.preview&&generation===playbackGeneration)await pachinkoRequest('/api/pachinko/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventId:event.id})});
 }catch(error){
  try{if(!event.preview&&generation===playbackGeneration)await pachinkoRequest('/api/pachinko/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventId:event.id})})}catch(ignore){}
 }finally{
  if(generation===playbackGeneration){stopMedia();$('stage').classList.remove('show');activePattern=null;showText();playing=false;playingEventId=0;playbackSpeed=1}
 }
}
async function poll(){if(previewMode||pollInFlight)return;pollInFlight=true;try{const s=await pachinkoRequest('/api/overlay/pachinko'),e=s.pachinkoGacha?.event;livePachinkoEvent=e;if(playing){if(!e?.active||Number(e.id)!==Number(playingEventId))cancelPachinkoPlayback();else{const pattern=s.pachinkoGacha.patterns.find(p=>p.id===activePattern?.id);if(pattern)applyPachinkoLiveVolumes(pattern);return}}if(e?.active&&e.id&&e.id!==lastId){lastId=e.id;playEvent(s,e)}}catch(e){}finally{pollInFlight=false}}
async function showPachinkoPreview(data){
 cancelPachinkoPlayback();const generation=playbackGeneration,p=data.pattern||{};
 if(data.action==='stop')return;
 if(data.scene==='flow'){await playEvent({pachinkoGacha:{patterns:[p]}},{...(data.event||{}),patternId:p.id,preview:true});return}
 activePattern=p;playing=true;playbackSpeed=1;$('stage').classList.add('show');$('pattern').textContent=p.name||'パチンコガチャ';$('sender').textContent='プレビュー';$('card').classList.toggle('fullscreen',p.effectStyle==='fullscreen');document.documentElement.style.setProperty('--accent',p.accentColor||'#ff3d66');document.documentElement.style.setProperty('--bg',p.cardBg||'#120b18');document.documentElement.style.setProperty('--text',p.textColor||'#fff');document.documentElement.style.setProperty('--font-size',(p.fontSize||64)+'px');
 try{const boundary=/^(reach|cz|hit|at|upper|lt)(Enter|Exit)$/.exec(data.scene||'');if(boundary){await playPachinkoBoundary(p,boundary[1],boundary[2],'+10 WIN',true)}else if(/^preAlert[123]$/.test(data.scene)){showText('先バレプレビュー');await playPachinkoPreAlert(p,Number(data.scene.slice(-1))-1)}else if(['spin','timeShort','at-spin','upper-spin','lt-spin'].includes(data.scene)){const phase={'spin':'normal','timeShort':'timeShort','at-spin':'at','upper-spin':'upper','lt-spin':'luckyTrigger'}[data.scene],labels={normal:'通常',timeShort:'時短',at:'ST',upper:'上位ST',luckyTrigger:'LT'};await animatePachinkoTurn(p,{hit:true,seconds:Number(p[phase==='normal'?'spinSeconds':phase+'SpinSeconds'])||.8,label:labels[phase],progress:'プレビュー',mediaKey:phase==='upper'?'upper':phase==='luckyTrigger'?'lt':'spin',displaySeconds:p.spinDisplaySeconds??3})}else{const labels={reach:'リーチ！',hit:'大当たり！',cz:'CZ成功！',at:'ST突入',upper:'上位ST突入',lt:'LUCKY TRIGGER',end:'終了',stop:'停止結果'};if(pachinkoExtraStages.includes(data.scene))labels[data.scene]='専用演出プレビュー';if(labels[data.scene])await playStage(p,data.scene,labels[data.scene],'+10 WIN',3)}}finally{if(generation===playbackGeneration){stopMedia();playing=false;activePreAlertIndex=-1}}
}
window.addEventListener('message',event=>{if(!previewMode||event.origin!==location.origin||event.source!==window.parent)return;const data=event.data||{};if(data.type==='pachinko-preview-choice'&&data.generation===playbackGeneration&&previewChoiceResolver)previewChoiceResolver(data.choice);if(data.type==='pachinko-preview')showPachinkoPreview(data).catch(error=>{if(error.name!=='AbortError')console.error('Pachinko preview',error)});if(data.type==='pachinko-preview-update'&&data.pattern)applyPachinkoLiveVolumes(data.pattern)});
if(!previewMode){poll();setInterval(poll,500)}setInterval(()=>{if(playing&&activePattern)applyPachinkoTextRoles()},500);
</script></body></html>
