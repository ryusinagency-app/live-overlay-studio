<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WINガチャランキング</title>
<style>
:root{color-scheme:dark;--text:#fff;--panel:rgba(23,24,30,.93);--border:#ffcf59;--font:system-ui,sans-serif;--continue-size:28px;--win-size:28px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--text);font-family:var(--font)}
.wrap{width:100%;height:100%;padding:12px;display:flex;flex-direction:column;gap:10px}.title{margin:0;font-size:24px;font-weight:950;text-shadow:0 2px 8px #000}.boards{display:flex;flex:1;min-height:0;gap:12px}.boards.vertical{flex-direction:column}.boards.horizontal{flex-direction:row}.board{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0;flex:1;padding:10px;border:2px solid var(--border);border-radius:14px;background:var(--panel);box-shadow:0 0 18px #0005}.board[hidden]{display:none}.boardTitle{margin:0;font-size:18px;font-weight:900}.list{display:flex;flex:1;min-height:0;gap:7px;padding:2px;overflow:auto}.list.vertical{flex-direction:column}.list.horizontal{flex-direction:row;align-items:stretch}.item{flex:0 0 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;min-height:56px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#ffffff0a;font-size:var(--row-size,28px);text-shadow:0 1px 3px #000}.list.vertical .item{width:100%}.list.horizontal .item{width:min(340px,75vw);grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto}.rank{grid-row:1/3;min-width:2.1em;text-align:center;color:#ffe18a;font-weight:1000}.name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:900}.score{grid-column:3;grid-row:1/3;white-space:nowrap;font-weight:1000}.list.horizontal .score{grid-column:2;grid-row:2;text-align:right}.empty{margin:auto;padding:14px 18px;font-size:18px;font-weight:800}.list::-webkit-scrollbar{width:9px;height:9px}.list::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}.list::-webkit-scrollbar-track{background:#0004;border-radius:9px}
</style></head><body><main class="wrap"><h1 class="title" id="title">WINガチャランキング</h1><div class="boards vertical" id="boards"><section class="board" id="continueBoard"><h2 class="boardTitle">SETランキング</h2><div class="list vertical" id="continueList"></div></section><section class="board" id="winBoard"><h2 class="boardTitle">最高WIN数ランキング</h2><div class="list vertical" id="winList"></div></section></div></main>
<script>
const $=id=>document.getElementById(id),mode=new URLSearchParams(location.search).get('sort')||'continue';
function fontStack(value){return({system:'system-ui,"Yu Gothic",Meiryo,sans-serif',yuGothic:'"Yu Gothic",sans-serif',meiryo:'Meiryo,sans-serif',gothic:'"Arial Black",Meiryo,sans-serif',serif:'"Yu Mincho",serif',mono:'ui-monospace,Consolas,monospace'})[value]||'system-ui,"Yu Gothic",sans-serif'}
function recordsFor(history,kind){const people=new Map();for(const h of history||[]){const name=String(h.senderName||'ゲスト').trim()||'ゲスト';const person=people.get(name)||{name,continueCount:0,bestWin:0};person.continueCount=Math.max(person.continueCount,Number(h.continueCount)||0);person.bestWin=Math.max(person.bestWin,Number(h.result)||0);people.set(name,person)}return [...people.values()].sort((a,b)=>kind==='continue'?(b.continueCount-a.continueCount||b.bestWin-a.bestWin):(b.bestWin-a.bestWin||b.continueCount-a.continueCount))}
function renderList(id,history,kind,limit,size,direction){const host=$(id);host.className='list '+direction;host.style.setProperty('--row-size',size+'px');const rows=recordsFor(history,kind).slice(0,limit);host.replaceChildren();if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='履歴はまだありません';host.appendChild(empty);return}rows.forEach((person,index)=>{const row=document.createElement('article');row.className='item';const rank=document.createElement('span');rank.className='rank';rank.textContent=(index+1)+'位';const name=document.createElement('span');name.className='name';name.textContent=person.name;const score=document.createElement('span');score.className='score';score.textContent=kind==='continue'?person.continueCount+'SET':(person.bestWin>0?'+':'')+person.bestWin+' WIN';row.append(rank,name,score);host.appendChild(row)})}
function setBg(g){const hex=/^#([0-9a-f]{6})$/i.exec(g.historyCardBg||'#17181e'),rgb=hex?[parseInt(hex[1].slice(1,3),16),parseInt(hex[1].slice(3,5),16),parseInt(hex[1].slice(5,7),16)].join(','):'23,24,30',alpha=Math.max(0,Math.min(100,Number(g.historyCardOpacity??93)))/100;document.documentElement.style.setProperty('--panel',`rgba(${rgb},${alpha})`);document.documentElement.style.setProperty('--text',g.historyTextColor||'#fff');document.documentElement.style.setProperty('--border',g.historyCardBorder||'#ffcf59')}
async function update(){try{const response=await fetch('/api/state?ts='+Date.now(),{cache:'no-store'});if(!response.ok)return;const state=await response.json(),g=state.gacha||{},history=Array.isArray(g.history)?g.history:[];setBg(g);document.documentElement.style.setProperty('--font',fontStack(g.historyFontFamily==='global'?(state.fontFamily||'system'):g.historyFontFamily));$('boards').className='boards '+(g.rankingLayoutDirection==='horizontal'?'horizontal':'vertical');$('continueBoard').hidden=mode==='win';$('winBoard').hidden=mode==='continue';$('title').textContent=mode==='both'?'WINガチャランキング':mode==='win'?'最高WIN数ランキング':'SETランキング';renderList('continueList',history,'continue',Math.max(1,Math.min(10,Number(g.continueRankLimit)||10)),Math.max(14,Math.min(96,Number(g.continueRankTextSize)||28)),g.continueRankScrollDirection==='horizontal'?'horizontal':'vertical');renderList('winList',history,'win',Math.max(1,Math.min(10,Number(g.winRankLimit)||10)),Math.max(14,Math.min(96,Number(g.winRankTextSize)||28)),g.winRankScrollDirection==='horizontal'?'horizontal':'vertical')}catch(e){}}
update();setInterval(update,1500);
</script></body></html>
