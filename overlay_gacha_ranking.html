<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WINガチャランキング</title>
<style>
:root{color-scheme:dark;--text:#fff;--panel:rgba(23,24,30,.93);--border:#ffcf59;--scale:1;--font:system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--text);font-family:var(--font)}
.wrap{width:100%;height:100%;padding:12px;display:flex;flex-direction:column;gap:10px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:calc(28px * var(--scale));font-weight:900;text-shadow:0 2px 8px #000}.tabs{display:flex;gap:7px}.tabs a{color:#fff;text-decoration:none;background:rgba(20,20,25,.9);border:2px solid var(--border);border-radius:10px;padding:7px 12px;font-size:calc(16px * var(--scale));font-weight:800}.tabs a.active{background:var(--border);color:#17151c}.list{display:flex;gap:8px;min-height:0;flex:1;overflow:auto;padding:2px}.list.vertical{flex-direction:column}.list.horizontal{flex-direction:row;align-items:stretch}.item{position:relative;flex:0 0 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:5px 12px;align-items:center;padding:10px 14px;border:2px solid var(--border);border-radius:12px;background:var(--panel);font-size:calc(18px * var(--scale));text-shadow:0 1px 3px #000;min-height:74px}.vertical .item{width:100%}.horizontal .item{width:min(360px,75vw);grid-template-columns:auto 1fr;grid-template-rows:auto auto}.rank{grid-row:1/3;font-size:calc(30px * var(--scale));font-weight:1000;color:#ffe18a;min-width:2.1em;text-align:center}.who{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.details{font-size:calc(13px * var(--scale));opacity:.86;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{grid-column:3;grid-row:1/3;font-size:calc(24px * var(--scale));font-weight:1000;white-space:nowrap}.horizontal .score{grid-column:2;grid-row:3;text-align:right}.score.negative{color:#ff697d}.empty{margin:auto;padding:18px 24px;border-radius:12px;background:var(--panel);font-size:calc(20px * var(--scale));font-weight:800}.list::-webkit-scrollbar{width:10px;height:10px}.list::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}.list::-webkit-scrollbar-track{background:rgba(0,0,0,.25);border-radius:9px}
</style></head>
<body><main class="wrap"><header class="head"><div id="title" class="title">継続数ランキング</div><nav class="tabs"><a id="continueTab">継続数</a><a id="winTab">合計WIN</a></nav></header><section id="list" class="list vertical"></section></main>
<script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);let sort=params.get('sort')==='win'?'win':'continue';const base='/overlay_gacha_ranking.html';$('continueTab').href=base+'?sort=continue';$('winTab').href=base+'?sort=win';$('continueTab').classList.toggle('active',sort==='continue');$('winTab').classList.toggle('active',sort==='win');
function fontStack(value){return({system:'system-ui,sans-serif',yuGothic:'"Yu Gothic",YuGothic,sans-serif',meiryo:'Meiryo,sans-serif',gothic:'"Arial Black",Meiryo,sans-serif',serif:'"Yu Mincho",serif',mono:'ui-monospace,monospace'})[value]||'system-ui,sans-serif'}
function esc(value){const d=document.createElement('div');d.textContent=String(value??'');return d.textContent}
async function render(){try{const response=await fetch('/api/state?ts='+Date.now(),{cache:'no-store'});if(!response.ok)return;const state=await response.json(),g=state.gacha||{},history=Array.isArray(g.history)?g.history:[];document.documentElement.style.setProperty('--text',g.historyTextColor||'#fff');document.documentElement.style.setProperty('--border',g.historyCardBorder||'#ffcf59');document.documentElement.style.setProperty('--scale',String(Math.max(.5,Math.min(2.5,(Number(g.historyTextScale)||100)/100))));document.documentElement.style.setProperty('--font',fontStack(g.historyFontFamily==='global'?(state.globalFontFamily||'system'):g.historyFontFamily));const hex=/^#([0-9a-f]{6})$/i.exec(g.historyCardBg||'#17181e'),rgb=hex?[parseInt(hex[1].slice(0,2),16),parseInt(hex[1].slice(2,4),16),parseInt(hex[1].slice(4,6),16)].join(','):'23,24,30',alpha=Math.max(0,Math.min(100,Number(g.historyCardOpacity??93)))/100;document.documentElement.style.setProperty('--panel',`rgba(${rgb},${alpha})`);const direction=g.historyScrollDirection==='horizontal'?'horizontal':'vertical';$('list').className='list '+direction;$('title').textContent=sort==='continue'?'継続数ランキング':'合計WINランキング';$('continueTab').classList.toggle('active',sort==='continue');$('winTab').classList.toggle('active',sort==='win');const records=history.slice().sort((a,b)=>{const continues=(Number(b.continueCount)||0)-(Number(a.continueCount)||0),wins=(Number(b.result)||0)-(Number(a.result)||0);return sort==='continue'?(continues||wins):(wins||continues)});const host=$('list');host.replaceChildren();if(!records.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='ガチャ履歴はまだありません';host.appendChild(empty);return}records.forEach((item,index)=>{const card=document.createElement('article');card.className='item';const rank=document.createElement('div');rank.className='rank';rank.textContent=(index+1)+'位';const who=document.createElement('div');who.className='who';who.textContent=item.senderName||'ゲスト';const details=document.createElement('div');details.className='details';const date=new Date((Number(item.createdAt)||0)*1000);details.textContent=(item.patternName||'WINガチャ')+' ・ '+(Number(item.continueCount)||0)+'継続 ・ '+(Number.isNaN(date.getTime())?'':date.toLocaleString('ja-JP'));const score=document.createElement('div');const win=Number(item.result)||0;score.className='score'+(win<0?' negative':'');score.textContent=sort==='continue'?(Number(item.continueCount)||0)+'回継続':(win>0?'+':'')+win+' WIN';card.append(rank,who,details,score);host.appendChild(card)})}catch(error){}}
render();setInterval(render,1500);
</script></body></html>
