<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>その他ガチャ</title><style>
:root{font-family:"Yu Gothic UI",Meiryo,sans-serif;color:#fff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}.stage{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}.card{display:none;position:relative;width:min(82vw,1100px);height:min(76vh,720px);min-height:300px;border:2px solid #ffcf59;border-radius:28px;background:#17151cee;box-shadow:0 20px 80px #0009;overflow:hidden;pointer-events:none}.card.show{display:block;animation:appear .45s ease-out}.card.fullscreen{width:100vw;height:100vh;min-height:0;border:0;border-radius:0;background:#090a10e8}.media{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:.9}.media.show{display:block}.orb{position:absolute;inset:-60%;opacity:0;background:conic-gradient(from 0deg,transparent,#ffcf5930,transparent,#8977ff38,transparent);animation:orbit 5s linear infinite}.spinning .orb{opacity:1}.piece{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);max-width:94%;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;text-shadow:0 3px 18px #000c}.pattern{font-size:clamp(20px,3vw,42px);font-weight:900}.sender{font-size:clamp(16px,2vw,28px);color:#ffe9a6}.state{font-size:clamp(18px,2.5vw,34px);color:#ffe08a;font-weight:900}.result{font-size:100px;color:#fff;font-weight:1000;line-height:1.08}.slot.spinning .result{animation:slot .18s linear infinite alternate}.roulette.spinning .result{animation:roulette .42s ease-in-out infinite alternate}.fade.spinning .result{animation:fade .55s ease-in-out infinite alternate}.result.stop{animation:land .45s cubic-bezier(.2,.8,.2,1) both}.previewEditor .piece{pointer-events:auto;cursor:grab;touch-action:none;user-select:none;outline:1px dashed #9ce5ff88;outline-offset:5px}.previewEditor .piece:hover{outline:2px solid #8fe7ff}.previewEditor .selected{outline:2px solid #ffe16b}.previewGuide{position:absolute;z-index:12;display:none;pointer-events:none;border-color:#50eaff;filter:drop-shadow(0 0 3px #00d9ff)}.previewEditor .result{animation:none!important;filter:none!important;rotate:none!important;scale:none!important}.previewEditor .piece[style*="display: none"]{pointer-events:none}.previewGuide.vertical{top:0;bottom:0;border-left:1px dashed #50eaff}.previewGuide.horizontal{left:0;right:0;border-top:1px dashed #50eaff}.card.spinning::after{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at center,transparent 15%,#0003 100%);pointer-events:none}@keyframes appear{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}@keyframes slot{from{filter:blur(1px);transform:translate(-50%,-56%)}to{filter:none;transform:translate(-50%,-44%)}}@keyframes roulette{from{rotate:-3deg;scale:.96}to{rotate:3deg;scale:1.04}}@keyframes fade{from{opacity:.35;scale:.92}to{opacity:1;scale:1.05}}@keyframes land{0%{scale:1.25;filter:blur(6px)}70%{scale:.96}100%{scale:1;filter:none}}@keyframes orbit{to{transform:rotate(360deg)}}
</style></head><body><div class="stage"><section id="card" class="card"><div class="orb"></div><img id="customImage" class="media" alt=""><video id="customVideo" class="media" playsinline></video><div id="pattern" class="piece pattern" data-key="pattern"></div><div id="sender" class="piece sender" data-key="sender"></div><div id="state" class="piece state" data-key="state"></div><div id="result" class="piece result" data-key="result"></div></section></div>
<script>
const $=id=>document.getElementById(id);const previewOnly=new URLSearchParams(location.search).has('preview');let lastId=0,token=0,currentPatternId='',activeAudio=null,resultAudio=null,currentPreviewScene='spin',previewPatternData=null;const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function setSceneLayout(g,scene){currentPreviewScene=scene;const defaults={pattern:[50,17],sender:[50,28],state:[50,78],result:[50,53]},layout=g.sceneLayouts?.[scene]||g.layout||{};for(const [key,[dx,dy]] of Object.entries(defaults)){const el=$(key);el.style.left=Math.max(0,Math.min(100,+(layout[key+'X']??dx)))+'%';el.style.top=Math.max(0,Math.min(100,+(layout[key+'Y']??dy)))+'%'}setSceneStyles(g,scene)}
function setSceneStyles(g,scene){const style=g.sceneStyles?.[scene]||{},defaults={pattern:{color:'#ffffff',size:42},sender:{color:'#ffe9a6',size:28},state:{color:'#ffe08a',size:34},result:{color:g.resultColor||'#ffffff',size:g.resultSize||100}};const fonts={global:'"Yu Gothic UI",Meiryo,sans-serif',yuGothic:'"Yu Gothic",sans-serif',meiryo:'Meiryo,sans-serif',gothic:'"Arial Black",Impact,sans-serif',serif:'"Yu Mincho",serif',mono:'Consolas,monospace'};const family=fonts[style.fontFamily]||fonts.global;for(const [key,base] of Object.entries(defaults)){const el=$(key),item=style[key]||{};el.style.display=item.visible===false?'none':'';el.style.color=item.color||base.color;el.style.fontSize=Math.max(14,Math.min(300,+item.size||base.size))+'px';el.style.fontFamily=family}}
function applySettings(g){const card=$('card'),hex=/^#([0-9a-f]{6})$/i.exec(g.background||'#17151c'),rgb=hex?[parseInt(hex[1].slice(1,3),16),parseInt(hex[1].slice(3,5),16),parseInt(hex[1].slice(5,7),16)].join(','):'23,21,28';card.style.backgroundColor=`rgba(${rgb},${Math.max(0,Math.min(100,+g.opacity||0))/100})`;card.classList.toggle('fullscreen',g.effectStyle==='fullscreen');$('result').style.color=g.resultColor||'#fff';$('result').style.fontSize=Math.max(24,Math.min(300,+g.resultSize||100))+'px';setSceneLayout(g,g.previewScene||currentPreviewScene||'spin')}
function setMedia(url,g){const im=$('customImage'),video=$('customVideo');im.classList.remove('show');video.pause();video.classList.remove('show');if(!url)return;if(/\.(mp4|webm)(?:$|[?#])/i.test(url)){video.src=url;video.muted=g?.videoAudioEnabled===false;video.volume=Math.max(0,Math.min(1,(+g?.videoVolume||0)/100));video.classList.add('show');video.currentTime=0;video.play().catch(()=>{})}else{im.src=url;im.classList.add('show')}}
async function complete(id){try{await fetch('/api/other-gacha/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventId:id})})}catch(e){}}
async function play(ev,ownToken){const card=$('card'),duration=Math.max(1,Math.min(30,+ev.spinSeconds||5))*1000,labels=(ev.outcomes||[]).map(x=>x.label).filter(Boolean);currentPatternId=ev.patternId||'';previewPatternData=ev;applySettings(ev);setMedia(ev.animationUrl||'',ev);if(activeAudio){activeAudio.pause();activeAudio=null}if(ev.audioUrl){activeAudio=new Audio(ev.audioUrl);activeAudio.loop=true;activeAudio.volume=Math.max(0,Math.min(1,(+ev.audioVolume||0)/100));activeAudio.play().catch(()=>{})}card.className='card show '+(['slot','roulette','fade','fullscreen'].includes(ev.effectStyle)?ev.effectStyle:'slot');if(ev.effectStyle==='fullscreen')card.classList.add('fullscreen');$('pattern').textContent=ev.patternName||'その他ガチャ';$('sender').textContent=ev.senderName||'';card.classList.add('spinning');for(const round of(ev.rounds||[])){if(ownToken!==token)return;setSceneLayout(ev,'spin');$('state').textContent='抽選中…';$('result').classList.remove('stop');const started=Date.now();while(Date.now()-started<duration){$('result').textContent=labels.length?labels[Math.floor(Math.random()*labels.length)]:'抽選';await wait(100);if(ownToken!==token)return}$('result').textContent=round.label;$('result').classList.add('stop');card.classList.remove('spinning');setSceneLayout(ev,round.continued?'continue':'result');$('state').textContent=round.continued?'継続！':'抽選結果';if(ev.resultAudioUrl){if(resultAudio){resultAudio.pause();resultAudio=null}resultAudio=new Audio(ev.resultAudioUrl);resultAudio.volume=Math.max(0,Math.min(1,(+ev.resultAudioVolume||0)/100));resultAudio.play().catch(()=>{})}await wait(1300);if(round.continued)card.classList.add('spinning')}if(ownToken!==token)return;setSceneLayout(ev,'end');$('state').textContent='終了';await wait(1200);if(previewOnly)return;card.classList.remove('show');if(activeAudio){activeAudio.pause();activeAudio.currentTime=0;activeAudio=null}if(resultAudio){resultAudio.pause();resultAudio=null}const video=$('customVideo');video.pause();video.muted=true;await complete(ev.id)}
function installEditor(){if(!previewOnly)return;const card=$('card'),guideV=document.createElement('i'),guideH=document.createElement('i');guideV.className='previewGuide vertical';guideH.className='previewGuide horizontal';card.append(guideV,guideH);let drag=null;const defaults={pattern:{x:50,y:17},sender:{x:50,y:28},state:{x:50,y:78},result:{x:50,y:53}},keys=Object.keys(defaults);for(const el of document.querySelectorAll('.piece')){el.addEventListener('pointerdown',event=>{if(!card.classList.contains('show')||getComputedStyle(el).display==='none')return;event.preventDefault();const r=card.getBoundingClientRect(),scene=currentPreviewScene,key=el.dataset.key,l=previewPatternData?.sceneLayouts?.[scene]||previewPatternData?.layout||{},x=+(l[key+'X']??defaults[key].x),y=+(l[key+'Y']??defaults[key].y);el.setPointerCapture(event.pointerId);document.querySelectorAll('.piece').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');drag={el,key,scene,rect:r,offsetX:event.clientX-(r.left+r.width*x/100),offsetY:event.clientY-(r.top+r.height*y/100)}});el.addEventListener('pointermove',event=>{if(!drag||drag.el!==el)return;let x=Math.max(0,Math.min(100,(event.clientX-drag.offsetX-drag.rect.left)/drag.rect.width*100)),y=Math.max(0,Math.min(100,(event.clientY-drag.offsetY-drag.rect.top)/drag.rect.height*100));const layout=previewPatternData?.sceneLayouts?.[drag.scene]||previewPatternData?.layout||{},xs=[50],ys=[50];for(const k of keys){if(k===drag.key||getComputedStyle($(k)).display==='none')continue;xs.push(+(layout[k+'X']??defaults[k].x));ys.push(+(layout[k+'Y']??defaults[k].y))}const snap=(n,targets)=>{let out=n,dist=1.35;for(const t of targets){const d=Math.abs(n-t);if(d<dist){out=t;dist=d}}return{value:out,hit:out!==n}};const sx=snap(x,xs),sy=snap(y,ys);x=sx.value;y=sy.value;el.style.left=x+'%';el.style.top=y+'%';guideV.style.left=x+'%';guideV.style.display=sx.hit?'block':'none';guideH.style.top=y+'%';guideH.style.display=sy.hit?'block':'none';if(previewPatternData){previewPatternData.sceneLayouts=previewPatternData.sceneLayouts||{};previewPatternData.sceneLayouts[drag.scene]=previewPatternData.sceneLayouts[drag.scene]||{};previewPatternData.sceneLayouts[drag.scene][drag.key+'X']=x;previewPatternData.sceneLayouts[drag.scene][drag.key+'Y']=y}});el.addEventListener('pointerup',()=>{if(!drag||drag.el!==el)return;parent.postMessage({type:'other-gacha-layout',patternId:currentPatternId,scene:drag.scene,key:drag.key,x:parseFloat(el.style.left),y:parseFloat(el.style.top)},location.origin);drag=null;guideV.style.display=guideH.style.display='none'});el.addEventListener('pointercancel',()=>{drag=null;guideV.style.display=guideH.style.display='none'})}}
function renderPreviewScene(data){const ev=data.event||data,scene=data.scene||ev.previewScene||'spin';token++;previewPatternData=ev;currentPatternId=ev.patternId||currentPatternId;applySettings({...ev,previewScene:scene});setMedia(ev.animationUrl||'',ev);const card=$('card');card.className='card show '+(['slot','roulette','fade','fullscreen'].includes(ev.effectStyle)?ev.effectStyle:'slot')+' previewEditor';$('pattern').textContent=ev.patternName||'その他ガチャ';$('sender').textContent=ev.senderName||'プレビュー';$('result').textContent=(ev.outcomes||[])[0]?.label||'結果';$('result').classList.remove('stop');$('state').textContent=scene==='spin'?'抽選中…':scene==='continue'?'継続！':scene==='end'?'終了':'抽選結果';card.classList.toggle('spinning',scene==='spin');setSceneLayout(ev,scene)}
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'}),s=await r.json(),ev=s.otherGacha?.event||{};if(ev.active&&ev.id&&ev.id!==lastId){lastId=ev.id;token++;play(ev,token)}}catch(e){}}
window.addEventListener('message',event=>{if(event.origin!==location.origin)return;const data=event.data||{};if(data.type==='other-gacha-preview'){lastId=data.event.id;token++;if(previewOnly&&data.event.previewScene){renderPreviewScene({event:data.event,scene:data.event.previewScene});return}play(data.event,token)}else if(data.type==='other-gacha-preview-scene'){renderPreviewScene(data)}else if(data.type==='other-gacha-preview-update'){previewPatternData=data.pattern||{};const pattern=previewPatternData;applySettings({...pattern,previewScene:currentPreviewScene});currentPatternId=pattern.id||currentPatternId;setMedia(pattern.animationUrl||'',pattern);$('pattern').textContent=pattern.name||'';$('sender').textContent='プレビュー';if(pattern.outcomes?.[0])$('result').textContent=pattern.outcomes[0].label}});
if(!previewOnly){poll();setInterval(poll,500)}
</script></body></html>
