<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WINガチャ履歴</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:transparent;font-family:var(--overlay-font,system-ui,"Yu Gothic",sans-serif);color:var(--history-text,#fff)}.stage{padding:12px;width:min(620px,100vw)}.history{display:none;padding:18px 20px;background:var(--history-bg,rgba(23,21,28,.93));border:2px solid var(--history-border,#ffcf59);border-radius:18px;box-shadow:0 0 18px #0007}.history.show{display:block}.heading{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:clamp(calc(18px * var(--history-scale,1)),calc(2.4vw * var(--history-scale,1)),calc(28px * var(--history-scale,1)));font-weight:950;color:var(--history-text,#fff);letter-spacing:.04em}.heading::before{content:"";width:8px;height:1.1em;border-radius:5px;background:var(--history-border,#ffcf59);box-shadow:0 0 10px var(--history-border,#ffcf59)}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:10px 12px;background:#ffffff0d;border:1px solid var(--history-border,#ffcf59);border-radius:11px}.who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(calc(17px * var(--history-scale,1)),calc(2vw * var(--history-scale,1)),calc(23px * var(--history-scale,1)));font-weight:850}.meta{grid-column:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--history-text,#fff);font-size:clamp(calc(11px * var(--history-scale,1)),calc(1.3vw * var(--history-scale,1)),calc(14px * var(--history-scale,1)))}.result{grid-column:2;grid-row:1/3;font-size:clamp(calc(22px * var(--history-scale,1)),calc(3vw * var(--history-scale,1)),calc(34px * var(--history-scale,1)));font-weight:1000;color:var(--history-text,#fff);white-space:nowrap;text-shadow:none}.result.negative{color:#ff6678}@media(max-width:420px){.stage{padding:6px}.history{padding:12px}.row{padding:8px;gap:4px 8px}}
</style>
</head>
<body><main class="stage"><section id="history" class="history"><h1 class="heading">WINガチャ履歴</h1><div id="rows" class="rows"></div></section></main>
<script>
function fontStack(key,globalKey='system'){const stacks={system:'system-ui,"Yu Gothic",Meiryo,sans-serif',yuGothic:'"Yu Gothic","游ゴシック",sans-serif',meiryo:'Meiryo,"メイリオ",sans-serif',gothic:'"Arial Black",Impact,sans-serif',serif:'"Yu Mincho","游明朝",serif',mono:'ui-monospace,Consolas,monospace'};return key&&key!=='global'?stacks[key]||stacks.system:stacks[globalKey]||stacks.system}

function setOverlayFont(key){const stacks={system:'system-ui,"Yu Gothic",Meiryo,sans-serif',yuGothic:'"Yu Gothic","游ゴシック",sans-serif',meiryo:'Meiryo,"メイリオ",sans-serif',gothic:'"Arial Black",Impact,sans-serif',serif:'"Yu Mincho","游明朝",serif',mono:'ui-monospace,Consolas,monospace'};document.documentElement.style.setProperty("--overlay-font",stacks[key]||stacks.system)}

const historyCard=document.getElementById('history'),rows=document.getElementById('rows');
function rgbaColor(hex,a){const m=/^#([0-9a-f]{6})$/i.exec(hex||'');return m?`rgba(${parseInt(m[1].slice(0,2),16)},${parseInt(m[1].slice(2,4),16)},${parseInt(m[1].slice(4,6),16)},${a})`:'rgba(23,21,28,.93)'}
function escapeText(value){const el=document.createElement('span');el.textContent=String(value??'');return el.innerHTML}
function formatTime(value){const date=new Date((Number(value)||0)*1000);return Number.isNaN(date.getTime())?'':new Intl.DateTimeFormat('ja-JP',{hour:'2-digit',minute:'2-digit'}).format(date)}
async function update(){try{const response=await fetch('/api/state',{cache:'no-store'}),state=await response.json(),g=state.gacha||{};setOverlayFont(g.historyFontFamily==='global'?state.fontFamily:g.historyFontFamily);document.documentElement.style.setProperty('--history-scale',Math.max(.5,Math.min(2.5,(Number(g.historyTextScale)||100)/100)));document.documentElement.style.setProperty('--history-text',g.historyTextColor||'#fff');document.documentElement.style.setProperty('--history-border',g.historyCardBorder||'#ffcf59');document.documentElement.style.setProperty('--history-bg',rgbaColor(g.historyCardBg||'#17181e',Math.max(0,Math.min(100,Number(g.historyCardOpacity??93)))/100));const items=(g.history||[]).slice(0,8);if(!items.length){historyCard.classList.remove('show');return}rows.innerHTML=items.map(item=>{const result=Number(item.result)||0,sign=result>0?'+':'';return `<article class="row"><div class="who">${escapeText(item.senderName||'ゲスト')}</div><div class="meta">${escapeText(item.patternName||'WINガチャ')} · ${escapeText(formatTime(item.createdAt))}</div><div class="result ${result<0?'negative':''}">${sign}${result} WIN</div></article>`}).join('');historyCard.classList.add('show')}catch(error){}}
update();setInterval(update,1000);
function rgbaTextBg(hex,opacity){const m=/^#([0-9a-f]{6})$/i.exec(hex||'');return m?`rgba(${parseInt(m[1].slice(0,2),16)},${parseInt(m[1].slice(2,4),16)},${parseInt(m[1].slice(4,6),16)},${opacity})`:'transparent'}function applyGlobalTextFx(s){const custom=(s.textEffects||{}).gachaHistory||{},fx=custom.mode==='custom'?custom:{outlineEnabled:s.textOutlineEnabled,outlineColor:s.textOutlineColor,outlineWidth:s.textOutlineWidth,backgroundEnabled:s.textBackgroundEnabled,backgroundColor:s.textBackgroundColor,backgroundOpacity:s.textBackgroundOpacity},nodes=document.querySelectorAll('.heading,.who,.meta,.result'),stroke=fx.outlineEnabled?Math.max(0,Math.min(10,+fx.outlineWidth||0))+'px '+(fx.outlineColor||'#000'):'0 transparent',bg=fx.backgroundEnabled?rgbaTextBg(fx.backgroundColor||'#000',Math.max(0,Math.min(100,+fx.backgroundOpacity||0))/100):'';nodes.forEach(node=>{node.style.webkitTextStroke=stroke;node.style.paintOrder='stroke fill';node.style.backgroundColor=bg;node.style.boxDecorationBreak='clone';node.style.webkitBoxDecorationBreak='clone';node.style.borderRadius='6px';node.style.padding=fx.backgroundEnabled?'1px 5px':''})}async function refreshGlobalTextFx(){try{applyGlobalTextFx(await(await fetch('/api/state',{cache:'no-store'})).json())}catch(e){}}refreshGlobalTextFx();setInterval(refreshGlobalTextFx,1000);
</script></body></html>
