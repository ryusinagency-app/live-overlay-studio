<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:transparent;font-family:"Yu Gothic UI",sans-serif}.list{display:flex;flex-wrap:wrap;gap:10px}.card{display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid;border-radius:18px;text-align:center;padding:12px;overflow:hidden}.card img{object-fit:contain}.name{font-weight:900}.value{font-weight:900}.desc{margin-top:6px}</style></head><body><div id="list" class="list"></div><script>
let seen='',audio=null,audioTimer=null;function playSound(x){if(audio){audio.pause();audio=null}if(audioTimer)clearTimeout(audioTimer);if(!x||!x.soundUrl)return;audio=new Audio(x.soundUrl);audio.volume=Math.max(0,Math.min(1,(x.soundVolume??100)/100));audio.play().catch(()=>{});if(+x.soundSeconds>0){let current=audio;audioTimer=setTimeout(()=>{if(audio===current){audio.pause();audio=null}},+x.soundSeconds*1000)}}const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),rgba=(h,a)=>{h=h.replace('#','');return 'rgba('+parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16)+','+(a/100)+')'};async function tick(){try{let s=await(await fetch('/api/overlay',{cache:'no-store'})).json(),latest=(s.game.announcements||[]).at(-1);if(latest&&latest.eventId!==seen&&Date.now()/1000-latest.at<20){seen=latest.eventId;playSound(latest)}let o=s.config.overlay.effectListStyle,e=Object.values(s.config.effects||{}).filter(x=>x.enabled!==false&&!x.gachaOnly&&x.showInList!==false),g=Object.values(s.config.gachas||{}).filter(x=>x.enabled!==false&&x.showInEffectList!==false);document.getElementById('list').innerHTML=[...e.map(x=>({name:x.name||'',value:x.displayText||((x.autoText!==false)?(x.actions||[]).map(a=>a.kind+' ×'+a.amount).join(' / '):''),description:x.description||'',imageUrl:x.imageUrl||''})),...g.map(x=>({name:x.name||'ガチャ',value:'',description:'',imageUrl:x.imageUrl||''}))].map(x=>'<div class="card" style="width:'+o.width+'px;height:'+o.height+'px;background:'+rgba(o.background,o.backgroundOpacity)+';border-color:'+o.border+';color:'+o.text+';text-shadow:'+(o.outline?'0 0 '+o.outlineWidth+'px '+o.outlineColor:'none')+'">'+(x.imageUrl?'<img src="'+esc(x.imageUrl)+'" style="width:'+o.imageSize+'px;height:'+o.imageSize+'px">':'')+'<div class="name" style="font-size:'+o.nameSize+'px">'+esc(x.name)+'</div><div class="value" style="font-size:'+o.valueSize+'px;color:'+o.accent+'">'+esc(x.value)+'</div><div class="desc" style="font-size:'+o.descriptionSize+'px">'+esc(x.description)+'</div></div>').join('')}catch(e){}}tick();setInterval(tick,1000)</script></body></html>
