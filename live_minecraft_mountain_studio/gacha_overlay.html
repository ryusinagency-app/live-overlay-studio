<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>body{margin:0;background:transparent;color:#fff;font-family:"Yu Gothic UI",sans-serif;text-align:center;text-shadow:0 3px 8px #000}.box{width:680px;margin:20px auto;padding:28px;border:4px solid #ef334e;border-radius:28px;background:#10131ae8;opacity:0;transform:scale(.9);transition:.25s}.box.show{opacity:1;transform:scale(1)}.name{font-size:40px;font-weight:900}.sender{font-size:22px;color:#9cf3bb}.reel{font-size:54px;font-weight:900;margin:28px 0;color:#ffd34e}.result{font-size:46px;font-weight:900;color:#fff}</style></head><body><div id="box" class="box"><div id="name" class="name"></div><div id="sender" class="sender"></div><div id="reel" class="reel">◆ ◆ ◆</div><div id="result" class="result"></div></div><script>let seen='';const $=id=>document.getElementById(id);async function tick(){try{const s=await(await fetch('/api/overlay',{cache:'no-store'})).json(),e=(s.gachaEvents||[]).at(-1);if(!e)return;if(e.eventId!==seen){seen=e.eventId;$('name').textContent=e.gachaName;$('sender').textContent=e.sender;$('box').classList.add('show')}$('reel').textContent=e.state==='spinning'?'◆ ◇ ◆ ◇ ◆':'';$('result').textContent=e.state==='result'?e.result:'';if(e.state==='result')setTimeout(()=>$('box').classList.remove('show'),3000)}catch(e){}}setInterval(tick,150);tick()</script></body></html>
