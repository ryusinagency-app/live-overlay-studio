<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>body{margin:0;background:transparent;font-family:"Yu Gothic UI",sans-serif;text-align:center}.box{margin:20px auto;padding:28px;border:4px solid;border-radius:28px;opacity:0;transform:scale(.9);transition:.25s}.box.show{opacity:1;transform:scale(1)}.name,.result{font-weight:900}.sender{font-weight:700}.reel{font-weight:900;margin:25px 0}.image{object-fit:contain}</style></head><body><div id="box" class="box"><img id="image" class="image"><div id="name" class="name"></div><div id="sender" class="sender"></div><div id="reel" class="reel">◆ ◇ ◆ ◇ ◆</div><div id="result" class="result"></div></div><script>
let seen='',audio=null,audioTimer=null,hideTimer=null;const $=id=>document.getElementById(id),rgba=(h,a)=>{h=h.replace('#','');return 'rgba('+parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16)+','+(a/100)+')'};
function stopSound(){if(audio){audio.pause();audio.currentTime=0;audio=null}if(audioTimer){clearTimeout(audioTimer);audioTimer=null}}
function sound(e){stopSound();if(!e.soundUrl)return;audio=new Audio(e.soundUrl);audio.volume=Math.max(0,Math.min(1,(e.soundVolume??100)/100));audio.loop=e.state==='spinning'&&!(+e.soundSeconds>0);audio.play().catch(()=>{});if(+e.soundSeconds>0){let current=audio;audioTimer=setTimeout(()=>{if(audio===current)stopSound()},+e.soundSeconds*1000)}}
async function tick(){try{let s=await(await fetch('/api/overlay',{cache:'no-store'})).json(),e=(s.gachaEvents||[]).at(-1);if(!e)return;let o=s.config.overlay.gachaStyle,b=$('box');b.style.cssText='width:'+o.width+'px;background:'+rgba(o.background,o.backgroundOpacity)+';border-color:'+o.border+';color:'+o.text+';text-shadow:'+(o.outline?'0 0 '+o.outlineWidth+'px '+o.outlineColor:'none');$('name').style.fontSize=o.nameSize+'px';$('sender').style.fontSize=o.senderSize+'px';$('reel').style.fontSize=o.reelSize+'px';$('result').style.fontSize=o.resultSize+'px';$('reel').style.color=o.accent;$('image').style.width=$('image').style.height=o.imageSize+'px';
let phase=e.phaseId||e.eventId+':'+e.state;if(phase===seen)return;seen=phase;if(hideTimer){clearTimeout(hideTimer);hideTimer=null}
if(e.state==='hidden'){stopSound();b.classList.remove('show');return}
$('name').textContent=e.gachaName||'ガチャ';$('sender').textContent=e.sender||'';$('image').src=e.imageUrl||'';$('image').style.display=e.imageUrl?'inline-block':'none';$('reel').textContent=e.state==='spinning'?'◆ ◇ ◆ ◇ ◆':'';$('result').textContent=e.state==='result'?e.result:'';b.classList.add('show');sound(e);
if(e.state==='result')hideTimer=setTimeout(()=>{b.classList.remove('show');stopSound()},Math.max(500,+(e.resultSeconds||2)*1000))
}catch(err){}}tick();setInterval(tick,150)</script></body></html>
