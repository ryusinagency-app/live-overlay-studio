<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>body{margin:0;background:transparent;font-family:"Yu Gothic UI",sans-serif;color:#fff}.box{margin:10px;padding:20px;border:4px solid;border-radius:22px;text-align:center;display:none}.box.show{display:block}.title{font-weight:900}.value{font-weight:900}.timer{font-weight:900}.bar{height:16px;border-radius:99px;background:#252b38;overflow:hidden}.bar i{display:block;height:100%}</style></head><body><div id="box" class="box"><div id="title" class="title">倍率タイム</div><div id="value" class="value"></div><div id="timer" class="timer"></div><div class="bar"><i id="bar"></i></div><div id="next"></div></div><script>
const rgba=(h,a)=>{h=h.replace('#','');return 'rgba('+parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16)+','+(a/100)+')'},fmt=n=>new Date(Math.max(0,n)*1000).toISOString().slice(11,19);async function tick(){try{let s=await(await fetch('/api/overlay',{cache:'no-store'})).json(),m=s.game.multiplier,c=s.config.multiplier,o=s.config.overlay.feverStyle,b=document.getElementById('box');b.classList.toggle('show',m.active);b.style.cssText='width:'+o.width+'px;background:'+rgba(o.background,o.backgroundOpacity)+';border-color:'+o.border+';color:'+o.text+';text-shadow:'+(o.outline?'0 0 '+o.outlineWidth+'px '+o.outlineColor:'none');title.style.fontSize=o.titleSize+'px';value.style.fontSize=o.valueSize+'px';timer.style.fontSize=o.timerSize+'px';value.textContent=m.multiplier+'倍';timer.textContent=fmt(m.remainingSeconds);next.textContent=(c.nextLabel||'次の倍率まで')+' '+m.progress+' / '+m.threshold;bar.style.width=Math.min(100,m.progress/Math.max(1,m.threshold)*100)+'%';bar.style.background=o.accent}catch(e){}}tick();setInterval(tick,250)</script></body></html>
