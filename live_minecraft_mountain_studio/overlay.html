<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:transparent;color:white;font-family:"Yu Gothic UI",sans-serif}.wrap{margin:10px;padding:18px;border:3px solid #ef334e;border-radius:20px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-weight:900}.fever{color:#ffd34e;font-weight:900}.line{display:flex;justify-content:space-between;margin-top:12px}.bar{height:18px;background:#1c2430;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#54e694}.event{text-align:center;font-size:26px;font-weight:900;margin-top:15px;min-height:35px}.sender{text-align:center;font-size:18px}</style></head><body><div class="wrap"><div class="top"><div class="title">⛰ 山頂を目指せ！</div><div id="fever" class="fever"></div></div><div class="line"><b id="height">現在高度 --</b><span id="goal">ゴール --</span></div><div class="bar"><i id="progress"></i></div><div class="line"><span id="checkpoint"></span><span id="distance"></span></div><div id="event" class="event"></div><div id="sender" class="sender"></div></div><script>const $=id=>document.getElementById(id);let seen='';async function update(){try{const s=await(await fetch('/api/overlay',{cache:'no-store'})).json(),c=s.game.course,m=s.game.multiplier,o=s.config.overlay,w=document.querySelector('.wrap');w.style.width=o.width+'px';w.style.background=o.background+Math.round((o.backgroundOpacity??84)*2.55).toString(16).padStart(2,'0');w.style.borderColor=o.border;w.style.color=o.text;w.style.setProperty('--accent',o.accent);document.querySelector('.title').style.fontSize=o.titleSize+'px';document.querySelectorAll('.line').forEach(x=>x.style.fontSize=o.textSize+'px');if(o.outline)document.body.style.textShadow='-'+o.outlineWidth+'px 0 '+o.outlineColor+', '+o.outlineWidth+'px 0 '+o.outlineColor+', 0 -'+o.outlineWidth+'px '+o.outlineColor+', 0 '+o.outlineWidth+'px '+o.outlineColor;else document.body.style.textShadow='none';const p=(c.players||[])[0]||{},sy=Number(c.startY),gy=Number(c.goalY),y=Number(p.y??sy),pct=Math.max(0,Math.min(100,(y-sy)/Math.max(1,gy-sy)*100));$('height').textContent='現在高度 '+Math.floor(y);$('goal').textContent='ゴール '+Math.floor(gy);$('progress').style.width=pct+'%';$('progress').style.background=o.accent;$('checkpoint').textContent='チェックポイント '+(p.checkpointY??sy);$('distance').textContent=p.distanceToGoal!=null?'山頂まで '+Math.ceil(p.distanceToGoal)+'m':'';$('fever').textContent=m.active?'🔥 '+m.multiplier+'倍 '+new Date(m.remainingSeconds*1000).toISOString().slice(11,19):'';const e=(s.game.announcements||[]).at(-1);if(e&&e.eventId!==seen&&Date.now()/1000-e.at<15){seen=e.eventId;$('event').textContent=e.title;$('sender').textContent=e.sender?e.sender:'';setTimeout(()=>{$('event').textContent='';$('sender').textContent=''},5000)}}catch(e){}}update();setInterval(update,500)</script></body></html>
