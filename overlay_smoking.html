<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>禁煙タイマー</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:var(--overlay-font,system-ui,"Yu Gothic",sans-serif);color:var(--card-text,var(--text-color,#fff))}.hidden{display:none}.timer{position:absolute;left:3.5%;top:5%;display:flex;flex-direction:column;gap:7px;width:max-content;max-width:93vw;min-width:min(440px,93vw);padding:20px 26px 24px;background:var(--panel-bg,rgba(23,24,30,.88));border-left:5px solid var(--accent,#e52b3c);border-radius:0 12px 12px 0;color:var(--card-text,var(--text-color,#fff));filter:drop-shadow(0 3px 8px #0009)}.label{font-size:clamp(32px,var(--smoke-label-size,56px),80px);font-weight:1000;line-height:1.1;text-shadow:0 2px 8px #000a}.value{font-size:clamp(64px,var(--smoke-value-size,130px),180px);white-space:nowrap;line-height:1.05;font-weight:1000;font-variant-numeric:tabular-nums;letter-spacing:.04em;text-shadow:var(--text-glow,none)}.finished .value{color:#ffdc78;text-shadow:var(--text-glow,none)}</style><body><div id="timer" class="timer"><div class="label">禁煙タイマー</div><div class="value" id="value">00:00:00</div></div><audio id="alarm" preload="auto"></audio><script>
function fontStack(key,globalKey='system'){const stacks={system:'system-ui,"Yu Gothic",Meiryo,sans-serif',yuGothic:'"Yu Gothic","游ゴシック",sans-serif',meiryo:'Meiryo,"メイリオ",sans-serif',gothic:'"Arial Black",Impact,sans-serif',serif:'"Yu Mincho","游明朝",serif',mono:'ui-monospace,Consolas,monospace'};return key&&key!=='global'?stacks[key]||stacks.system:stacks[globalKey]||stacks.system}

function setOverlayFont(key){const stacks={system:'system-ui,"Yu Gothic",Meiryo,sans-serif',yuGothic:'"Yu Gothic","游ゴシック",sans-serif',meiryo:'Meiryo,"メイリオ",sans-serif',gothic:'"Arial Black",Impact,sans-serif',serif:'"Yu Mincho","游明朝",serif',mono:'ui-monospace,Consolas,monospace'};document.documentElement.style.setProperty("--overlay-font",stacks[key]||stacks.system)}

const $=id=>document.getElementById(id);let lastRun=0;function rgbaColor(hex,a){const m=/^#([0-9a-f]{6})$/i.exec(hex||'');return m?`rgba(${parseInt(m[1].slice(0,2),16)},${parseInt(m[1].slice(2,4),16)},${parseInt(m[1].slice(4,6),16)},${a})`:''}
function format(s){s=Math.max(0,Math.floor(s));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')}
async function update(){try{const r=await fetch('/api/state',{cache:'no-store'}),s=await r.json(),t=s.smokingTimer||{};setOverlayFont(s.fontFamily);const color=s.panelColor||'#17181e',rgb=color.match(/[0-9a-f]{2}/gi).map(v=>parseInt(v,16)).join(','),opacity=Math.max(0,Math.min(100,+s.panelOpacity||0))/100;document.documentElement.style.setProperty('--accent',s.accent||'#e52b3c');document.documentElement.style.setProperty('--text-color',s.textColor||'#fff');document.documentElement.style.setProperty('--text-glow',s.textGlowEnabled?'0 0 '+(s.textGlowStrength||12)+'px '+(s.textGlowColor||s.accent||'#e52b3c'):'none');document.documentElement.style.setProperty('--panel-bg',`rgba(${rgb},${opacity})`);const size=Math.max(80,Math.min(180,+(t.fontSize??130)));document.documentElement.style.setProperty('--smoke-value-size',size+'px');document.documentElement.style.setProperty('--smoke-label-size',Math.max(32,Math.min(80,+(t.titleSize??56)))+'px');const remaining=t.endAt?Math.max(0,Math.ceil(+t.endAt-Date.now()/1000)):Math.max(0,+t.remainingSeconds||0);$('value').textContent=format(remaining);$('timer').style.backgroundColor=rgbaColor(t.cardBg||(s.cardDefaults||{}).background||color,t.cardOpacity>=0?t.cardOpacity/100:opacity);$('timer').style.setProperty('--card-text',t.cardTextColor||s.textColor||'#fff');$('timer').style.fontFamily=fontStack(t.fontFamily,s.fontFamily);$('timer').style.borderLeftColor=t.cardBorder||(s.cardDefaults||{}).border||s.accent||'#e52b3c';$('timer').classList.toggle('finished',remaining===0&&!!t.runId);if(t.audioUrl&&t.runId&&remaining===0&&lastRun!==+t.runId){lastRun=+t.runId;const key='live-overlay-smoking-alarm-'+t.runId;if(!localStorage.getItem(key)){ $('alarm').src=t.audioUrl;$('alarm').volume=Math.max(0,Math.min(100,+(t.volume??80)))/100;$('alarm').currentTime=0;$('alarm').play().then(()=>localStorage.setItem(key,'played')).catch(err=>console.warn('禁煙タイマーの音声を再生できませんでした',err)) }}}catch(e){}}
update();setInterval(update,250);
function rgbaTextBg(hex,opacity){const m=/^#([0-9a-f]{6})$/i.exec(hex||'');return m?`rgba(${parseInt(m[1].slice(0,2),16)},${parseInt(m[1].slice(2,4),16)},${parseInt(m[1].slice(4,6),16)},${opacity})`:'transparent'}function applyGlobalTextFx(s){const custom=(s.textEffects||{}).smoking||{},fx=custom.mode==='custom'?custom:{outlineEnabled:s.textOutlineEnabled,outlineColor:s.textOutlineColor,outlineWidth:s.textOutlineWidth,backgroundEnabled:s.textBackgroundEnabled,backgroundColor:s.textBackgroundColor,backgroundOpacity:s.textBackgroundOpacity},nodes=document.querySelectorAll('.label,.value'),stroke=fx.outlineEnabled?Math.max(0,Math.min(10,+fx.outlineWidth||0))+'px '+(fx.outlineColor||'#000'):'0 transparent',bg=fx.backgroundEnabled?rgbaTextBg(fx.backgroundColor||'#000',Math.max(0,Math.min(100,+fx.backgroundOpacity||0))/100):'';nodes.forEach(node=>{node.style.webkitTextStroke=stroke;node.style.paintOrder='stroke fill';node.style.backgroundColor=bg;node.style.boxDecorationBreak='clone';node.style.webkitBoxDecorationBreak='clone';node.style.borderRadius='6px';node.style.padding=fx.backgroundEnabled?'1px 5px':''})}async function refreshGlobalTextFx(){try{applyGlobalTextFx(await(await fetch('/api/state',{cache:'no-store'})).json())}catch(e){}}refreshGlobalTextFx();setInterval(refreshGlobalTextFx,1000);
</script></body></html>
