<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>禁煙ガチャ</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:var(--overlay-font,system-ui,"Yu Gothic",sans-serif);color:#fff}.stage{position:absolute;inset:0;display:none;place-items:center;overflow:hidden;background:#08080df2}.stage.show{display:grid}.stage.cardMode{background:transparent}.frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;height:100%;overflow:hidden;background:#08080d}.stage.cardMode .frame{border:2px solid #ffffff70;border-radius:24px;box-shadow:0 12px 40px #0009}.media{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#08080d}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#05050ac9,#05050a55,#05050ac9);pointer-events:none}.content{position:absolute;inset:0;text-align:center;width:100%;height:100%;padding:0;text-shadow:0 3px 15px #000}.name{position:absolute;top:5%;left:0;width:100%}.sender{position:absolute;top:14%;left:0;width:100%;margin:0}.number{position:absolute;left:var(--slot-x,50%);top:var(--slot-y,50%);translate:-50% -50%;white-space:nowrap}.status{position:absolute;left:50%;top:calc(var(--slot-y,50%) + 10%);translate:-50% 0;margin:0;white-space:nowrap}.signs{position:absolute;left:50%;top:calc(var(--slot-y,50%) + 18%);translate:-50% 0;margin:0;white-space:nowrap}.name{font-size:clamp(26px,4vw,54px);font-weight:900;color:#ffedaf}.sender{font-size:clamp(20px,2.8vw,36px);margin-top:1vh}.number{font-weight:1000;font-size:var(--size,130px);line-height:1.06;color:var(--number,#fff);font-variant-numeric:tabular-nums;text-shadow:0 4px 25px #000,0 0 25px currentColor}.status{font-size:clamp(22px,3vw,42px);font-weight:900;margin-top:1.5vh}.signs{display:none;gap:4vw;justify-content:center;margin-top:3vh;font-size:clamp(28px,4vw,58px);font-weight:1000;pointer-events:auto}.signs.show{display:flex}.signs span{padding:.2em .8em;border:3px solid currentColor;border-radius:18px;background:#111a;cursor:pointer}.plus{color:#83ffbd}.minus{color:#ff788a}.stage.spinning .number{animation:pulse .18s alternate infinite}.stage.spinning .content{animation:none}.flash{animation:flash .5s ease-in-out 3}@keyframes pulse{to{filter:brightness(1.6);transform:scale(1.045)}}@keyframes flash{50%{filter:brightness(1.6)}}</style><body><div class="stage" id="stage"><div class="frame" id="frame"><video class="media" id="video" playsinline loop muted hidden></video><img class="media" id="image" alt="" hidden><div class="shade"></div><div class="content"><div class="name" id="name"></div><div class="sender" id="sender"></div><div class="number" id="number">???</div><div class="status" id="status">抽選中…</div><div class="signs" id="signs"><span class="plus" data-choice="plus">＋ 時間を追加</span><span class="minus" data-choice="minus">－ 時間を減らす</span></div></div></div></div><script>
function fontStack(key,globalKey='system'){const stacks={system:'system-ui,"Yu Gothic",Meiryo,sans-serif',yuGothic:'"Yu Gothic","游ゴシック",sans-serif',meiryo:'Meiryo,"メイリオ",sans-serif',gothic:'"Arial Black",Impact,sans-serif',serif:'"Yu Mincho","游明朝",serif',mono:'ui-monospace,Consolas,monospace'};return key&&key!=='global'?stacks[key]||stacks.system:stacks[globalKey]||stacks.system}

function setOverlayFont(key){const stacks={system:'system-ui,"Yu Gothic",Meiryo,sans-serif',yuGothic:'"Yu Gothic","游ゴシック",sans-serif',meiryo:'Meiryo,"メイリオ",sans-serif',gothic:'"Arial Black",Impact,sans-serif',serif:'"Yu Mincho","游明朝",serif',mono:'ui-monospace,Consolas,monospace'};document.documentElement.style.setProperty("--overlay-font",stacks[key]||stacks.system)}

const $=id=>document.getElementById(id);let lastId=0,token=0,activeAudio=null,testChoiceResolve=null,livePreviewG=null,previewMode=new URLSearchParams(location.search).has('preview'),previewAnimationUrl="";const wait=ms=>new Promise(r=>setTimeout(r,ms));const testMode=new URLSearchParams(location.search).has('test');
function fitFrameToMedia(){const stage=$('stage'),frame=$('frame'),v=$('video'),im=$('image'),card=stage.classList.contains('cardMode'),sw=stage.clientWidth||innerWidth,sh=stage.clientHeight||innerHeight,maxW=card?Math.min(sw*.82,900):sw,maxH=card?Math.min(sh*.72,560):sh,el=!v.hidden&&v.videoWidth?v:(!im.hidden&&im.naturalWidth?im:null);let w=maxW,h=maxH;if(el){const ratio=(el.videoWidth||el.naturalWidth)/(el.videoHeight||el.naturalHeight);if(ratio>0&&Number.isFinite(ratio)){if(maxW/maxH>ratio)w=maxH*ratio;else h=maxW/ratio}}frame.style.width=Math.max(1,w)+'px';frame.style.height=Math.max(1,h)+'px'}
function media(url){const v=$('video'),im=$('image');v.pause();v.removeAttribute('src');v.hidden=true;im.hidden=true;fitFrameToMedia();if(!url)return;if(/\.(mp4|webm)(?:$|[?#])/i.test(url)){v.src=url;v.hidden=false;v.onloadedmetadata=()=>{fitFrameToMedia();v.play().catch(()=>{})};v.play().catch(()=>{})}else{im.onload=fitFrameToMedia;im.src=url;im.hidden=false}}
function stopAudio(){if(activeAudio){activeAudio.pause();activeAudio.currentTime=0;activeAudio=null}}
function playAudio(url,volume,loop=false){if(!url)return;stopAudio();activeAudio=new Audio(url);activeAudio.loop=loop;activeAudio.volume=Math.max(0,Math.min(100,+volume||0))/100;activeAudio.play().catch(()=>{})}
async function markReady(id){try{await fetch('/api/smoking-gacha/choice-ready',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventId:id})})}catch(e){}}
function applyStageLayout(isCard){const stage=$('stage');stage.classList.toggle('cardMode',!!isCard);fitFrameToMedia()}
async function finish(id){try{await fetch('/api/smoking-gacha/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventId:id})})}catch(e){}}
function waitForTestChoice(){return new Promise(resolve=>{testChoiceResolve=resolve})}
function applyPreviewSettings(g,pattern){livePreviewG=g||livePreviewG||{};const active=livePreviewG;$('stage').style.setProperty('--size',(+active.slotNumberSize||130)+'px');$('stage').style.setProperty('--number',active.slotNumberColor||'#fff');$('stage').style.setProperty('--slot-x',(active.slotX??50)+'%');$('stage').style.setProperty('--slot-y',(active.slotY??50)+'%');applyStageLayout(active.effectStyle==='card');const url=pattern?.animationUrl||active.animationUrl||'';if(url!==previewAnimationUrl){previewAnimationUrl=url;media(url)}}
$('signs').addEventListener('click',event=>{const choice=event.target.closest('[data-choice]')?.dataset.choice;if((testMode||previewMode)&&choice&&testChoiceResolve){const resolve=testChoiceResolve;testChoiceResolve=null;resolve(choice)}});
async function run(ev,g,pattern,playToken){let duration=Math.max(3,Math.min(30,+(pattern?.spinSeconds||g.spinSeconds)||7))*1000;$('stage').className='stage show spinning';applyStageLayout(g.effectStyle==='card');$('stage').style.setProperty('--size',(+g.slotNumberSize||130)+'px');$('stage').style.setProperty('--number',g.slotNumberColor||'#fff');$('stage').style.setProperty('--slot-x',(g.slotX??50)+'%');$('stage').style.setProperty('--slot-y',(g.slotY??50)+'%');$('name').textContent=ev.patternName||'禁煙ガチャ';$('sender').textContent=ev.senderName||'';$('status').textContent='抽選中…';$('signs').classList.remove('show');$('number').textContent='???';media(pattern?.animationUrl||g.animationUrl||'');if(pattern?.audioUrl||g.audioUrl)playAudio(pattern?.audioUrl||g.audioUrl,g.audioVolume,true);const start=Date.now();while(Date.now()-start<duration&&playToken===token){$('number').textContent=(Math.floor(Math.random()*30)+1)+'分';const activeG=ev.preview&&livePreviewG?livePreviewG:g;duration=Math.max(3,Math.min(30,+activeG.spinSeconds||7))*1000;const p=Math.min(1,(Date.now()-start)/duration),exponent=activeG.spinStyle==='steady'?1.3:activeG.spinStyle==='ease-out'?2.4:4.5;await wait(34+Math.pow(p,exponent)*340)}if(playToken!==token)return;stopAudio();$('stage').classList.remove('spinning');$('stage').classList.add('flash');$('number').textContent=ev.minutes+'分';$('status').textContent='抽選結果';playAudio(pattern?.resultAudioUrl||g.resultAudioUrl,g.resultAudioVolume,false);
	if(ev.preview&&(testMode||previewMode)){$('status').textContent='＋か－を選んでください';$('signs').classList.add('show');const choice=await waitForTestChoice();if(playToken!==token)return;$('signs').classList.remove('show');$('status').textContent=(choice==='plus'?'＋':'－')+'で確定！';$('number').textContent=(choice==='minus'?'－':'+')+ev.minutes+'分';playAudio(g.resultAudioUrl,g.resultAudioVolume,false);await wait(Math.max(1,Math.min(600,+g.endSeconds||6))*1000);if(playToken===token){$('stage').className='stage';media('');stopAudio()}return}
await markReady(ev.id);while(playToken===token){try{const state=await(await fetch('/api/state',{cache:'no-store'})).json(),current=state.smokingGacha?.event||{};if(current.id===ev.id&&current.choice){$('status').textContent=(current.choice==='plus'?'＋':'－')+ev.minutes+'分で確定！';$('signs').classList.remove('show');$('number').textContent=(current.choice==='minus'?'－':'+')+ev.minutes+'分';stopAudio();playAudio(g.resultAudioUrl,g.resultAudioVolume,false);await wait(Math.max(1,Math.min(600,+g.endSeconds||6))*1000);if(playToken===token){$('stage').className='stage';media('');stopAudio();await finish(ev.id)}return}if(current.id===ev.id&&current.choiceReady){$('status').textContent='＋か－を選んでください';$('signs').classList.add('show')}}catch(e){}await wait(250)}}
async function startTest(){const params=new URLSearchParams(location.search),patternId=params.get('patternId');$('stage').className='stage show';$('name').textContent='禁煙ガチャ テスト';$('sender').textContent='';$('number').textContent='…';$('status').textContent='テスト抽選を準備しています';try{if(!patternId)throw Error('パターンIDがありません。操作画面からテストを押してください');const response=await fetch('/api/smoking-gacha/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patternId})});const result=await response.json();if(!response.ok||!result.ok)throw Error(result.message||'サーバーがテスト抽選を受け付けませんでした');token++;run(result.event,result.smokingGacha,(result.smokingGacha.patterns||[]).find(item=>item.id===patternId),token)}catch(error){$('name').textContent='テストを開始できません';$('number').textContent='';$('status').textContent=error.message}}
async function update(){try{const s=await(await fetch('/api/state',{cache:'no-store'})).json();setOverlayFont(s.fontFamily);const g=s.smokingGacha||{},ev=g.event||{};setOverlayFont(g.fontFamily==='global'?s.fontFamily:g.fontFamily);if(ev.active&&ev.type==='smoking-gacha'&&ev.id&&ev.id!==lastId){lastId=ev.id;if(Date.now()/1000-(+ev.createdAt||0)<300){const pattern=(g.patterns||[]).find(p=>p.id===ev.patternId);token++;run(ev,g,pattern,token)}}}catch(e){}}
window.addEventListener('resize',fitFrameToMedia);
if(previewMode){window.addEventListener('message',message=>{if(message.origin!==location.origin)return;const data=message.data||{};if(data.type==='smoking-gacha-preview'){livePreviewG=data.g||{};setOverlayFont(livePreviewG.fontFamily==='global'?livePreviewG.globalFontFamily:livePreviewG.fontFamily);previewAnimationUrl=data.pattern?.animationUrl||livePreviewG.animationUrl||'';token++;run(data.event,livePreviewG,data.pattern,token)}else if(data.type==='smoking-gacha-preview-update'){livePreviewG=data.g||livePreviewG||{};setOverlayFont(livePreviewG.fontFamily==='global'?livePreviewG.globalFontFamily:livePreviewG.fontFamily);applyPreviewSettings(data.g,data.pattern)}})}else if(testMode)startTest();else{update();setInterval(update,250)}
function rgbaTextBg(hex,opacity){const m=/^#([0-9a-f]{6})$/i.exec(hex||'');return m?`rgba(${parseInt(m[1].slice(0,2),16)},${parseInt(m[1].slice(2,4),16)},${parseInt(m[1].slice(4,6),16)},${opacity})`:'transparent'}function applyGlobalTextFx(s){const g=s.smokingGacha||{},patternId=g.event?.active?g.event.patternId:(g.patterns||[]).find(item=>item.name===$('name').textContent)?.id,key=patternId?'smokingGacha:'+patternId:'smokingGacha',custom=(s.textEffects||{})[key]||(s.textEffects||{}).smokingGacha||{},fx=custom.mode==='custom'?custom:{outlineEnabled:s.textOutlineEnabled,outlineColor:s.textOutlineColor,outlineWidth:s.textOutlineWidth,backgroundEnabled:s.textBackgroundEnabled,backgroundColor:s.textBackgroundColor,backgroundOpacity:s.textBackgroundOpacity},nodes=document.querySelectorAll('.name,.sender,.number,.status,.signs span'),stroke=fx.outlineEnabled?Math.max(0,Math.min(10,+fx.outlineWidth||0))+'px '+(fx.outlineColor||'#000'):'0 transparent',bg=fx.backgroundEnabled?rgbaTextBg(fx.backgroundColor||'#000',Math.max(0,Math.min(100,+fx.backgroundOpacity||0))/100):'';nodes.forEach(node=>{node.style.webkitTextStroke=stroke;node.style.paintOrder='stroke fill';node.style.backgroundColor=bg;node.style.boxDecorationBreak='clone';node.style.webkitBoxDecorationBreak='clone';node.style.borderRadius='6px';node.style.padding=fx.backgroundEnabled?'1px 5px':''})}async function refreshGlobalTextFx(){try{applyGlobalTextFx(await(await fetch('/api/state',{cache:'no-store'})).json())}catch(e){}}refreshGlobalTextFx();setInterval(refreshGlobalTextFx,1000);
</script></body></html>
