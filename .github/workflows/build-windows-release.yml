name: Build Windows app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach the EXE to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Python for the build only
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install packaged app dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Build standalone EXE
        shell: cmd
        run: build_windows_app.bat

      - name: Attach EXE to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" "dist/Live_Overlay_Studio_Windows_x64.exe" --clobber
