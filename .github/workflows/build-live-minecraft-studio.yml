name: Build Live Minecraft Studio

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing minecraft-v release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'minecraft-v')
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run tests
        working-directory: live_minecraft_studio
        run: python -m unittest discover -s tests -v

      - name: Build standalone EXE
        working-directory: live_minecraft_studio
        run: python build_windows_app.py

      - name: Attach EXE to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" "live_minecraft_studio/dist/Live_Minecraft_Studio_Windows_x64.exe" --clobber
